<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>mechbench · 装配实验室</title>
<style>
:root{--ink:#1d2228;--muted:#63707d;--line:#cfd6dc;--accent:#c2452d;--steel:#4d5966;--gold:#b8862f}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:#dfe4e8;color:var(--ink);
  font:14px/1.55 "Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:26px 40px 18px;max-width:1360px;margin:0 auto}
.mark{width:40px;height:40px;border-radius:9px;background:var(--steel);position:relative;overflow:hidden;flex:none}
.mark:before,.mark:after{content:"";position:absolute;border-radius:2px}
.mark:before{left:7px;top:10px;width:10px;height:19px;background:var(--accent)}
.mark:after{left:22px;top:7px;width:10px;height:19px;background:#9aa6b2}
header h1{font-size:22px;margin:0;letter-spacing:-.4px}
header p{margin:2px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
header .count{margin-left:auto;font-size:11px;color:var(--muted)}
main{max-width:1360px;margin:0 auto;padding:0 40px 60px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
a.item{display:block;background:#fbfcfd;border:1px solid var(--line);border-bottom:4px solid #b2bec8;
  border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
a.item:hover{transform:translateY(-2px);border-color:#b7c3cd;border-bottom-color:var(--accent)}
.thumb{aspect-ratio:16/10;background:linear-gradient(150deg,#e9edf0,#d7dee4);display:block;width:100%;object-fit:cover}
.body{padding:13px 15px 15px}
.body strong{display:block;font-size:14.5px;letter-spacing:-.2px}
.body small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.meta span{font-size:9.5px;padding:3px 7px;border-radius:5px;background:#eef2f5;color:#5b6b78}
.meta span.solid{background:#e8f1f6;color:#2f6f9f}
footer{max-width:1360px;margin:0 auto;padding:0 40px 40px;font-size:11px;color:#7d8b98;line-height:1.8}
footer code{background:#e7ecf0;padding:1px 5px;border-radius:4px}
.empty{border:2px dashed #c3ccd5;border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header,main,footer{padding-left:20px;padding-right:20px}}
@media(max-width:640px){.grid{grid-template-columns:1fr}header h1{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true"></div>
  <div><h1>mechbench 装配实验室</h1><p>真实机械 · 拆开 · 装上 · 看懂它怎么动</p></div>
  <div class="count">2 个物品</div>
</header>
<main>
  <div class="grid"><a class="item" href="./double-cylinder-engine.html"><img class="thumb" src="./accept/double-cylinder-engine/double-cylinder-engine-card.png" alt="" loading="lazy"><div class="body"><strong>双缸发动机装配实验室</strong><small>360° 并列双缸 · 26 组零件 · 3 关</small><div class="meta"><span>3 关</span><span>10 模块</span><span class="solid">三维</span></div></div></a><a class="item" href="./electric-toothbrush.html"><img class="thumb" src="./accept/electric-toothbrush/electric-toothbrush-card.png" alt="" loading="lazy"><div class="body"><strong>牙刷装配实验室</strong><small>把原理，一块一块拼出来 · 10 模块 · 3 关</small><div class="meta"><span>3 关</span><span>10 模块</span><span class="solid">三维</span></div></div></a></div>
</main>
<footer>
  每个物品是独立可交付的单文件页面；布局与交互由 <code>kit/</code> 固化，物品只提供几何与文案。
  <br>新增物品：<code>python3 tools/make-item.py &lt;slug&gt;</code> → 填 4 个文件 → <code>python3 tools/build.py all</code>
</footer>
</body>
</html>
