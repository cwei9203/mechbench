<!doctype html>
<!-- mechbench · 固定页面骨架。物品不许改这个文件；个性化一律走插槽（kit/slots.md）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>装配实验室</title>
<style>/* mechbench · 固定布局层
 * 只放"所有物品共用"的东西：区域、断点、控件外观、无障碍焦点。
 * 物品自己的视觉微调写在 items/<slug>/lab.css。
 */

:root{
  --ink:#1d2228; --muted:#63707d; --line:#cfd6dc; --stage:#e7ebee; --paper:#f8fafb;
  --accent:#c2452d; --accent-dark:#93301e;
  --steel:#4d5966; --blue:#2f6f9f; --green:#2f7d5c; --gold:#b8862f;
  --topbar-h:70px; --coach-w:344px; --tray-h:182px; --radius:9px;
}

*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:#dfe4e8;color:var(--ink);
  font:14px/1.5 "Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#fff;
  border-radius:var(--radius);padding:8px 13px;font-weight:600;transition:background .14s,transform .1s}
button:hover:not(:disabled){background:#f4f7f9}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid #d99b2b;outline-offset:2px}
button[aria-pressed=true]{background:var(--steel);color:#fff;border-color:var(--steel)}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 0 var(--accent-dark)}
.primary:hover:not(:disabled){background:#b03c26}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- 顶栏 ---------- */
.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:22px;padding:0 24px;
  border-bottom:1px solid var(--line);background:#f7f9fa}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--steel);position:relative;overflow:hidden;flex:none}
.mark svg{display:block;width:100%;height:100%}
.brand strong{display:block;font-size:16px;letter-spacing:-.2px}
.brand small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.journey{list-style:none;display:flex;gap:6px;margin:0 auto;padding:0}
.journey li{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8b98a4;white-space:nowrap}
.journey b{width:23px;height:23px;display:grid;place-items:center;border:1px solid #cbd4dc;border-radius:50%;font-size:11px}
.journey .active{color:var(--accent);font-weight:700}
.journey .active b{background:var(--accent);color:#fff;border-color:var(--accent)}
.journey .done{color:var(--green)}
.journey .done b{background:#e3f1ea;border-color:#a9cdbc}
.topacts{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.topacts .ghost{font-size:11px;padding:6px 10px;border-radius:999px;background:#fff}
.topacts .ghost:hover{border-color:var(--accent);color:var(--accent)}
.topacts .bare{font-size:11px;background:transparent;border-color:transparent;padding:6px}

/* ---------- 主网格 ---------- */
.lab{display:grid;grid-template-columns:minmax(0,1fr) var(--coach-w);
  grid-template-rows:minmax(420px,1fr) var(--tray-h);
  grid-template-areas:"stage coach" "tray coach";
  height:calc(100dvh - var(--topbar-h));min-height:640px}
.stage{grid-area:stage;position:relative;overflow:hidden;min-width:0;background-color:var(--stage);
  background-image:radial-gradient(#c6cfd7 1px,transparent 1px);background-size:24px 24px}
#viewport{position:absolute;inset:0}
#viewport canvas{display:block;touch-action:none}
.stage-title{position:absolute;top:18px;left:22px;pointer-events:none;max-width:360px}
.stage-title h1{font-size:27px;line-height:1.2;margin:0 0 5px;letter-spacing:-.6px;font-weight:800}
.stage-title p{margin:0;font-size:11px;color:var(--muted)}
.toolbar{position:absolute;top:18px;right:16px;display:flex;flex-wrap:wrap;gap:5px;max-width:250px;justify-content:flex-end}
.toolbar button{font-size:10.5px;padding:6px 10px;background:#fffefbe8}
.toolbar button[aria-pressed=true]{background:var(--steel);color:#fff;border-color:var(--steel)}
.socket{position:absolute;z-index:4;transform:translate(-50%,-50%);background:var(--accent);color:#fff;
  border:2px solid #fff;border-radius:20px;box-shadow:0 2px 0 #8f2d1b,0 3px 12px #c2452d30;
  white-space:nowrap;font-size:11px;padding:6px 12px}
.socket.near{background:var(--green);box-shadow:0 0 0 8px #2f7d5c22}
.preview-label{position:absolute;pointer-events:none;transform:translate(-50%,0);background:#fff6ec;
  border:1px solid #e2b393;border-radius:6px;padding:3px 8px;font-size:10px;color:#96562f;white-space:nowrap}
.scene-footer{position:absolute;bottom:12px;left:20px;right:20px;display:flex;align-items:flex-end;
  justify-content:space-between;gap:12px;pointer-events:none}
.scene-footer>span{font-size:9.5px;color:#7d8b98;line-height:1.6;max-width:44%}
.readout{display:none;background:#ffffffef;border:1px solid #ccd6de;border-radius:var(--radius);
  padding:8px 12px;min-width:196px;pointer-events:auto}
.readout.on{display:block}
.readout .row{display:flex;justify-content:space-between;gap:12px;font-size:10.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;line-height:1.75}
.readout .row b{color:var(--ink);font-weight:700}
.readout .big{font-size:12px;color:var(--steel);font-weight:800}
#inset{position:absolute;left:22px;bottom:91px;z-index:5;width:192px;height:188px;border:1px solid #c3ccd5;
  border-radius:12px;overflow:hidden;pointer-events:none;box-shadow:0 4px 16px #1d22281a}
#inset[hidden]{display:none}
#inset .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:10px;
  padding:7px 10px;font-size:10px;color:var(--muted);background:#f5f9ffeb;
  border-bottom:1px solid var(--line)}
#inset .top span:last-child{letter-spacing:.12em;font-size:8.5px}
.discovery{margin-top:12px;border-left:3px solid var(--gold);background:#fdf8ea;border-radius:8px;
  padding:9px 11px;font-size:11px;line-height:1.75;color:#7a5c1e}
.discovery[hidden]{display:none}
.discovery b{display:block;font-size:10.5px;margin-bottom:3px;color:#8a6a1c}
#celebration{position:fixed;inset:0;pointer-events:none;z-index:40;display:grid;place-items:center}
#celebration i{position:absolute;width:9px;height:9px;border-radius:2px;opacity:0;
  animation:confetti 1.1s ease-out forwards}
@keyframes confetti{
  0%{opacity:1;transform:translate(0,0) rotate(0)}
  100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
#fault{position:absolute;inset:34% 12%;z-index:20;background:#fff;padding:18px;border:2px solid #e0b088;
  border-radius:10px;color:#7c4a22;display:none;font-size:13px}

/* ---------- 教练面板 ---------- */
.coach{grid-area:coach;background:var(--paper);border-left:1px solid var(--line);padding:22px 22px 26px;overflow:auto}
.coach .ctag{color:var(--accent);font-weight:700;font-size:11px;margin-bottom:6px}
.coach h2{font-size:21px;line-height:1.28;margin:0 0 8px;letter-spacing:-.4px;font-weight:800}
.coach .intro{font-size:12px;line-height:1.8;color:var(--muted);margin:0 0 16px}
.progress{height:6px;border-radius:6px;background:#e0e7ec;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;background:var(--accent);height:100%;width:0;transition:width .3s}
.plabel{font-size:10px;color:var(--muted);display:flex;justify-content:space-between}
.task{margin-top:18px}
.task .label{font-size:10px;color:var(--muted);margin:0 0 4px}
.task h3{font-size:17px;line-height:1.4;margin:0 0 8px;font-weight:750}
.task p{font-size:12px;line-height:1.8;margin:0 0 10px}
.task .action{width:100%;margin-top:6px}
.sub{display:flex;gap:6px;margin-top:10px}
.sub button{font-size:11px;padding:7px 9px;flex:1}
.feedback{min-height:40px;padding:9px 11px;background:#e9eef3;border-radius:8px;font-size:11px;
  line-height:1.7;margin:16px 0 0;border-left:3px solid #8fa4b8}
.feedback.error{background:#fdf0e8;border-color:#d59a6c;color:#7c4a22}
.feedback.success{background:#e8f3ed;border-color:#77b295;color:#2f6b52}
.hintbox{border-top:1px solid var(--line);padding-top:14px;margin-top:16px;font-size:11px;line-height:1.8;color:var(--muted)}
.hintbox b{display:block;font-size:11px;color:#8a6a1c;margin-bottom:4px}
.options{display:grid;gap:7px;margin-top:12px}
.options button{text-align:left;font-size:12px;font-weight:500;padding:10px 11px;line-height:1.6}
.options button b{display:inline-block;color:var(--accent);margin-right:7px}
.badge{display:grid;place-items:center;width:66px;height:66px;background:var(--gold);color:#fff;
  border:5px solid #e4c98c;border-radius:50%;margin:10px 0;font-size:28px;font-weight:800}
.earned{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.earned span{border:1px solid #ddc98d;background:#fbf5e3;color:#8a6a1c;font-size:9px;padding:3px 6px;border-radius:5px}
.technical{font-size:10px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line);margin-top:18px;padding-top:11px}
.technical summary{cursor:pointer;font-weight:600}
.technical p{margin:8px 0 0}
.note{font-size:10.5px!important;color:var(--muted)}

/* ---------- 实验台控件（experiments 插槽） ---------- */
.labctl{margin-top:12px;font-size:11px}
.labctl output{float:right;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.labctl input[type=range]{width:100%;accent-color:var(--blue);margin:8px 0 0}
.labctl.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.labgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.labgrid .primary{grid-column:1/-1}
.labgrid button{font-size:11px;padding:8px 6px}

/* ---------- 零件盒 ---------- */
.tray{grid-area:tray;border-top:2px solid #c3ccd5;padding:12px 22px 14px;background:#dae1e7;min-width:0;overflow:auto}
.tray-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:12px;font-weight:700;gap:12px}
.tray-head small{font-size:10px;color:#7c8a96;font-weight:400;text-align:right}
.mlist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card{position:relative;border:1px solid #c3ccd5;border-bottom:4px solid #b2bec8;background:#fbfcfd;
  border-radius:10px;display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:6px;
  text-align:left;padding:10px 9px;min-height:74px;--pc:#5b6470}
.card svg{width:34px;height:34px;stroke:var(--pc);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.card strong{font-size:11.5px;display:block;line-height:1.3}
.card small{font-size:9.5px;color:var(--muted);font-weight:400;display:block;margin-top:3px}
.card[aria-pressed=true]{border-color:#d99878;border-bottom-color:var(--accent);background:#fdf1ea;color:var(--ink)}
.card[data-installed=true]{background:#e9f2ec;border-color:#b2cec0;border-bottom-color:#9dbfae}
.card[data-installed=true] small{color:var(--green)}
.empty{font-size:12px;color:#5f7488;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}
.empty strong{display:block;color:#2f4c63;margin-bottom:4px}
.empty .primary{flex:none}

#debug{display:none;position:fixed;left:0;bottom:0;background:#fff;font-size:10px;z-index:30;padding:2px}

/* ---------- 断点 ---------- */
@media(max-width:1180px){
  .lab{grid-template-columns:minmax(0,1fr) 306px}
  .coach{padding:20px 16px}
  .card{grid-template-columns:1fr;text-align:center;padding:9px 6px}
  .card svg{display:none}
  .mlist{gap:6px}
}
@media(max-width:780px){
  .topbar{height:auto;min-height:96px;padding:12px 14px 8px;flex-wrap:wrap;gap:8px}
  .brand{min-width:0;flex:1}
  .brand strong{font-size:13.5px}
  .brand small{font-size:9px}
  .journey{order:3;width:100%;justify-content:space-between;margin:0;gap:2px}
  .journey li{font-size:9.5px;gap:5px;min-width:0}
  .journey b{width:19px;height:19px;font-size:9.5px}
  .tray-head small{max-width:130px;font-size:9px}
  .lab{grid-template-columns:1fr;grid-template-areas:"stage" "tray" "coach";
    grid-template-rows:minmax(360px,56dvh) auto auto;height:auto;min-height:0}
  .stage-title h1{font-size:21px}
  .stage-title{max-width:calc(100% - 172px)}
  .toolbar{top:14px;max-width:150px}
  .mlist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{grid-template-columns:32px minmax(0,1fr);text-align:left;min-height:62px}
  .card svg{display:block;width:28px;height:28px}
  .coach{border-left:0;border-top:1px solid var(--line);padding:20px}
  #inset{left:12px;bottom:12px;width:132px;height:150px}
  .readout{min-width:0;padding:6px 9px}
  .readout .row{font-size:9.5px;gap:8px}
  .scene-footer>span{max-width:150px;font-size:8.5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<header class="topbar">
  <div class="brand">
    <div class="mark" data-slot="brand.mark" aria-hidden="true"></div>
    <div><strong data-slot="brand.title"></strong><small data-slot="brand.subtitle"></small></div>
  </div>
  <ol class="journey" data-slot="journey" aria-label="关卡进度"></ol>
  <div class="topacts">
    <button class="ghost" id="free-lab">自由实验</button>
    <button class="bare" id="restart">重新开始</button>
  </div>
</header>

<main class="lab">
  <section class="stage" id="stage" aria-label="三维装配工作台">
    <div id="viewport"></div>
    <div class="stage-title">
      <h1 data-slot="stage.title"></h1>
      <p data-slot="stage.hint"></p>
    </div>
    <div class="toolbar" data-slot="stage.tools" aria-label="观察工具"></div>
    <button class="socket" id="socket" hidden>装到这里</button>
    <div class="preview-label" id="preview-label" hidden>拖动这块</div>
    <div class="scene-footer">
      <span data-slot="stage.gestures"></span>
      <div class="readout" id="readout" data-slot="stage.readout"></div>
    </div>
    <div id="inset" hidden><div class="top"><span id="inset-title">局部放大</span><span>DETAIL VIEW</span></div></div>
    <div id="fault" role="alert"></div>
  </section>

  <aside class="coach">
    <div class="ctag" data-slot="coach.tag"></div>
    <h2 data-slot="coach.title"></h2>
    <p class="intro" data-slot="coach.intro"></p>
    <div class="progress" role="progressbar" aria-label="装配进度" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" id="progress"><i id="pfill"></i></div>
    <div class="plabel"><span id="plabel"></span><span id="bcount"></span></div>
    <div class="task" id="task"></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="discovery" id="discovery" hidden><b>刚刚发现</b><span id="discovery-text"></span></div>
    <div class="hintbox"><b data-slot="coach.hintLabel"></b><span id="hinttext"></span></div>
    <div data-slot="coach.extras"></div>
    <details class="technical" id="notes">
      <summary data-slot="coach.notesLabel"></summary>
      <div data-slot="coach.notes"></div>
    </details>
  </aside>

  <section class="tray" aria-label="零件盒">
    <div class="tray-head"><span id="tray-title"></span><small id="tray-hint"></small></div>
    <div class="mlist" id="mlist"></div>
  </section>
</main>
<script>window.__mechbench={slug:'spherical-lock',built:true}</script>

<div id="celebration" aria-hidden="true"></div>
<pre id="debug"></pre>

<script>
window.addEventListener('error', e => {
  const el = document.getElementById('fault');
  el.style.display = 'block';
  el.textContent = '工作台未能加载：' + e.message;
});
</script>

/* ==== kit/icons.mjs ==== */
/* mechbench · 通用零件图标（24×24，描边）

 */
const ICONS = {

  shell:'<path d="M4 9l8-4 8 4v7l-8 4-8-4z"/><path d="M4 9l8 4 8-4M12 13v7"/>',

  plate:'<path d="M4 14l8-4 8 4-8 4z"/><path d="M7 13l3 1.5"/>',
  disc:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/>',
  piston:'<path d="M7 5h10v7H7z"/><path d="M10 12v6M14 12v6"/><path d="M7 8h10"/>',
  valve:'<path d="M12 4v9"/><path d="M8 16h8l-4 4z"/><path d="M9 4h6"/>',
  coil:'<circle cx="12" cy="12" r="6"/><path d="M12 6v12M9 6.8v10.4M15 6.8v10.4"/>',
  battery:'<rect x="3" y="8" width="15" height="8" rx="1.5"/><path d="M21 11v2"/><path d="M7 10v4M11 10v4"/>',
  bolt:'<path d="M12 4l5 3v6l-5 3-5-3V7z"/><circle cx="12" cy="10" r="2"/>',

function iconSvg(name, color) {
  const body = ICONS[name] || ICONS.box;
  return `<svg viewBox="0 0 24 24" aria-hidden="true"${color ? ` style="--pc:${color}"` : ''}>${body}</svg>`;

/* ==== kit/lab.mjs ==== */
/* mechbench · 布局渲染层
 * 把 manifest 的插槽填进固定骨架，并把玩家操作转成事件。
 * 不做三维（kit/scene.mjs）、不做业务规则（物品的 logic.mjs / main.mjs）。
 */

const COPY = {
  brand: { title: '装配实验室', subtitle: '', mark: { a: '#c2452d', b: '#9aa6b2' } },
  stage: {
    title: '装一台能动的机器',

  tray: { title: '零件盒', hint: '点选模块，再拖到高亮位置' },

  tools: [

  ],
  labels: {
    exp: '本关要观察的', quiz: '判断一下', done: '本关完成',
    installed: '✓ 已归位', picked: '拿起这块', preloaded: '{n} 组零件预装',
  },
};

const q = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function pick(base, over) {
  const out = { ...base };

    size.set(Math.max(size.x, 30), Math.max(size.y, 30), Math.max(size.z, 30));
    return { center: b.getCenter(vec()), size, dir, fit: f.fit || 1.75 };
  }

  function fitCamera(name = cfg.camera.defaultFocus) {
    view.focus = name;
    const { center, size, dir, fit } = focusSpec(name);
    const f = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const narrow = stageEl.clientWidth < 620;
    const usableW = stageEl.clientWidth - (narrow ? 40 : 90);
    const usableH = stageEl.clientHeight - (narrow ? 150 : 40);
    const dist =
      Math.max(
        (size.y / (2 * f)) * (stageEl.clientHeight / usableH),
        (size.x / (2 * f * camera.aspect)) * (stageEl.clientWidth / usableW)
      ) * fit + 40;
    const [yaw, pitch] = dir.map((d) => (d * Math.PI) / 180);
    camera.position.copy(center).add(vec(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(dist));
    controls.target.copy(center);
    controls.update();
  }

  let userNavigated = false;
  controls.addEventListener('start', () => {
    userNavigated = true;
  });

  /* ---------- 导航 ---------- */
  function setNavigation(mode) {
    view.navigation = mode;
    controls.mouseButtons.LEFT = mode === 'pan' ? THREE.MOUSE.PAN : THREE.MOUSE.ROTATE;
    controls.touches.ONE = mode === 'pan' ? THREE.TOUCH.PAN : THREE.TOUCH.ROTATE;
    for (const b of document.querySelectorAll('[data-tool]')) {
      if (b.dataset.tool === 'rotate' || b.dataset.tool === 'pan') b.setAttribute('aria-pressed', String(b.dataset.tool === mode));
    }
    renderer.domElement.style.cursor = mode === 'pan' ? 'move' : 'grab';
  }

  /* ---------- 屏幕坐标 ---------- */
  function project(v) {
    const p = v.clone().project(camera);
    return { x: (p.x * 0.5 + 0.5) * stageEl.clientWidth, y: (-0.5 * p.y + 0.5) * stageEl.clientHeight };
  }

  function nearTarget(id) {
    const next = opts.nextModule ? opts.nextModule() : null;
    if (!next || !info.get(id)) return false;
    const a = project(info.get(id).center.clone().add(view.offsets.get(id) || vec()));
    const b = project(info.get(next.id).center);
    const r = stageEl.clientWidth < 620 ? cfg.nearRadius.narrow : cfg.nearRadius.wide;
    return Math.hypot(a.x - b.x, a.y - b.y) < r;
  }

  function overlay() {
    const s = state();
    const next = opts.nextModule ? opts.nextModule() : null;
    const showSocket = !!next && s.phase === 'build' && !s.lab;
    if (socketEl) {
      socketEl.hidden = !showSocket;
      if (showSocket) {
        const md = info.get(next.id);
        const p = project(vec(md.center.x, md.bounds.max.y + 16, md.center.z));
        socketEl.style.left = p.x + 'px';
        socketEl.style.top = p.y + 'px';
        socketEl.disabled = !s.selected;
        socketEl.classList.toggle('near', !!s.selected && nearTarget(s.selected));
      }
    }
    const sel = s.selected && info.get(s.selected);
    if (previewEl) {
      previewEl.hidden = !sel || s.phase !== 'build';
      if (sel) {
        const c = sel.center.clone().add(view.offsets.get(sel.id) || vec());
        const p = project(vec(c.x, c.y + sel.size.y / 2 + 14, c.z));
        previewEl.style.left = p.x + 'px';
        previewEl.style.top = p.y + 'px';
      }
    }
    if (next) setTarget(next.parts);
    else setTarget(null);
  }

  /* ---------- 拾取与拖放 ---------- */
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const clickables = [];
  for (const p of model.PARTS || []) p.g.traverse((o) => o.isMesh && clickables.push(o));

  function rayAt(e) {
    const r = renderer.domElement.getBoundingClientRect();
    pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, 1 - ((e.clientY - r.top) / r.height) * 2);
    raycaster.setFromCamera(pointer, camera);
  }
  const visibleIn = (o) => {
    for (let x = o; x; x = x.parent) if (!x.visible) return false;
    return true;
  };
  function pickKey(e) {
    rayAt(e);
    const hit = raycaster.intersectObjects(clickables.filter(visibleIn), false)[0];
    if (!hit) return null;
    let o = hit.object;
    while (o && !o.userData.key) o = o.parent;
    return o ? o.userData.key : null;
  }

  const canDrag = () => (opts.canDrag ? opts.canDrag() : true) && view.navigation !== 'pan';
  let downPt = null;

  renderer.domElement.addEventListener('pointerdown', (e) => {
    downPt = { x: e.clientX, y: e.clientY };
  }, { capture: true });

  renderer.domElement.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || !canDrag()) return;
    const s = state();
    const m = info.get(s.selected);
    if (!m) return;
    rayAt(e);
    const objs = m.parts.map((k) => byKey.get(k).g).filter(Boolean);
    const hit = raycaster.intersectObjects(objs, true).find((h) => visibleIn(h.object));
    if (!hit) return;
    const off = view.offsets.get(m.id) || vec();
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(camera.getWorldDirection(vec()), m.center.clone().add(off));
    const point = raycaster.ray.intersectPlane(plane, vec());
    if (!point) return;
    view.drag = { id: m.id, pointerId: e.pointerId, plane, start: point.clone(), offset: off.clone() };
    controls.enabled = false;
    renderer.domElement.setPointerCapture?.(e.pointerId);
    renderer.domElement.style.cursor = 'grabbing';
    e.preventDefault();
    e.stopImmediatePropagation();
  }, { capture: true });

  renderer.domElement.addEventListener('pointermove', (e) => {
    if (!view.drag || view.drag.pointerId !== e.pointerId) return;
    rayAt(e);
    const p = raycaster.ray.intersectPlane(view.drag.plane, vec());
    if (p) {
      if (!view.offsets.has(view.drag.id)) view.offsets.set(view.drag.id, vec());
      view.offsets.get(view.drag.id).copy(view.drag.offset).add(p.sub(view.drag.start));
    }
    socketEl?.classList.toggle('near', nearTarget(view.drag.id));
    e.preventDefault();
    e.stopImmediatePropagation();
  }, { capture: true });

  function releaseDrag(e, cancel) {
    if (!view.drag || view.drag.pointerId !== e.pointerId) return;
    const id = view.drag.id;
    const onTarget = !cancel && nearTarget(id);
    view.drag = null;
    controls.enabled = true;
    renderer.domElement.releasePointerCapture?.(e.pointerId);
    setNavigation(view.navigation);
    socketEl?.classList.remove('near');
    if (!cancel && onTarget) opts.onDrop?.(id, true);
    else if (!cancel) opts.onDrop?.(id, false);
    e.stopImmediatePropagation();
  }
  renderer.domElement.addEventListener('pointerup', (e) => releaseDrag(e, false), { capture: true });
  renderer.domElement.addEventListener('pointercancel', (e) => releaseDrag(e, true), { capture: true });

  renderer.domElement.addEventListener('click', (e) => {
    // 旋转/平移后松手也会派发 click：位移 > 5px 就不算点击
    if (downPt && Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y) > 5) return;
    if (view.drag) return;
    const k = pickKey(e);
    if (k && opts.onPickKey) opts.onPickKey(k, view.focus === k);
  });

  /* ---------- 局部放大窗（同一个 canvas 里用 scissor 画第二视角） ---------- */
  const insetEl = document.getElementById('inset');
  const insetCam = new THREE.PerspectiveCamera(cfg.inset?.fov || 36, 1, cfg.inset?.near || 0.1, cfg.inset?.far || 500);
  function drawInset() {
    if (!insetEl || !cfg.inset) return;
    const s = state();
    const ic = cfg.inset;
    const fits = stageEl.clientWidth > (ic.minWidth || 760) && stageEl.clientHeight > (ic.minHeight || 430);
    const spec = fits && ic.visible?.(s, view) ? ic.target?.(s, view) : null;
    const part = spec && byKey.get(spec.part);
    insetEl.hidden = !part;
    if (!part) return;
    const title = insetEl.querySelector('#inset-title');
    if (title && spec.title) title.textContent = spec.title;
    const target = part.g.localToWorld(vec(...(spec.local || [0, 0, 0])));
    insetCam.position.copy(target).add(vec(...spec.offset));
    insetCam.lookAt(target);
    const r = insetEl.getBoundingClientRect(), base = stageEl.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    insetCam.aspect = r.width / r.height;
    insetCam.updateProjectionMatrix();
    const x = r.left - base.left, y = stageEl.clientHeight - (r.bottom - base.top);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, stageEl.clientWidth, stageEl.clientHeight);
    renderer.setScissor(x, y, r.width, r.height);
    renderer.setViewport(x, y, r.width, r.height);
    renderer.setScissorTest(true);
    renderer.clearDepth();
    renderer.render(scene, insetCam);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, stageEl.clientWidth, stageEl.clientHeight);
  }

  /* ---------- 像素探针：给验收用，肉眼看不到的"空"要能被机器测出来 ---------- */
  // 必须在渲染循环里紧接着 render() 读，否则默认帧缓冲内容已经丢弃（读到全 0）
  const pendingProbes = [];
  function probe(rect) {
    return new Promise((res) => pendingProbes.push({ rect, res }));
  }
  function runProbes() {
    if (!pendingProbes.length) return;
    const gl = renderer.getContext();
    const pr = renderer.getPixelRatio();
    const H = renderer.domElement.height;
    for (const { rect, res } of pendingProbes.splice(0)) {
      const x = Math.max(0, Math.round(rect.x * pr));
      const y = Math.max(0, Math.round(H - (rect.y + rect.height) * pr));
      const w = Math.max(1, Math.round(rect.width * pr));
      const h = Math.max(1, Math.round(rect.height * pr));
      const buf = new Uint8Array(w * h * 4);
      gl.readPixels(x, y, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      const colors = new Set();
      const rows = new Array(h).fill(0);
      const cols = new Array(w).fill(0);
      let lit = 0;
      for (let j = 0; j < h; j++) {
        for (let i = 0; i < w; i++) {
          const k = ((h - 1 - j) * w + i) * 4;
          const r = buf[k], g = buf[k + 1], b = buf[k + 2], a = buf[k + 3];
          // 画布是 alpha:true 的清屏，舞台底色是 CSS 背景 → alpha 就是最干净的"有没有物体"判据
          if (a < 8) continue;
          colors.add((r >> 3) * 1024 + (g >> 3) * 32 + (b >> 3));
          rows[j]++;
          cols[i]++;
          lit++;
        }
      }
      res({ colors: colors.size, lit, rows, cols, w, h });
    }
  }

  /* ---------- 尺寸与循环 ---------- */
  function resize() {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    if (!userNavigated) fitCamera(view.focus);
  }
  new ResizeObserver(resize).observe(stageEl);

  function start() {
    let prev = performance.now();
    renderer.setAnimationLoop((now) => {
      const dt = Math.min(0.05, Math.max(0, (now - prev) / 1000));
      prev = now;
      opts.tick?.(dt);
      render(dt);
      controls.update();
      overlay();
      renderer.render(scene, camera);
      drawInset();
      runProbes();
    });
  }

  resize();
  render(1);
  fitCamera(view.focus);

  return {
    view, renderer, scene, camera, controls, info, spawn: SPAWN, fitCamera, setNavigation, project,
    nearTarget, overlay, render, start, setTarget, resize, probe,
    get solidScreen() {
      return renderer.domElement;
    },
  };
}

 * ================================================================ */
const parts = [], byKey = new Map(), R = { pins: [] };
function addPart(k, obj, mat, opt = {}) {
  obj.traverse(o => {
    if (!o.isMesh) return;
    if (!o.userData.keepMat) o.material = mat.clone();
    o.userData.omat = o.material;
    o.castShadow = true; o.receiveShadow = true; o.userData.key = k;
  });
  const g = new THREE.Group(); g.userData.key = k; g.add(obj);
  world.add(g);
  const p = { key: k, name: PART_NAMES[k] || k, g, obj, shell: !!opt.shell };
  parts.push(p); byKey.set(k, p); return p;
}

/* ---------- 门板局部（四段：Ø55.2 通孔 + Ø25.4 边孔 + 面板沉槽，互不重叠） ---------- */
{
  const g = new THREE.Group();
  const X0 = -D.doorX, X1 = D.doorX, Y0 = -D.doorY, Y1 = D.doorY;
  // 后段 z -60..-27.6（沿 z 挤出）
  const sA = new THREE.Shape();
  sA.moveTo(X0, Y0); sA.lineTo(X1, Y0); sA.lineTo(X1, Y1); sA.lineTo(X0, Y1); sA.closePath();
  const bz = D.boreR;                            // 分段正好在孔的最大 z 处
  const gA = new THREE.ExtrudeGeometry(sA, { depth: -bz - D.doorZBack, bevelEnabled: false });
  gA.translate(0, 0, D.doorZBack); g.add(mesh(gA, MAT.wood));
  // 锁孔段 z -27.6..27.6（沿 x 挤出，形状含通孔）
  const ySlot = D.edgeBoreR, zMeet = Math.sqrt(D.boreR ** 2 - ySlot ** 2);
  const aMeet = Math.asin(ySlot / D.boreR);
  const sB = shapeFromPts([[bz, Y0], [bz, -ySlot], [zMeet, -ySlot]]
    .concat(circlePts(D.boreR, 0, 0, 48, -aMeet, -Math.PI * 2 + aMeet))
    .concat([[zMeet, ySlot], [bz, ySlot], [bz, Y1], [-bz, Y1], [-bz, Y0]]));
  g.add(mesh(extrudeAlongX(sB, D.doorX * 2, X0), MAT.wood));
  // 边孔段 z 27.6..57.5（沿 z 挤出，形状含 Ø25.4）
  const sC = new THREE.Shape();
  sC.moveTo(X0, Y0); sC.lineTo(X1, Y0); sC.lineTo(X1, Y1); sC.lineTo(X0, Y1); sC.closePath();
  sC.holes.push(holeCircle(D.edgeBoreR));
  const gC = new THREE.ExtrudeGeometry(sC, { depth: D.faceZ - D.faceT - bz, bevelEnabled: false });
  gC.translate(0, 0, bz); g.add(mesh(gC, MAT.woodDark));
  // 面板沉槽段 z 57.5..60
  const sD = new THREE.Shape();
  sD.moveTo(X0, Y0); sD.lineTo(X1, Y0); sD.lineTo(X1, Y1); sD.lineTo(X0, Y1); sD.closePath();
  sD.holes.push(rectHole(-D.faceW / 2, -D.faceH / 2, D.faceW / 2, D.faceH / 2));
  const gD = new THREE.ExtrudeGeometry(sD, { depth: D.faceT, bevelEnabled: false });
  gD.translate(0, 0, D.faceZ - D.faceT); g.add(mesh(gD, MAT.wood));
  addPart('door', g, MAT.wood);
  R.doorMeshes = [];
  g.traverse(o => { if (o.isMesh) R.doorMeshes.push(o); });
}

/* ---------- 门框（锁舌窝，开 28×80 教学观察窗） ---------- */
{
  const g = new THREE.Group(), zA = 63, zB = 75, zc = (zA + zB) / 2;
  const add = (w, h, x, y) => g.add(box(w, h, zB - zA, MAT.woodDark, x, y, zc));

/* ---------- 锁舌组件：壳 / 斜舌 / 弹簧 / 拨片 / 面板 / 面板螺丝 ---------- */
{
  const hs = new THREE.Group();
  // 锁舌壳开 100° 教学观察窗（+y 方向）
  const winA = 40 * Math.PI / 180, winB = 140 * Math.PI / 180;
  hs.add(mesh(extrudeAlongZ(annulusSector(D.tubeR1, D.tubeR0, winB, winA + Math.PI * 2), D.tubeZ1 - D.tubeZ0, D.tubeZ0), MAT.dark));
  // 前端整圈（锁舌出口导套）
  const frontRing = new THREE.Shape(circlePts(D.tubeR1, 0, 0, 40).map(([x, y]) => new THREE.Vector2(x, y)));
  const frontHole = new THREE.Path(); frontHole.absarc(0, 0, D.tubeR0, 0, Math.PI * 2, true); frontRing.holes.push(frontHole);
  hs.add(mesh(extrudeAlongZ(frontRing, 1.2, D.tubeZ1 - 1.2), MAT.dark));
  // 弹簧后座：内缘 Ø16.4 让拨片颈穿过
  hs.add(mesh(latheZ([[D.tubeZ0 - .2, 8.2], [D.tubeZ0 - .2, D.tubeR0], [D.tubeZ0, D.tubeR0], [D.tubeZ0, 8.2], [D.tubeZ0 - .2, 8.2]]), MAT.dark));
  addPart('latchHousing', hs, MAT.dark, { shell: true });

  const bw = D.boltW / 2;
  const bp = new THREE.Shape();
  bp.moveTo(-bw, -D.boltL); bp.lineTo(-bw, 0); bp.lineTo(0, 0); bp.lineTo(bw, -11); bp.lineTo(bw, -D.boltL); bp.closePath();
  const boltG = extrudeAlongY(bp, D.boltH, D.boltH / 2);
  boltG.translate(0, 0, D.faceZ + D.throw);
  const bolt = new THREE.Group(); bolt.add(mesh(boltG, MAT.steel));
  addPart('latchBolt', bolt, MAT.steel);

  const spring = new THREE.Group();
  const coil = coilZ(7.5, .45, 23.6, 12, MAT.spring);
  coil.position.z = D.tubeZ0 + .9; spring.add(coil);   // 两端各留 0.9，压缩时不顶到后座与拨片钩
  R.coil = coil; R.coilLen = 23.6;
  addPart('latchSpring', spring, MAT.spring);

  const ret = new THREE.Group();
  // 环形扇面：凸轮销（R=12.7，Ø5）压在扇面内缘上 → 方轴转 θ，拨片后移 R(1-cosθ)
  const sector = (() => {
    const a0 = -10 * Math.PI / 180, a1 = 100 * Math.PI / 180, ri = 13, ro = 19;
    const pts = [];
    for (let i = 0; i <= 24; i++) { const a = a0 + (a1 - a0) * i / 24; pts.push([Math.cos(a) * ro, Math.sin(a) * ro]); }
    for (let i = 24; i >= 0; i--) { const a = a0 + (a1 - a0) * i / 24; pts.push([Math.cos(a) * ri, Math.sin(a) * ri]); }
    const sh = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
    return extrudeAlongZ(sh, 2, 15.3);
  })();
  ret.add(mesh(sector, MAT.teal));
  ret.add(box(10, 7.1, 2, MAT.teal, 0, 9.35, 16.3));   // 扇面 → 颈 连杆
  ret.add(box(10, 12, 27.7, MAT.teal, 0, 0, 28.85));   // 颈 z 15.3..43
  ret.add(box(11, 17, 3.7, MAT.teal, 0, 0, 44.85));    // 前钩 z 43..46.7
  addPart('retractor', ret, MAT.teal);

  const face = new THREE.Group();
  const fs = rectShape(-D.faceW / 2, -D.faceH / 2, D.faceW / 2, D.faceH / 2, [rectHole(-6.6, -8.2, 6.6, 8.2)]);
  face.add(mesh(extrudeAlongZ(fs, D.faceT, D.faceZ - D.faceT), MAT.chrome));
  addPart('faceplate', face, MAT.chrome, { shell: true });

  const screws = new THREE.Group();
  for (const y of [-19, 19]) {
    screws.add(cylZ(2.3, 12.5, MAT.steel, 0, y, D.faceZ - 6.75));
    screws.add(cylZ(4, 1.6, MAT.steel, 0, y, D.faceZ - 1.0));
  }
  addPart('faceScrews', screws, MAT.steel);
}

/* ---------- 扣板 + 螺丝 ---------- */
{

  g.add(mesh(extrudeAlongZ(s, 2.4, 60.6), MAT.chrome));
  // 唇口：斜舌撞上的斜面

{

/* ---------- 球壳生成（前开口 + 内壁） ---------- */
function ballShell(c, rimR) {
  const R0 = D.knobR, R1 = 26.5;
  const aRim = Math.asin(Math.min(1, rimR / R0));
  const a0 = Math.PI - aRim, a1 = 2 * RAD;
  const prof = [];
  for (let i = 0; i <= 22; i++) { const a = a0 + (a1 - a0) * i / 22; prof.push([c + Math.cos(a) * R0, Math.sin(a) * R0]); }
  for (let i = 22; i >= 0; i--) { const a = a0 + (a1 - a0) * i / 22; prof.push([c + Math.cos(a) * R1, Math.max(1e-3, Math.sin(a) * R1)]); }
  prof.push(prof[0]);
  return lathe(prof, 56);
}

/* ---------- 内执手 ---------- */
{
  const g = new THREE.Group(), c = D.knobInC;
  const ball = mesh(ballShell(c, 9.5), MAT.nickel); ball.material.side = THREE.DoubleSide; g.add(ball);
  const ring = shapeFromPts(circlePts(9.5, 0, 0, 40), [(() => {
    const p = new THREE.Path(); const h = 4.2;
    p.moveTo(h, -h); p.lineTo(h, h); p.lineTo(-h, h); p.lineTo(-h, -h); p.closePath(); return p;
  })()]);
  g.add(mesh(extrudeAlongX(ring, 8.5, 19.5), MAT.nickel));   // 方孔套 x 19.5..28（避开拨片扇面扫掠区）
  g.add(cylX(9.5, 4, MAT.nickel, 30));
  const ridge = box(24, 2.2, 2.4, MAT.red, c - 12, 26.4, 0); ridge.rotation.z = -.22; g.add(ridge);
  g.add(cylY(3, 1.6, MAT.teal, c, 27.4, 0));
  addPart('knobIn', g, MAT.nickel, { shell: true });
}

/* ---------- 外执手（球前开口 + 颈 + 离合盘） + 锁芯壳 ---------- */
{
  const g = new THREE.Group(), c = D.knobOutC;
  const ball = mesh(ballShell(c, 10.3), MAT.nickel); ball.material.side = THREE.DoubleSide; g.add(ball);
  const ring = shapeFromPts(circlePts(9.5, 0, 0, 40), [holeCircle(6)]);
  g.add(mesh(extrudeAlongX(ring, 16.5, -32), MAT.nickel));   // 颈 Ø19 / 内 Ø12
  // 离合盘：OD18，±y 两个缺口，中心 Ø12
  const dpR = D.diskR, nW = 2.5, nD = 2.5;
  const dp = shapeFromPts([[-dpR, nW / 2], [-nD, nW / 2], [-nD, dpR], [nD, dpR], [nD, nW / 2], [dpR, nW / 2],
    [dpR, -nW / 2], [nD, -nW / 2], [nD, -dpR], [-nD, -dpR], [-nD, -nW / 2], [-dpR, -nW / 2]], [holeCircle(6)]);
  g.add(mesh(extrudeAlongX(dp, D.plateX1 - D.plateX0, D.plateX0), MAT.dark));
  addPart('knobOut', g, MAT.nickel, { shell: true });

  // 锁芯壳：下半管（教学半剖）+ 前端环 + 顶部封板
  const hs = new THREE.Group();
  const half = shapeFromPts(circlePts(D.housingR, 0, 0, 40, Math.PI + TRIM, Math.PI * 2 - TRIM)
    .concat(circlePts(D.plugR, 0, 0, 40, Math.PI * 2 - TRIM, Math.PI + TRIM).reverse()));
  const hx0 = D.plugX0 + 1, hx1 = D.plugX1 + 1;
  hs.add(mesh(extrudeAlongX(half, hx1 - hx0, hx0), MAT.dark));
  const bez = shapeFromPts(circlePts(D.housingR, 0, 0, 40), [holeCircle(D.plugR)]);
  hs.add(mesh(extrudeAlongX(bez, 2.2, hx0), MAT.dark));
  hs.add(box(D.pinX[4] - D.pinX[0] + 12, 1.4, 7, MAT.dark, (D.pinX[0] + D.pinX[4]) / 2, D.capY + .7, 0));
  addPart('cylHousing', hs, MAT.dark, { shell: true });
}

/* ---------- 锁芯转子（分段挤出：实心段带钥匙槽，弹子段上下贯通；半剖版另给一份） ---------- */
{
  const g = new THREE.Group();
  const aNotch = Math.asin(2.7 / D.plugR), aStart = aNotch - Math.PI / 2, aEnd = Math.PI * 1.5 - aNotch;
  const solidPts = [[2.7, 2.5], [2.7, -Math.sqrt(D.plugR ** 2 - 2.7 ** 2)]]
    .concat(circlePts(D.plugR, 0, 0, 40, aStart, aEnd)).concat([[-2.7, 2.5]]);
  const crescent = side => [[side * 2.7, Math.sqrt(D.plugR ** 2 - 2.7 ** 2)]]
    .concat(side > 0
      ? circlePts(D.plugR, 0, 0, 20, Math.PI / 2 - aNotch, aNotch - Math.PI / 2)
      : circlePts(D.plugR, 0, 0, 20, Math.PI / 2 + aNotch, Math.PI * 1.5 - aNotch));
  const xs = [D.plugX0];
  for (const px of D.pinX) xs.push(px - 2.7, px + 2.7);
  xs.push(D.plugX1);
  // 半剖版：把每段截面在 z=0 切掉 −z 半边（+z 半边留作剖切面）
  const posHalf = circlePts(D.plugR, 0, 0, 26, Math.PI / 2 + TRIM, Math.PI * 1.5 - TRIM)
    .concat([[-2.7, 2.5], [0, 2.5]]);
  const bandHalf = circlePts(D.plugR, 0, 0, 20, Math.PI / 2 + aNotch + TRIM, Math.PI * 1.5 - aNotch - TRIM);
  const fullG = new THREE.Group(), halfG = new THREE.Group();
  for (let i = 0; i < xs.length; i += 2) {
    fullG.add(mesh(extrudeAlongX(shapeFromPts(solidPts), xs[i + 1] - xs[i], xs[i]), MAT.plug));
    halfG.add(mesh(extrudeAlongX(shapeFromPts(posHalf), xs[i + 1] - xs[i], xs[i]), MAT.plug));
    if (i + 2 < xs.length) {
      const a = xs[i + 1], b = xs[i + 2];
      fullG.add(mesh(extrudeAlongX(shapeFromPts(crescent(1)), b - a, a), MAT.plug));
      fullG.add(mesh(extrudeAlongX(shapeFromPts(crescent(-1)), b - a, a), MAT.plug));
      halfG.add(mesh(extrudeAlongX(shapeFromPts(bandHalf), b - a, a), MAT.plug));
    }
  }
  g.add(fullG); halfG.visible = false; g.add(halfG);
  R.plugFull = fullG; R.plugHalf = halfG;

  // 尾片 + 螺旋凸轮（随转子转，推离合套）——必须先建好再加入零件，否则 kit 的材质还原会读到空的 omat
  const tail = new THREE.Group();
  tail.add(cylX(3, 5, MAT.steel, D.plugX1 - 2.5));
  const segs = 20, pos = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, a = -Math.PI / 2 + t * Math.PI / 2, x = D.collarLock + 5 * t;
    pos.push(x, Math.sin(a) * 9, Math.cos(a) * 9, x, Math.sin(a) * 3, Math.cos(a) * 3);
  }
  for (let i = 0; i < segs; i++) { const p = i * 2; idx.push(p, p + 2, p + 3, p, p + 3, p + 1); }
  const rgeo = new THREE.BufferGeometry();
  rgeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  rgeo.setIndex(idx); rgeo.computeVertexNormals();
  const rampMat = new THREE.MeshStandardMaterial({ color: 0x8d949a, metalness: .9, roughness: .4, side: THREE.DoubleSide });
  const rampMesh = new THREE.Mesh(rgeo, rampMat); rampMesh.userData.keepMat = true;
  tail.add(rampMesh); g.add(tail); R.tail = tail;
  addPart('plug', g, MAT.plug);
}

/* ---------- 弹子（5 组：下弹子 + 上弹子 + 簧；下弹子半剖版） ---------- */
{
  const g = new THREE.Group();
  R.pinSpin = new THREE.Group(); g.add(R.pinSpin);
  const shear = box(D.pinX[4] - D.pinX[0] + 9, .9, 7, MAT.red, (D.pinX[0] + D.pinX[4]) / 2, 8.3, -3.5);
  R.shear = shear; g.add(shear);
  const halfDisc = r => circlePts(r, 0, 0, 18, Math.PI / 2 + TRIM, Math.PI * 1.5 - TRIM);
  R.pinSpinHalf = new THREE.Group(); R.pinSpinHalf.visible = false; g.add(R.pinSpinHalf);
  D.pinX.forEach((px, i) => {
    const keyPin = cylY(2.6, 1, MAT.brass, px, 0, 0);
    const keyPinHalf = mesh(extrudeAlongY(shapeFromPts(halfDisc(2.6)), 1, 0), MAT.brass, px, 0, 0);
    const driver = cylY(2.6, 5, MAT.steel, px, 0, 0);
    const spr = coilY(2.3, .55, 3, 5, MAT.spring);
    R.pinSpin.add(keyPin); R.pinSpinHalf.add(keyPinHalf); g.add(driver); g.add(spr);
    R.pins.push({ px, keyPin, keyPinHalf, driver, spr, i });
  });
  addPart('pinStack', g, MAT.steel);
}

/* ---------- 离合套（Ø14 毂 + 2 爪；毂有真 8.1 方孔让方轴穿过） ---------- */
{
  const g = new THREE.Group();
  g.add(mesh(extrudeAlongX(shapeFromPts(circlePts(7, 0, 0, 32), [rectHole(-4.05, -4.05, 4.05, 4.05)]), 4, D.collarLock), MAT.teal));
  for (const s of [-1, 1]) g.add(box(4, 3, 3, MAT.teal, D.collarLock + 6, s * 6.2, 0));
  addPart('clutch', g, MAT.teal);
}

/* ---------- 钥匙 ---------- */
{
  const g = new THREE.Group();
  const cuts = D.cutY, px = D.pinX, yBot = -7.5;
  const pts = [[D.plugX1, yBot], [D.plugX0 - 25, yBot], [D.plugX0 - 25, 2.5], [D.plugX0 + .6, 2.5], [D.plugX0 + .6, cuts[0]]];
  for (let i = 0; i < 5; i++) {
    pts.push([px[i] - 2, cuts[i]], [px[i] + 2, cuts[i]]);
    if (i < 4) pts.push([px[i] + 3, cuts[i + 1]]);
  }
  pts.push([D.plugX1 + 1, yBot]);
  const s = new THREE.Shape();
  pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y));
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: 1.9, bevelEnabled: false });
  geo.translate(0, 0, -2.0);
  g.add(mesh(geo, MAT.brass));
  const bow = new THREE.Shape();
  circlePts(12, 0, 0, 36).forEach(([x, y], i) => i ? bow.lineTo(x, y) : bow.moveTo(x, y));
  bow.closePath();
  const bowHole = new THREE.Path(); bowHole.absarc(0, 0, 6, 0, Math.PI * 2, true); bow.holes.push(bowHole);
  const bg = new THREE.ExtrudeGeometry(bow, { depth: 2.4, bevelEnabled: false });
  bg.rotateY(Math.PI / 2); bg.translate(D.plugX0 - 28.5, -2.5, 0);
  g.add(mesh(bg, MAT.brass));
  addPart('key', g, MAT.brass);
}

/* ============================== 运动（几何与读数同源） ============================== */
// 弹子列：bottom = 下弹子底面高度；len = 下弹子长度（由齿高定）；top = 底面+len
function pinState(st, keyIns) {
  return D.pinX.map((px, i) => {
    let target;
    if (st.keyKind === 'right') target = D.cutY[i];
    else if (st.keyKind === 'wrong') target = (i === D.wrongIndex ? D.cutY[i] - 1 : D.cutY[i]);
    else target = -8;
    const bottom = -8 + (target + 8) * keyIns;
    const len = 8 - D.cutY[i];
    return { px, bottom, len, top: bottom + len };

}

/* 单一驱动量：拨片/锁舌后移 = boltRetract(方轴转角) + 视图里的按压脉冲 */
function boltPull(st, v) { return boltRetract(st.spindle || 0) + (v && v.push ? v.push : 0); }
/* 锁芯 0–90° 映射成离合套 5 mm 轴向行程 */
function clutchShift(st) { return (D.collarEngage - D.collarLock) * (clamp(st.plug || 0, 0, MAX_TURN) / MAX_TURN); }

function applyMotion(v, st) {
  const pull = boltPull(st, v);
  byKey.get('latchBolt').obj.position.z = -pull;
  byKey.get('retractor').obj.position.z = -pull;
  R.coil.scale.z = Math.max(.08, (R.coilLen - pull) / R.coilLen);

  const spindleDeg = clamp(st.spindle || 0, 0, MAX_TURN);
  byKey.get('spindle').obj.rotation.x = spindleDeg * RAD;
  byKey.get('knobIn').obj.rotation.x = clamp(st.knobIn || 0, 0, MAX_TURN) * RAD;
  byKey.get('knobOut').obj.rotation.x = clamp(st.knobOut || 0, 0, MAX_TURN) * RAD;
  byKey.get('clutch').obj.rotation.x = spindleDeg * RAD;
  byKey.get('clutch').obj.position.x = clutchShift(st);

  const plugDeg = clamp(st.plug || 0, 0, MAX_TURN);
  byKey.get('plug').obj.rotation.x = plugDeg * RAD;
  byKey.get('key').obj.rotation.x = plugDeg * RAD;
  const ins = clamp(st.keyInserted || 0, 0, 1);
  byKey.get('key').obj.position.x = -26.5 * (1 - ins);
  byKey.get('key').obj.visible = ins > .02;
  R.tail.rotation.x = plugDeg * RAD;

  // 剖开：锁芯转子与下弹子换半剖件，剪切线亮出来（kit 只管 p.shell 的件）
  const cutting = !!v.cut;
  R.plugFull.visible = !cutting;
  R.plugHalf.visible = cutting;
  R.pinSpin.visible = !cutting;
  R.pinSpinHalf.visible = cutting;
  R.shear.visible = cutting || st.chapter === 2 || st.phase === 'lab';

  const ps = pinState(st, ins);
  ps.forEach((p, i) => {
    const r = R.pins[i], bad = st.keyKind === 'wrong' && i === D.wrongIndex;
    r.keyPin.scale.y = p.len; r.keyPin.position.y = p.bottom + p.len / 2;
    r.keyPinHalf.scale.y = p.len; r.keyPinHalf.position.y = p.bottom + p.len / 2;
    r.driver.position.y = p.top + 2.5;
    r.spr.position.y = p.top + 5;
    r.spr.scale.y = Math.max(.2, (D.capY - (p.top + 5)) / 3);
    const km = bad ? MAT.red : MAT.brass, dm = bad ? MAT.red : MAT.steel;
    if (r.keyPin.material !== km) r.keyPin.material = km;
    if (r.keyPinHalf.material !== km) r.keyPinHalf.material = km;
    if (r.driver.material !== dm) r.driver.material = dm;
  });

  // 门板：剖开时变半透（不裁切，避免看起来被切成半个）
  const doorMat = cutting ? MAT.woodGhost : null;
  for (const o of R.doorMeshes) {
    const want = doorMat || o.userData.omat;
    if (o.material !== want) o.material = want;
  }
}

function moduleBounds(keys) {
  const b = new THREE.Box3();
  for (const k of keys) {
    const p = byKey.get(k);
    if (p) b.union(new THREE.Box3().setFromObject(p.g));
  }
  return b;
}
const MODEL = {
  world, byKey, PARTS: parts, moduleBounds, applyMotion,
  boltPull, clutchShift, boltRetract, pinState,
  D, R, THROW, CAM_R, MAX_TURN, PART_NAMES,
};

/* ==== spherical-lock/logic.mjs ==== */
/* 球形门锁 · 装配与实验逻辑（纯逻辑，无 DOM、无三维）
 * 每个动作先校验前置条件；失败不动状态。模块与关卡文案的唯一来源是 manifest.mjs。
 * 运动常量（THROW / MAX_TURN / boltRetract / clamp）来自 model.mjs —— 与几何同一份。
 */
const MODULES = MANIFEST.modules;
const CHAPTERS = MANIFEST.chapters;
const MODULE_IDS = MODULES.map(m => m.id);
function createGame() {
  const initial = () => ({
    chapter: 0, phase: 'build', placed: [], selected: null, completed: [false, false, false],
    observed: false, knobIn: 0, knobOut: 0, spindle: 0,
    locked: true, plug: 0, keyKind: 'none', keyInserted: 0, wrongTried: false, lab: false,
  });
  const state = initial();
  const fail = (message) => ({ ok: false, message });
  const mod = (id) => MODULES.find(m => m.id === id);
  const has = (id) => state.placed.includes(id);

  function current() {
    if (state.phase !== 'build') return null;
    return MODULES.find(m => m.chapter === state.chapter && !has(m.id)) || null;
  }
  function chapterDone(ch) {
    return MODULES.filter(m => m.chapter === ch).every(m => has(m.id));
  }
  function select(id) {
    if (state.phase !== 'build') return fail('本章装配已完成，先做实验和判断。');
    const m = mod(id);
    if (!m) return fail('零件盒里没有这块模块。');
    if (has(id)) return fail(m.name + '已经装上了。');
    state.selected = id;
    return { ok: true, message: m.tip, kind: 'select' };
  }
  function place(onTarget = true) {
    if (state.phase !== 'build') return fail('本章装配已完成。');
    const m = current();
    if (!state.selected) return fail('先从零件盒选一块模块。');
    if (onTarget !== true) return fail('还没对准安装位置，拖到轮廓里再松手。');
    if (!m || state.selected !== m.id) return fail('这一步需要先装' + (m ? m.name : '前面的模块') + '。');
    state.placed.push(m.id); state.selected = null;
    if (chapterDone(state.chapter)) { state.phase = 'experiment'; state.observed = false; }
    return { ok: true, message: m.name + '已归位。', learn: m.learn, kind: 'placed' };
  }
  function undo() {
    if (state.phase === 'lab') return fail('整机已装好；想重装请点「重新开始」。');
    const last = state.placed.filter(id => mod(id).chapter === state.chapter).pop();
    if (!last) return fail('本章还没有装上的模块。');
    state.placed = state.placed.filter(id => id !== last);
    state.phase = 'build'; state.selected = null;
    state.observed = false; state.completed[state.chapter] = false;
    state.knobIn = 0; state.knobOut = 0; state.spindle = 0;
    return { ok: true, message: '已撤回' + mod(last).name + '。', kind: 'undo' };
  }
  function pushBolt() {
    if (!has('latch')) return fail('先装好锁舌组件。');
    if (state.phase === 'build') return fail('先装完本章模块，再做实验。');
    return { ok: true, kind: 'push', message: '斜舌被按下 12.7 mm，松手后弹簧把它推回来。' };
  }
  function knob(side, deg) {
    const id = side === 'in' ? 'knobIn' : 'knobOut';
    if (!has(id)) return fail(side === 'in' ? '内执手还没装上。' : '外执手还没装上。');
    if (!has('spindle')) return fail('方轴还没装，执手转起来不会带动任何零件。');
    const a = clamp(Number.isFinite(deg) ? deg : 0, 0, MAX_TURN);
    if (side === 'in') state.knobIn = a; else state.knobOut = a;
    const engaged = side === 'in' ? true : !state.locked;
    state.spindle = engaged ? a : 0;
    return {
      ok: true, kind: 'knob', engaged, pull: boltRetract(state.spindle),
      message: side === 'in'
        ? (a > 60 ? '内执手转到底：方轴转 ' + Math.round(a) + '°，锁舌回缩 ' + boltRetract(a).toFixed(1) + ' mm。' : '内执手已经带动方轴。')
        : (!state.locked ? '离合已接通，外执手带动方轴。' : '外执手在空转：离合套没有接上，方轴没动。'),
    };
  }
  function insertKey(kind) {
    if (!has('key')) return fail('钥匙还没装上。');
    if (!has('knobOut')) return fail('锁芯还没装（外执手模块未归位）。');
    if (state.knobOut > 0.5) return fail('先把外侧执手松开，再动钥匙。');
    if (kind !== 'right' && kind !== 'wrong' && kind !== 'none') return fail('只能插对钥匙、错钥匙，或者拔出来。');
    if (kind !== 'none' && state.plug > 0.5) return fail('锁芯已经转过去了，先转回来再动钥匙。');
    state.keyKind = kind; state.keyInserted = kind === 'none' ? 0 : 1;
    if (kind === 'wrong') state.wrongTried = true;
    return {
      ok: true, kind: 'key',
      message: kind === 'wrong' ? '错钥匙插到底了：第 3 组弹子低 1 mm，跨着剪切线。'
        : kind === 'right' ? '对钥匙插到底：五组弹子接缝都落在剪切线上。' : '钥匙已拔出。',
    };
  }
  function turnKey(deg) {
    if (!has('key')) return fail('还没有钥匙。');
    if (state.keyKind === 'none') return fail('先插钥匙。');
    if (state.keyKind === 'wrong') {
      return { ok: false, kind: 'blocked',
        message: '转不动。有一组弹子跨在剪切线上，把转子顶死了——插得进去，不等于转得动。' };
    }
    if (state.knobOut > 0.5) return { ok: false, message: '先把外侧执手松开，锁芯才退得回来。' };
    const a = clamp(Number.isFinite(deg) ? deg : 0, 0, MAX_TURN);
    state.plug = a;
    if (a >= MAX_TURN - 0.5) state.locked = false;
    else if (a <= 0.5) state.locked = true;
    return {
      ok: true, kind: 'plug',
      message: a >= MAX_TURN - 0.5 ? '锁芯转到 90°：尾片把离合套推进外执手，外执手现在能带动方轴。'
        : a <= 0.5 ? '锁芯回到 0°，离合套退回，外执手重新空转。' : '锁芯转动中。',
    };
  }
  // 本关实验：动作 + 观察一次做完，然后进判断（判断阶段还能「再看一遍」）
  function experiment() {
    if (state.phase !== 'experiment' && state.phase !== 'quiz') return fail('先把本章模块全部装好，再做实验。');
    const again = state.phase === 'quiz';
    const ch = CHAPTERS[state.chapter];
    state.observed = true;
    let tail = '';
    if (state.chapter === 0) tail = '';
    if (state.chapter === 1) { state.knobIn = MAX_TURN; state.spindle = MAX_TURN; }
    if (state.chapter === 2) {
      insertKey('wrong');
      const blocked = turnKey(MAX_TURN);
      state.plug = 0;
      const keyed = insertKey('right');
      const opened = turnKey(MAX_TURN);
      tail = ' 错钥匙：' + blocked.message + ' 对钥匙：' + keyed.message + opened.message;
    }
    if (!again) state.phase = 'quiz';
    return {
      ok: true, message: ch.expText + tail,
      kind: state.chapter === 0 ? 'push' : state.chapter === 1 ? 'knob' : 'key',
    };
  }
  function answer(index) {
    if (state.phase !== 'quiz') return fail('先亲手完成本章实验，再回答问题。');
    const ch = CHAPTERS[state.chapter];
    if (!Number.isInteger(index) || index < 0 || index >= ch.options.length) return fail('请选择一个有效答案。');
    if (index !== ch.a) return { ok: false, kind: 'wrong', message: '再观察一下。' + ch.why, learn: ch.why };
    state.completed[state.chapter] = true; state.phase = 'checkpoint';
    return { ok: true, kind: 'correct', message: '答对了，获得「' + ch.badge + '」。', learn: ch.why };
  }
  function next() {
    if (state.phase !== 'checkpoint' || !state.completed[state.chapter]) return fail('先完成本章实验与判断。');
    state.selected = null; state.observed = false;
    state.knobIn = 0; state.knobOut = 0; state.spindle = 0;
    if (state.chapter < CHAPTERS.length - 1) {
      state.chapter++; state.phase = 'build';
      return { ok: true, kind: 'chapter', message: CHAPTERS[state.chapter].subtitle };
    }
    state.phase = 'lab'; state.lab = true;
    return { ok: true, kind: 'complete', message: '整机装好了。现在可以转执手、插钥匙、锁上、剖开看五组弹子。' };
  }
  // 自由实验：一键满装
  function demo() {
    Object.assign(state, initial());
    state.placed = MODULE_IDS.slice();
    state.completed = [true, true, true];
    state.chapter = CHAPTERS.length - 1; state.phase = 'lab'; state.lab = true;
    return { ok: true, kind: 'demo', message: '整机已装好：所有实验解锁，锁处于锁定状态。' };
  }
  function restart() {
    Object.assign(state, initial());
    return { ok: true, kind: 'restart', message: '重新开始：先从锁舌组件装起。' };
  }
  return { state, current, chapterDone, select, place, undo, pushBolt, knob, insertKey, turnKey,
    experiment, answer, next, demo, restart };
}

/* ==== spherical-lock/main.mjs ==== */
/* 球形门锁 · 接线（几何在 model.mjs，规则在 logic.mjs，文案在 manifest.mjs） */

const game = createGame();
const state = game.state;
const CH = MANIFEST.chapters;
const MODS = MANIFEST.modules;
const $ = (s) => document.querySelector(s);

const lab = mountLab(MANIFEST);
const stage = createStage({
  host: document.getElementById('viewport'),
  stageEl: document.getElementById('stage'),
  world: MODEL.world,
  modules: MODS,
  model: MODEL,
  config: MANIFEST.scene,
  getState: () => state,
  nextModule: () => game.current(),
  canDrag: () => state.phase === 'build' && !!state.selected,
  targetAlways: () => true,
  onDrop: (id, onTarget) => act('place', onTarget),
  onPickKey: (key) => {
    if (key === 'latchBolt' && state.phase !== 'build') return void act('pushBolt');
    if (['latchHousing', 'latchBolt', 'latchSpring', 'retractor', 'faceplate', 'faceScrews', 'strike'].includes(key))
      return stage.fitCamera('latch');
    if (key === 'knobIn') return stage.fitCamera('knob');
    if (['knobOut', 'cylHousing', 'plug', 'pinStack', 'clutch', 'key'].includes(key)) return stage.fitCamera('cylinder');
  },
  tick: (dt) => tick(dt),
});
lab.attached3d = true;
lab.stage = stage;
const view = stage.view;
view.cut = true;
view.push = 0;
view.pushT = null;

/* ---------- 读数：全部取自 model 的同一个驱动量 ---------- */
function keyLabel() {
  return state.keyKind === 'right' ? '对钥匙' : state.keyKind === 'wrong' ? '错钥匙' : '无钥匙';
}
function updateReadout() {
  const pull = MODEL.boltPull(state, view);          // 与 applyMotion 同一个函数
  const latch = state.placed.includes('latch');
  const out = state.placed.includes('knobOut');
  lab.paint({
    spindle: Math.round(state.spindle) + '°',
    bolt: latch ? (MODEL.THROW - pull).toFixed(1) + ' mm' : '—',
    pull: latch ? pull.toFixed(1) + ' mm' : '—',
    clutch: out ? (state.locked ? '断开 · 空转' : '接通 · 传动') : '—',
    cylinder: out ? Math.round(state.plug) + '° · ' + keyLabel() : '—',
  });
}

/* ---------- 每帧：推锁舌的按压脉冲 ---------- */
function tick(dt) {
  if (view.pushT !== null) {
    view.pushT += dt;
    const t = view.pushT / 0.95;
    if (t >= 1) { view.push = 0; view.pushT = null; }
    else view.push = MODEL.THROW * Math.sin(t * Math.PI);
  }
  updateReadout();
}
function pushPulse() { view.pushT = 0; }

/* ---------- 教练面板 ---------- */
lab.task(({ chapter: ch, chapterIndex: i, phase }) => {
  const next = game.current();
  const sel = MODS.find((m) => m.id === state.selected);
  const undoBtn = `<div class="sub"><button id="undo" ${MODS.find((m) => m.id === state.placed.at(-1))?.chapter === state.chapter ? '' : 'disabled'}>撤回一步</button></div>`;

  if (phase === 'build') {
    return {
      html: `<p class="label">现在要装</p><h3>${next ? next.name : ''}</h3><p>${next ? next.tip : ''}</p>
        <div class="note">${sel ? '已拿起：' + sel.name : '从下方零件盒选择一块模块'}</div>
        <button class="primary action" id="place" ${sel ? '' : 'disabled'}>装入当前模块</button>
        ${undoBtn}`,
      bind(root) {
        root.querySelector('#place').onclick = () => act('place');
        root.querySelector('#undo').onclick = () => act('undo');
      },
    };
  }

  if (phase === 'experiment') {
    return {
      html: `<p class="label">模块已归位，现在验证一下</p><h3>${ch.exp}</h3><p>${ch.expText}</p>
        <button class="primary action" id="experiment">${ch.exp}</button>
        <p class="note">也可以直接点三维里的斜舌、或拖执手自己试。</p>${undoBtn}`,
      bind(root) {
        root.querySelector('#experiment').onclick = () => act('experiment');
        root.querySelector('#undo').onclick = () => act('undo');
      },
    };
  }

  if (phase === 'quiz') {
    return {
      html: `<p class="label">看一看，想一想</p><h3>${ch.q}</h3>
        <div class="options">${ch.options.map((o, k) => `<button data-opt="${k}"><b>${String.fromCharCode(65 + k)}</b>${o}</button>`).join('')}</div>
        <button class="action" id="again" style="margin-top:12px">${ch.exp}</button>
        <p class="note" style="margin-top:10px">答错不会清空进度，观察会帮你找到原因。</p>`,
      bind(root) {
        root.querySelector('#again').onclick = () => act('experiment');
      },
    };
  }

  if (phase === 'checkpoint') {
    return {
      html: `<div class="badge" aria-hidden="true">✓</div><p class="label">新发现徽章</p><h3>${ch.badge}</h3>
        <p>${ch.why}</p>
        <button class="primary action" id="next">${i === CH.length - 1 ? '进入自由实验室' : '继续第 ' + (i + 2) + ' 关'}</button>`,
      bind(root) {
        root.querySelector('#next').onclick = () => act('next');
      },
    };
  }

  const unlocked = !state.locked;
  return {
    html: `<div class="labgrid">
        <button class="primary" id="turn-in">${state.knobIn > 5 ? '松开内执手' : '转内执手 90°'}</button>
        <button id="turn-out">${state.knobOut > 5 ? '松开外执手' : '转外执手 90°'}</button>
        <button id="key-right">插对钥匙</button>
        <button id="key-wrong">插错钥匙</button>
        <button id="key-off">拔钥匙</button>
        <button id="plug">${state.plug > 5 ? '转钥匙锁上' : '转钥匙解锁'}</button>
        <button id="push">推锁舌</button>
        <button id="focus-cyl">看锁芯</button>
      </div>
      <div class="flow ${unlocked ? 'on' : ''}"><span>钥匙</span><i>›</i><span>${unlocked ? '离合接通' : '离合断开'}</span><i>›</i><span class="${unlocked ? '' : 'off'}">外执手</span><i>›</i><span>方轴</span><i>›</i><span>锁舌</span></div>
      <p class="note">${unlocked
        ? '离合已接通：外执手能带动方轴，锁舌跟着缩回。'
        : state.keyKind === 'wrong'
          ? '钥匙是错的：第 3 组弹子跨着剪切线，转子被顶死，转不动。'
          : '先插对钥匙再转锁芯，离合套才会被推进外执手。'}</p>
      <div class="earned">${CH.map((c) => `<span>✓ ${c.badge}</span>`).join('')}</div>`,
    bind(root) {
      root.querySelector('#turn-in').onclick = () => act('knob', 'in', state.knobIn > 5 ? 0 : 90);
      root.querySelector('#turn-out').onclick = () => act('knob', 'out', state.knobOut > 5 ? 0 : 90);
      root.querySelector('#key-right').onclick = () => act('insertKey', 'right');
      root.querySelector('#key-wrong').onclick = () => act('insertKey', 'wrong');
      root.querySelector('#key-off').onclick = () => act('insertKey', 'none');
      root.querySelector('#plug').onclick = () => act('turnKey', state.plug > 5 ? 0 : 90);
      root.querySelector('#push').onclick = () => act('pushBolt');
      root.querySelector('#focus-cyl').onclick = () => stage.fitCamera('cylinder');
    },
  };
});

/* ---------- 刷新显示态 ---------- */
const BOX = ['第一盒 · 锁舌与扣板', '第二盒 · 执手与方轴', '第三盒 · 锁芯与钥匙'];
function refresh() {
  const s = lab.state;
  const labPhase = state.phase === 'lab';
  s.chapter = state.chapter;
  s.phase = state.phase;
  s.placed = state.placed;
  s.selected = state.selected;
  s.completed = state.completed;
  s.badges = labPhase ? CH.map((c) => c.badge) : state.completed.map((ok, k) => (ok ? CH[k].badge : null)).filter(Boolean);
  s.progress = { done: state.placed.length, total: MODS.length };
  s.cardsLocked = state.phase !== 'build';
  s.visible.readout = true;
  s.coach = labPhase
    ? { tag: '三个发现，全部解锁', title: '你的门锁，装完了', intro: '自由实验：转执手、插错/对钥匙、剖开看五组弹子。' }
    : null;
  s.trayTitle = labPhase ? '你的装配记录' : BOX[state.chapter];
  s.trayHint = labPhase ? '8 块模块，21 件零件全部到位' : '点选模块，再拖到门上的缺口';
  s.stageHint = labPhase
    ? '拖执手转方轴；插错钥匙看那组弹子；「剖开看」切出半剖锁芯。'
    : state.phase === 'build'
      ? '把选中的模块拖到门上它该在的位置。'
      : state.phase === 'experiment'
        ? '这一段已经拼好，去试验你的发现。'
        : '看清谁在动，再完成原理挑战。';
  lab.render();
  $('[data-tool="cut"]').setAttribute('aria-pressed', String(view.cut));
  updateReadout();
}

/* ---------- 动作 ---------- */
function say(message, kind) {
  lab.state.feedback = message || '';
  lab.state.feedbackKind = kind || '';
  const fb = document.getElementById('feedback');
  if (fb) { fb.className = 'feedback' + (kind ? ' ' + kind : ''); fb.textContent = message || ''; }
}
const ACTIONS = {
  select: (id) => game.select(id),
  place: (onTarget) => game.place(onTarget !== false),
  undo: () => game.undo(),
  experiment: () => game.experiment(),
  answer: (i) => game.answer(i),
  next: () => game.next(),
  pushBolt: () => game.pushBolt(),
  knob: (side, deg) => game.knob(side, deg),
  insertKey: (k) => game.insertKey(k),
  turnKey: (d) => game.turnKey(d),
  restart: () => game.restart(),
  demo: () => game.demo(),
};

function act(name, ...args) {
  const beforeChapter = state.chapter, beforePhase = state.phase;
  const res = ACTIONS[name](...args);
  say(res.message, res.ok ? 'success' : 'error');
  if (res.ok) {
    if (res.learn) lab.setDiscovery(res.learn);
    if (res.kind === 'push') pushPulse();
    if (['restart', 'demo'].includes(res.kind)) {
      view.offsets.clear();
      view.push = 0; view.pushT = null;
      view.cut = true;
      stage.setNavigation('rotate');
      lab.setDiscovery('');
      stage.fitCamera('all');
    }
    if (res.kind === 'restart' || state.chapter !== beforeChapter) stage.fitCamera('all');
    if (['correct', 'complete'].includes(res.kind)) lab.celebrate();
  }
  if (beforePhase !== state.phase && ['wrong'].includes(res.kind)) say(res.message, 'error');
  refresh();
  return res;
}

/* ---------- 拖执手：水平拖 → 0–90°（松手不回弹，面板上有「松开」） ---------- */
const canvas = stage.renderer.domElement;
const dragRay = new THREE.Raycaster();
const dragNdc = new THREE.Vector2();
let knobDrag = null;
function rayFrom(e) {
  const r = canvas.getBoundingClientRect();
  dragNdc.set(((e.clientX - r.left) / r.width) * 2 - 1, 1 - ((e.clientY - r.top) / r.height) * 2);
  dragRay.setFromCamera(dragNdc, stage.camera);
}
function knobUnder(e) {
  rayFrom(e);
  for (const [side, key] of [['in', 'knobIn'], ['out', 'knobOut']]) {
    if (!state.placed.includes(key)) continue;
    const p = MODEL.byKey.get(key);
    if (!p) continue;
    const hit = dragRay.intersectObject(p.obj, true).find((h) => h.object.visible);
    if (hit) return side;
  }
  return null;
}
canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || view.navigation !== 'rotate' || view.drag) return;
  if (state.phase === 'build' || state.phase === 'checkpoint') return;
  const side = knobUnder(e);
  if (!side) return;
  knobDrag = { side, pointerId: e.pointerId, x0: e.clientX, base: side === 'in' ? state.knobIn : state.knobOut };
  stage.controls.enabled = false;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  canvas.style.cursor = 'grabbing';
  e.preventDefault();
  e.stopImmediatePropagation();
}, { capture: true });
canvas.addEventListener('pointermove', (e) => {
  if (!knobDrag || knobDrag.pointerId !== e.pointerId) return;
  const deg = Math.max(0, Math.min(MODEL.MAX_TURN, knobDrag.base + (e.clientX - knobDrag.x0) * 0.62));
  const res = game.knob(knobDrag.side, deg);
  say(res.message, res.ok ? (res.engaged === false ? 'error' : '') : 'error');
  e.preventDefault();
  e.stopImmediatePropagation();
}, { capture: true });
function endKnob(e) {
  if (!knobDrag || (e && knobDrag.pointerId !== e.pointerId)) return;
  knobDrag = null;
  stage.controls.enabled = true;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  canvas.style.cursor = 'grab';
  refresh();
  if (e) e.stopImmediatePropagation();
}
canvas.addEventListener('pointerup', (e) => endKnob(e), { capture: true });
canvas.addEventListener('pointercancel', (e) => endKnob(e), { capture: true });

/* ---------- 事件 ---------- */
lab.on('select', (id) => act('select', id));
lab.on('place', () => act('place'));
lab.on('undo', () => act('undo'));
lab.on('answer', (i) => act('answer', i));
lab.on('next', () => act('next'));
lab.on('restart', () => act('restart'));
lab.on('free', () => { act('demo'); stage.fitCamera('all'); });
lab.on('experiment', ({ id, value }) => {
  // 实验台滑杆：内执手转角 → 方轴/锁舌跟着变（读数与几何同源）
  if (id === 'knobAngle') act('knob', 'in', Number(value) || 0);
});
lab.on('tool', (id) => {
  if (id === 'cut') view.cut = $('[data-tool="cut"]').getAttribute('aria-pressed') === 'true';
  if (id === 'home') stage.fitCamera('all');
  if (id === 'rotate' || id === 'pan') stage.setNavigation(id);
  refresh();
});

refresh();
say('从下方零件盒选中「预装锁舌组件」，开始第一步。', '');
if (!canvas.style.cursor) canvas.style.cursor = 'grab';
updateReadout();   // 首帧前先把读数填上（tick 之前是一屏占位）
stage.start();

</script>
</body>
