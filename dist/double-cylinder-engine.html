<!doctype html>
<!-- mechbench · 固定页面骨架。物品不许改这个文件；个性化一律走插槽（kit/slots.md）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>装配实验室</title>
<style>/* mechbench · 固定布局层
 * 只放"所有物品共用"的东西：区域、断点、控件外观、无障碍焦点。
 * 物品自己的视觉微调写在 items/<slug>/lab.css。
 */

:root{
  --ink:#1d2228; --muted:#63707d; --line:#cfd6dc; --stage:#e7ebee; --paper:#f8fafb;
  --accent:#c2452d; --accent-dark:#93301e;
  --steel:#4d5966; --blue:#2f6f9f; --green:#2f7d5c; --gold:#b8862f;
  --topbar-h:70px; --coach-w:344px; --tray-h:182px; --radius:9px;
}

*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:#dfe4e8;color:var(--ink);
  font:14px/1.5 "Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#fff;
  border-radius:var(--radius);padding:8px 13px;font-weight:600;transition:background .14s,transform .1s}
button:hover:not(:disabled){background:#f4f7f9}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid #d99b2b;outline-offset:2px}
button[aria-pressed=true]{background:var(--steel);color:#fff;border-color:var(--steel)}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 0 var(--accent-dark)}
.primary:hover:not(:disabled){background:#b03c26}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- 顶栏 ---------- */
.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:22px;padding:0 24px;
  border-bottom:1px solid var(--line);background:#f7f9fa}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--steel);position:relative;overflow:hidden;flex:none}
.mark svg{display:block;width:100%;height:100%}
.brand strong{display:block;font-size:16px;letter-spacing:-.2px}
.brand small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.journey{list-style:none;display:flex;gap:6px;margin:0 auto;padding:0}
.journey li{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8b98a4;white-space:nowrap}
.journey b{width:23px;height:23px;display:grid;place-items:center;border:1px solid #cbd4dc;border-radius:50%;font-size:11px}
.journey .active{color:var(--accent);font-weight:700}
.journey .active b{background:var(--accent);color:#fff;border-color:var(--accent)}
.journey .done{color:var(--green)}
.journey .done b{background:#e3f1ea;border-color:#a9cdbc}
.topacts{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.topacts .ghost{font-size:11px;padding:6px 10px;border-radius:999px;background:#fff}
.topacts .ghost:hover{border-color:var(--accent);color:var(--accent)}
.topacts .bare{font-size:11px;background:transparent;border-color:transparent;padding:6px}

/* ---------- 主网格 ---------- */
.lab{display:grid;grid-template-columns:minmax(0,1fr) var(--coach-w);
  grid-template-rows:minmax(420px,1fr) var(--tray-h);
  grid-template-areas:"stage coach" "tray coach";
  height:calc(100dvh - var(--topbar-h));min-height:640px}
.stage{grid-area:stage;position:relative;overflow:hidden;min-width:0;background-color:var(--stage);
  background-image:radial-gradient(#c6cfd7 1px,transparent 1px);background-size:24px 24px}
#viewport{position:absolute;inset:0}
#viewport canvas{display:block;touch-action:none}
.stage-title{position:absolute;top:18px;left:22px;pointer-events:none;max-width:360px}
.stage-title h1{font-size:27px;line-height:1.2;margin:0 0 5px;letter-spacing:-.6px;font-weight:800}
.stage-title p{margin:0;font-size:11px;color:var(--muted)}
.toolbar{position:absolute;top:18px;right:16px;display:flex;flex-wrap:wrap;gap:5px;max-width:250px;justify-content:flex-end}
.toolbar button{font-size:10.5px;padding:6px 10px;background:#fffefbe8}
.toolbar button[aria-pressed=true]{background:var(--steel);color:#fff;border-color:var(--steel)}
.socket{position:absolute;z-index:4;transform:translate(-50%,-50%);background:var(--accent);color:#fff;
  border:2px solid #fff;border-radius:20px;box-shadow:0 2px 0 #8f2d1b,0 3px 12px #c2452d30;
  white-space:nowrap;font-size:11px;padding:6px 12px}
.socket.near{background:var(--green);box-shadow:0 0 0 8px #2f7d5c22}
.preview-label{position:absolute;pointer-events:none;transform:translate(-50%,0);background:#fff6ec;
  border:1px solid #e2b393;border-radius:6px;padding:3px 8px;font-size:10px;color:#96562f;white-space:nowrap}
.scene-footer{position:absolute;bottom:12px;left:20px;right:20px;display:flex;align-items:flex-end;
  justify-content:space-between;gap:12px;pointer-events:none}
.scene-footer>span{font-size:9.5px;color:#7d8b98;line-height:1.6;max-width:44%}
.readout{display:none;background:#ffffffef;border:1px solid #ccd6de;border-radius:var(--radius);
  padding:8px 12px;min-width:196px;pointer-events:auto}
.readout.on{display:block}
.readout .row{display:flex;justify-content:space-between;gap:12px;font-size:10.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;line-height:1.75}
.readout .row b{color:var(--ink);font-weight:700}
.readout .big{font-size:12px;color:var(--steel);font-weight:800}
#fault{position:absolute;inset:34% 12%;z-index:20;background:#fff;padding:18px;border:2px solid #e0b088;
  border-radius:10px;color:#7c4a22;display:none;font-size:13px}

/* ---------- 教练面板 ---------- */
.coach{grid-area:coach;background:var(--paper);border-left:1px solid var(--line);padding:22px 22px 26px;overflow:auto}
.coach .ctag{color:var(--accent);font-weight:700;font-size:11px;margin-bottom:6px}
.coach h2{font-size:21px;line-height:1.28;margin:0 0 8px;letter-spacing:-.4px;font-weight:800}
.coach .intro{font-size:12px;line-height:1.8;color:var(--muted);margin:0 0 16px}
.progress{height:6px;border-radius:6px;background:#e0e7ec;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;background:var(--accent);height:100%;width:0;transition:width .3s}
.plabel{font-size:10px;color:var(--muted);display:flex;justify-content:space-between}
.task{margin-top:18px}
.task .label{font-size:10px;color:var(--muted);margin:0 0 4px}
.task h3{font-size:17px;line-height:1.4;margin:0 0 8px;font-weight:750}
.task p{font-size:12px;line-height:1.8;margin:0 0 10px}
.task .action{width:100%;margin-top:6px}
.sub{display:flex;gap:6px;margin-top:10px}
.sub button{font-size:11px;padding:7px 9px;flex:1}
.feedback{min-height:40px;padding:9px 11px;background:#e9eef3;border-radius:8px;font-size:11px;
  line-height:1.7;margin:16px 0 0;border-left:3px solid #8fa4b8}
.feedback.error{background:#fdf0e8;border-color:#d59a6c;color:#7c4a22}
.feedback.success{background:#e8f3ed;border-color:#77b295;color:#2f6b52}
.hintbox{border-top:1px solid var(--line);padding-top:14px;margin-top:16px;font-size:11px;line-height:1.8;color:var(--muted)}
.hintbox b{display:block;font-size:11px;color:#8a6a1c;margin-bottom:4px}
.options{display:grid;gap:7px;margin-top:12px}
.options button{text-align:left;font-size:12px;font-weight:500;padding:10px 11px;line-height:1.6}
.options button b{display:inline-block;color:var(--accent);margin-right:7px}
.badge{display:grid;place-items:center;width:66px;height:66px;background:var(--gold);color:#fff;
  border:5px solid #e4c98c;border-radius:50%;margin:10px 0;font-size:28px;font-weight:800}
.earned{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.earned span{border:1px solid #ddc98d;background:#fbf5e3;color:#8a6a1c;font-size:9px;padding:3px 6px;border-radius:5px}
.technical{font-size:10px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line);margin-top:18px;padding-top:11px}
.technical summary{cursor:pointer;font-weight:600}
.technical p{margin:8px 0 0}
.note{font-size:10.5px!important;color:var(--muted)}

/* ---------- 实验台控件（experiments 插槽） ---------- */
.labctl{margin-top:12px;font-size:11px}
.labctl output{float:right;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.labctl input[type=range]{width:100%;accent-color:var(--blue);margin:8px 0 0}
.labctl.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.labgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.labgrid .primary{grid-column:1/-1}
.labgrid button{font-size:11px;padding:8px 6px}

/* ---------- 零件盒 ---------- */
.tray{grid-area:tray;border-top:2px solid #c3ccd5;padding:12px 22px 14px;background:#dae1e7;min-width:0;overflow:auto}
.tray-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:12px;font-weight:700;gap:12px}
.tray-head small{font-size:10px;color:#7c8a96;font-weight:400;text-align:right}
.mlist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card{position:relative;border:1px solid #c3ccd5;border-bottom:4px solid #b2bec8;background:#fbfcfd;
  border-radius:10px;display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:6px;
  text-align:left;padding:10px 9px;min-height:74px;--pc:#5b6470}
.card svg{width:34px;height:34px;stroke:var(--pc);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.card strong{font-size:11.5px;display:block;line-height:1.3}
.card small{font-size:9.5px;color:var(--muted);font-weight:400;display:block;margin-top:3px}
.card[aria-pressed=true]{border-color:#d99878;border-bottom-color:var(--accent);background:#fdf1ea;color:var(--ink)}
.card[data-installed=true]{background:#e9f2ec;border-color:#b2cec0;border-bottom-color:#9dbfae}
.card[data-installed=true] small{color:var(--green)}
.empty{font-size:12px;color:#5f7488;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}
.empty strong{display:block;color:#2f4c63;margin-bottom:4px}
.empty .primary{flex:none}

#debug{display:none;position:fixed;left:0;bottom:0;background:#fff;font-size:10px;z-index:30;padding:2px}

/* ---------- 断点 ---------- */
@media(max-width:1180px){
  .lab{grid-template-columns:minmax(0,1fr) 306px}
  .coach{padding:20px 16px}
  .card{grid-template-columns:1fr;text-align:center;padding:9px 6px}
  .card svg{display:none}
  .mlist{gap:6px}
}
@media(max-width:780px){
  .topbar{height:auto;min-height:96px;padding:12px 14px 8px;flex-wrap:wrap;gap:8px}
  .brand{min-width:0;flex:1}
  .brand strong{font-size:13.5px}
  .brand small{font-size:9px}
  .journey{order:3;width:100%;justify-content:space-between;margin:0;gap:2px}
  .journey li{font-size:9.5px;gap:5px;min-width:0}
  .journey b{width:19px;height:19px;font-size:9.5px}
  .tray-head small{max-width:130px;font-size:9px}
  .lab{grid-template-columns:1fr;grid-template-areas:"stage" "tray" "coach";
    grid-template-rows:minmax(360px,56dvh) auto auto;height:auto;min-height:0}
  .stage-title h1{font-size:21px}
  .stage-title{max-width:calc(100% - 172px)}
  .toolbar{top:14px;max-width:150px}
  .mlist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{grid-template-columns:32px minmax(0,1fr);text-align:left;min-height:62px}
  .card svg{display:block;width:28px;height:28px}
  .coach{border-left:0;border-top:1px solid var(--line);padding:20px}
  .readout{min-width:0;padding:6px 9px}
  .readout .row{font-size:9.5px;gap:8px}
  .scene-footer>span{max-width:150px;font-size:8.5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>/* 双缸发动机 · 个别控件样式（发动机面板独有的滑杆与传动链示意） */
.crankctl{margin-top:12px;font-size:11px}
.crankctl output{float:right;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.crankctl input{width:100%;accent-color:var(--accent);margin:8px 0 0}
.speed{display:block;margin-top:14px;font-size:11px}
.speed output{float:right;color:var(--blue);font-weight:700}
.speed input{width:100%;accent-color:var(--blue);margin:8px 0 0}
.flow{display:flex;align-items:center;gap:3px;margin:14px 0 8px}
.flow span{font-size:9px;text-align:center;flex:1;padding:7px 2px;border-radius:4px;background:#e9edf1;color:#8794a0}
.flow i{font-style:normal;font-size:9px;color:#9aa8b4}
.flow.on span{background:#e6eff5;color:var(--blue)}
.flow.on span.off{background:#f2eef0;color:#a9586a;text-decoration:line-through}
</style>

<body>
<header class="topbar">
  <div class="brand">
    <div class="mark" data-slot="brand.mark" aria-hidden="true"></div>
    <div><strong data-slot="brand.title"></strong><small data-slot="brand.subtitle"></small></div>
  </div>
  <ol class="journey" data-slot="journey" aria-label="关卡进度"></ol>
  <div class="topacts">
    <button class="ghost" id="free-lab">自由实验</button>
    <button class="bare" id="restart">重新开始</button>
  </div>
</header>

<main class="lab">
  <section class="stage" id="stage" aria-label="三维装配工作台">
    <div id="viewport"></div>
    <div class="stage-title">
      <h1 data-slot="stage.title"></h1>
      <p data-slot="stage.hint"></p>
    </div>
    <div class="toolbar" data-slot="stage.tools" aria-label="观察工具"></div>
    <button class="socket" id="socket" hidden>装到这里</button>
    <div class="preview-label" id="preview-label" hidden>拖动这块</div>
    <div class="scene-footer">
      <span data-slot="stage.gestures"></span>
      <div class="readout" id="readout" data-slot="stage.readout"></div>
    </div>
    <div id="fault" role="alert"></div>
  </section>

  <aside class="coach">
    <div class="ctag" data-slot="coach.tag"></div>
    <h2 data-slot="coach.title"></h2>
    <p class="intro" data-slot="coach.intro"></p>
    <div class="progress" role="progressbar" aria-label="装配进度" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" id="progress"><i id="pfill"></i></div>
    <div class="plabel"><span id="plabel"></span><span id="bcount"></span></div>
    <div class="task" id="task"></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="hintbox"><b data-slot="coach.hintLabel"></b><span id="hinttext"></span></div>
    <div data-slot="coach.extras"></div>
    <details class="technical" id="notes">
      <summary data-slot="coach.notesLabel"></summary>
      <div data-slot="coach.notes"></div>
    </details>
  </aside>

  <section class="tray" aria-label="零件盒">
    <div class="tray-head"><span id="tray-title"></span><small id="tray-hint"></small></div>
    <div class="mlist" id="mlist"></div>
  </section>
</main>
<script>window.__mechbench={slug:'double-cylinder-engine',built:true}</script>

<pre id="debug"></pre>

<script>
window.addEventListener('error', e => {
  const el = document.getElementById('fault');
  el.style.display = 'block';
  el.textContent = '工作台未能加载：' + e.message;
});
</script>

/* ==== kit/icons.mjs ==== */
/* mechbench · 通用零件图标（24×24，描边）
 * 物品在 manifest 里写 icon:'gear' 即可；要自定义就写 icon:'<path d="..."/>' 原样 SVG。
 */
const ICONS = {
  box:'<rect x="4" y="8" width="16" height="11" rx="1.5"/><path d="M4 12h16M9 8V5h6v3"/>',
  shell:'<path d="M4 9l8-4 8 4v7l-8 4-8-4z"/><path d="M4 9l8 4 8-4M12 13v7"/>',
  shaft:'<path d="M3 12h18"/><path d="M6 9v6M18 9v6"/>',
  gear:'<circle cx="12" cy="12" r="5"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.5 6.5l2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2"/>',
  spring:'<path d="M8 4h8M8 20h8"/><path d="M8 6l8 3-8 3 8 3-8 3"/>',

  plate:'<path d="M4 14l8-4 8 4-8 4z"/><path d="M7 13l3 1.5"/>',
  disc:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/>',
  piston:'<path d="M7 5h10v7H7z"/><path d="M10 12v6M14 12v6"/><path d="M7 8h10"/>',
  valve:'<path d="M12 4v9"/><path d="M8 16h8l-4 4z"/><path d="M9 4h6"/>',
  coil:'<circle cx="12" cy="12" r="6"/><path d="M12 6v12M9 6.8v10.4M15 6.8v10.4"/>',
  battery:'<rect x="3" y="8" width="15" height="8" rx="1.5"/><path d="M21 11v2"/><path d="M7 10v4M11 10v4"/>',
  bolt:'<path d="M12 4l5 3v6l-5 3-5-3V7z"/><circle cx="12" cy="10" r="2"/>',
  lever:'<path d="M4 18h16"/><path d="M8 18l6-10"/><circle cx="15" cy="7" r="2"/>',

function iconSvg(name, color) {
  const body = ICONS[name] || ICONS.box;
  return `<svg viewBox="0 0 24 24" aria-hidden="true"${color ? ` style="--pc:${color}"` : ''}>${body}</svg>`;

/* ==== kit/lab.mjs ==== */
/* mechbench · 布局渲染层
 * 把 manifest 的插槽填进固定骨架，并把玩家操作转成事件。
 * 不做三维（kit/scene.mjs）、不做业务规则（物品的 logic.mjs / main.mjs）。
 */

const COPY = {
  brand: { title: '装配实验室', subtitle: '', mark: { a: '#c2452d', b: '#9aa6b2' } },
  stage: {
    title: '装一台能动的机器',
    hint: '从下方零件盒选一块模块，拖到机身高亮处。',
    gestures: '拖动空白处旋转 · 右键平移 · 滚轮缩放<br>触屏双指平移 / 缩放',
  },
  tray: { title: '零件盒', hint: '点选模块，再拖到高亮位置' },
  coach: { tag: '第 {n} 关 / {total}', hintLabel: '工作台提示', notesLabel: '这是怎样的一套模型？' },
  tools: [
    { id: 'rotate', label: '旋转', pressed: true },
    { id: 'pan', label: '平移' },
    { id: 'cut', label: '剖开看' },
    { id: 'home', label: '复位' },
  ],
  labels: {
    exp: '本关要观察的', quiz: '判断一下', done: '本关完成',
    installed: '✓ 已归位', picked: '拿起这块', preloaded: '{n} 组零件预装',
  },
};

const q = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function pick(base, over) {
  const out = { ...base };
  for (const k of Object.keys(over || {})) {
    const v = over[k];
    out[k] = v && typeof v === 'object' && !Array.isArray(v) ? pick(base[k] || {}, v) : v;
  }
  return out;
}
function mountLab(item) {
  const copy = pick(COPY, item.copy);
  const chapters = item.chapters || [];
  const modules = item.modules || [];
  const tasks = item.tasks || [];
  const readout = item.readout || [];
  const tools = item.tools || copy.tools;

  const lab = {
    item,
    chapters,
    modules,
    attached3d: false,
    taskRenderer: null,
    state: {
      chapter: 0,
      placed: [],
      selected: null,
      phase: 'build',
      completed: [],
      badges: [],
      progress: null, // {done,total} 覆盖默认的「本关模块数」
      readout: {},
      visible: {},
      hint: '',
      feedback: '',
      feedbackKind: '',
      stageHint: '',
      trayTitle: '',
      trayHint: '',
      cardsLocked: false,
    },
    handlers: {},
    on(name, fn) {
      (lab.handlers[name] ||= []).push(fn);
      return lab;
    },
    emit(name, payload) {
      for (const fn of lab.handlers[name] || []) fn(payload);
    },
    moduleOf(id) {
      return modules.find((m) => m.id === id);
    },
    chapterModules(i = lab.state.chapter) {
      return modules.filter((m) => m.chapter === i);
    },
    /** 物品自定义教练面板：fn({chapter, phase, state, lab}) => {html, bind(root)} */
    task(fn) {
      lab.taskRenderer = fn;
      return lab;
    },
    render,
  };

  /* ---------- 静态插槽：挂载时填一次 ---------- */
  document.title = item.brand?.title || copy.brand.title;
  q('[data-slot="brand.title"]').textContent = item.brand?.title || copy.brand.title;
  q('[data-slot="brand.subtitle"]').textContent = item.brand?.subtitle || copy.brand.subtitle;
  const mark = item.brand?.mark || copy.brand.mark;
  q('[data-slot="brand.mark"]').innerHTML = mark.svg
    ? mark.svg
    : `<span style="position:absolute;left:6px;top:9px;width:9px;height:16px;border-radius:2px;background:${mark.a || '#c2452d'}"></span>
       <span style="position:absolute;left:19px;top:6px;width:9px;height:16px;border-radius:2px;background:${mark.b || '#9aa6b2'}"></span>`;

  q('[data-slot="stage.title"]').textContent = item.stage?.title || copy.stage.title;
  q('[data-slot="stage.hint"]').textContent = item.stage?.hint || copy.stage.hint;
  q('[data-slot="stage.gestures"]').innerHTML = item.stage?.gestures || copy.stage.gestures;
  q('[data-slot="coach.hintLabel"]').textContent = copy.coach.hintLabel;
  q('[data-slot="coach.notesLabel"]').textContent = copy.coach.notesLabel;
  q('[data-slot="coach.notes"]').innerHTML = (item.notes || []).map((p) => `<p>${p}</p>`).join('');
  q('#notes').hidden = !(item.notes || []).length;

  q('[data-slot="journey"]').innerHTML = chapters
    .map((c, i) => `<li data-chapter="${i}"><b>${i + 1}</b>${esc(c.title)}</li>`)
    .join('');

  q('[data-slot="stage.tools"]').innerHTML = tools
    .map((t) => `<button data-tool="${t.id}" aria-pressed="${t.pressed ? 'true' : 'false'}">${esc(t.label)}</button>`)
    .join('');

  q('#readout').innerHTML = readout
    .map((r) => `<div class="row"><span>${esc(r.label)}</span><b data-rd="${r.key}"${r.big ? ' class="big"' : ''}>—</b></div>`)
    .join('');

  q('[data-slot="coach.extras"]').innerHTML = (item.experiments || [])
    .map((x) => {
      if (x.control === 'toggle') {
        return `<div class="labctl toggle"><span>${esc(x.label)}</span>
          <button data-exp="${x.id}" aria-pressed="${x.value ? 'true' : 'false'}">${x.value ? '开' : '关'}</button></div>`;
      }
      if (x.control === 'button') return `<div class="labgrid"><button data-exp="${x.id}">${esc(x.label)}</button></div>`;
      return `<label class="labctl">${esc(x.label)}<output data-exp-out="${x.id}">${x.value ?? ''}${x.unit || ''}</output>
        <input type="range" data-exp="${x.id}" min="${x.min}" max="${x.max}" step="${x.step || 1}" value="${x.value ?? x.min}"></label>`;
    })
    .join('');

  /* ---------- 动态插槽 ---------- */
  function renderCards() {
    const list = q('#mlist');
    const chMods = lab.chapterModules();
    if (!chMods.length) {
      list.innerHTML = '<div class="empty"><div><strong>这一关没有模块</strong>检查 manifest 的 modules[].chapter。</div></div>';
      return;
    }
    list.innerHTML = chMods
      .map((m) => {
        const installed = lab.state.placed.includes(m.id);
        const sub = installed
          ? copy.labels.installed
          : m.sub || (m.parts?.length > 1 ? copy.labels.preloaded.replace('{n}', m.parts.length) : copy.labels.picked);
        return `<button class="card" data-id="${m.id}" data-installed="${installed}" style="--pc:${m.color || '#5b6470'}"
          aria-pressed="${lab.state.selected === m.id}"${installed || lab.state.cardsLocked ? ' disabled' : ''}>
          <svg viewBox="0 0 24 24" aria-hidden="true">${m.icon && m.icon.startsWith('<') ? m.icon : iconBody(m.icon || 'box')}</svg>
          <span><strong>${esc(m.name)}</strong><small>${esc(sub)}</small></span></button>`;
      })
      .join('');
  }

  function renderTask() {
    const ch = chapters[lab.state.chapter] || {};
    if (lab.taskRenderer) {
      const out = lab.taskRenderer({ chapter: ch, chapterIndex: lab.state.chapter, phase: lab.state.phase, state: lab.state, lab }) || {};
      q('#task').innerHTML = out.html || '';
      out.bind?.(q('#task'));
      return;
    }
    const task = tasks[lab.state.chapter] || {};
    const s = lab.state;
    const head = `<p class="label">${esc(copy.labels.exp)}</p><h3>${esc(task.exp || ch.title || '')}</h3>
      <p>${esc(task.expText || ch.subtitle || '')}</p>`;
    if (s.phase === 'check' && task.options) {
      q('#task').innerHTML =
        head +
        `<p class="label">${esc(copy.labels.quiz)}</p><div class="options">${task.options
          .map((o, i) => `<button data-opt="${i}"><b>${'ABCD'[i]}</b>${esc(o)}</button>`)
          .join('')}</div>`;
      return;
    }
    if (s.phase === 'done') {
      q('#task').innerHTML =
        head +
        `<div class="badge">${esc(ch.badge || '✓')}</div><p>${esc(task.why || '')}</p>
         <div class="sub">${
           s.chapter < chapters.length - 1 ? '<button class="primary" data-act="next">进入下一关</button>' : ''
         }<button data-act="replay">再看一遍</button></div>`;
      return;
    }
    q('#task').innerHTML =
      head +
      `<div class="sub"><button class="primary" data-act="place"${s.selected ? '' : ' disabled'}>装到这里</button>
       <button data-act="undo"${s.placed.length ? '' : ' disabled'}>撤回一步</button></div>`;
  }

  function render() {
    const s = lab.state;
    for (const li of document.querySelectorAll('.journey li')) {
      const i = Number(li.dataset.chapter);
      li.className = s.completed?.[i] ? 'done' : i === s.chapter ? 'active' : '';
      li.querySelector('b').textContent = s.completed?.[i] ? '✓' : i + 1;
    }
    const ch = chapters[s.chapter] || {};
    const co = s.coach || {};
    q('[data-slot="coach.tag"]').textContent =
      co.tag ?? (copy.coach.tag || '').replace('{n}', s.chapter + 1).replace('{total}', chapters.length);
    q('[data-slot="coach.title"]').textContent = co.title ?? ch.title ?? '';
    q('[data-slot="coach.intro"]').textContent = co.intro ?? ch.subtitle ?? '';
    q('[data-slot="stage.hint"]').textContent = s.stageHint || item.stage?.hint || copy.stage.hint;

    const chMods = lab.chapterModules();
    const p = s.progress || { done: chMods.filter((m) => s.placed.includes(m.id)).length, total: chMods.length };
    const bar = q('#progress');
    bar.setAttribute('aria-valuemax', String(p.total || 1));
    bar.setAttribute('aria-valuenow', String(p.done));
    q('#pfill').style.width = (p.total ? (p.done / p.total) * 100 : 0) + '%';
    q('#plabel').textContent = `${p.done} / ${p.total} 块模块`;
    q('#bcount').textContent = `${(s.badges || []).length} 个徽章`;

    q('#tray-title').textContent = s.trayTitle || item.tray?.title || copy.tray.title;
    q('#tray-hint').textContent = s.trayHint || item.tray?.hint || copy.tray.hint;

    renderTask();
    renderCards();

    const fb = q('#feedback');
    fb.className = 'feedback' + (s.feedbackKind ? ' ' + s.feedbackKind : '');
    if (s.feedback) fb.textContent = s.feedback;
    q('#hinttext').textContent = s.hint || '';

    const ro = q('#readout');
    ro.classList.toggle('on', !!s.visible.readout);
    for (const b of ro.querySelectorAll('[data-rd]')) {
      const v = s.readout[b.dataset.rd];
      if (v != null) b.textContent = v;
    }
    // 有三维时 socket 的显隐与位置由 kit/scene.mjs 负责
    if (!lab.attached3d) q('#socket').hidden = !(s.selected && s.phase === 'build');
  }

  /* ---------- 交互：只发事件 ---------- */
  document.addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (card && !card.disabled) return lab.emit('select', card.dataset.id);
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act) return lab.emit(act);
    const tool = e.target.closest('[data-tool]')?.dataset.tool;
    if (tool) {
      if (tool === 'cut') {
        const b = e.target.closest('[data-tool]');
        b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
      }
      return lab.emit('tool', tool);
    }
    if (e.target.id === 'free-lab') return lab.emit('free');
    if (e.target.id === 'restart') return lab.emit('restart');
    if (e.target.id === 'socket') return lab.emit('place');
    const opt = e.target.closest('[data-opt]');
    if (opt) return lab.emit('answer', Number(opt.dataset.opt));
    const exp = e.target.closest('[data-exp]');
    if (exp) {
      const id = exp.dataset.exp;
      const spec = (item.experiments || []).find((x) => x.id === id) || {};
      const value =
        exp.tagName === 'BUTTON'
          ? spec.control === 'toggle'
            ? exp.getAttribute('aria-pressed') !== 'true'
            : null
          : Number(exp.value);
      return lab.emit('experiment', { id, value });
    }
  });

  document.addEventListener('input', (e) => {
    const id = e.target.dataset?.exp;
    if (!id) return;
    const out = document.querySelector(`[data-exp-out="${id}"]`);
    const exp = (item.experiments || []).find((x) => x.id === id);
    if (out) out.textContent = e.target.value + (exp?.unit || '');
    lab.emit('experiment', { id, value: Number(e.target.value) });
  });

  render();
  return lab;
}

function iconBody(name) {
  const set = typeof ICONS === 'undefined' ? {} : ICONS;
  return set[name] || set.box || '<rect x="4" y="8" width="16" height="11" rx="1.5"/>';
}

/* ==== kit/scene.mjs ==== */
/* mechbench · 三维舞台（kit）
 * 相机/灯光/地面/剖切/目标轮廓/拾取/拖放/取景/循环 —— 所有物品共用。
 * 物品只给几何（model.mjs）、数值（manifest.scene）、回调。
 */



const vec = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

const DEFAULT = {
  spawn: [255, 26, 155],
  renderer: { exposure: 0.94, pixelRatio: 1.5 },
  camera: { fov: 32, near: 2, far: 6000, defaultFocus: 'engine' },
  orbit: { minDistance: 190, maxDistance: 1800, minPolar: 0.06, maxPolar: 0.54 },
  bench: { y: -110, color: 0xdfe5ea, size: 4000 },
  env: 0.48,
  lights: {
    hemi: [0xffffff, 0x9aa7b3, 0.62],
    key: { color: 0xfff6ec, intensity: 2.0, pos: [-190, 300, 240] },
    fill: { color: 0xdce8f4, intensity: 0.85, pos: [280, 90, 240] },
    rim: { color: 0xcfe0f0, intensity: 0.8, pos: [160, 200, -300] },
  },
  cut: { normal: [0, 0, -1], constant: 0 },
  ghost: { color: 0x9aa4ad, opacity: 0.62 },
  target: { color: 0x2f6f9f, opacity: 0.17 },
  focus: {},
  nearRadius: { wide: 52, narrow: 66 },
};

function merge(base, over) {
  const out = { ...base };
  for (const k of Object.keys(over || {})) {
    const v = over[k];
    out[k] = v && typeof v === 'object' && !Array.isArray(v) ? merge(base[k] || {}, v) : v;
  }
  return out;
}
function createStage(opts) {
  const cfg = merge(DEFAULT, opts.config);
  const host = opts.host;
  const stageEl = opts.stageEl;
  const worldGroup = opts.world;
  const modules = opts.modules || [];
  const model = opts.model || {};
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 渲染器 / 场景 ---------- */
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, cfg.renderer.pixelRatio));
  renderer.setSize(stageEl.clientWidth, stageEl.clientHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = cfg.renderer.exposure;
  renderer.localClippingEnabled = true;
  renderer.domElement.setAttribute('aria-label', '三维装配台：选中模块后拖到安装位置，也可用「装到这里」按钮');
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.add(worldGroup);
  const camera = new THREE.PerspectiveCamera(cfg.camera.fov, stageEl.clientWidth / stageEl.clientHeight, cfg.camera.near, cfg.camera.far);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.085;
  controls.enablePan = true;
  controls.screenSpacePanning = true;
  controls.rotateSpeed = 0.62;
  controls.zoomSpeed = 0.8;
  controls.panSpeed = 0.8;
  controls.minDistance = cfg.orbit.minDistance;
  controls.maxDistance = cfg.orbit.maxDistance;
  controls.minPolarAngle = Math.PI * cfg.orbit.minPolar;
  controls.maxPolarAngle = Math.PI * cfg.orbit.maxPolar;
  controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  pmrem.dispose();
  scene.environmentIntensity = cfg.env;

  const [hs, hg, hi] = cfg.lights.hemi;
  scene.add(new THREE.HemisphereLight(hs, hg, hi));
  for (const k of ['key', 'fill', 'rim']) {
    const l = cfg.lights[k];
    if (!l) continue;
    const dir = new THREE.DirectionalLight(l.color, l.intensity);
    dir.position.set(...l.pos);
    scene.add(dir);
  }

  const bench = new THREE.Mesh(
    new THREE.PlaneGeometry(cfg.bench.size, cfg.bench.size),
    new THREE.MeshStandardMaterial({ color: cfg.bench.color, roughness: 0.97, metalness: 0 })
  );
  bench.rotation.x = -Math.PI / 2;
  bench.position.y = cfg.bench.y;
  scene.add(bench);

  /* ---------- 剖切 ---------- */
  const CUT = new THREE.Plane(vec(...cfg.cut.normal), cfg.cut.constant);
  const GHOST = new THREE.MeshStandardMaterial({
    color: cfg.ghost.color, roughness: 0.9, metalness: 0,
    transparent: true, opacity: cfg.ghost.opacity, depthWrite: false,
    side: THREE.DoubleSide, clippingPlanes: [CUT],
  });
  const TARGET = new THREE.MeshBasicMaterial({
    color: cfg.target.color, transparent: true, opacity: cfg.target.opacity,
    depthWrite: false, side: THREE.DoubleSide,
  });
  const ghostGroup = new THREE.Group();
  scene.add(ghostGroup);
  let targetKey = null;

  /* ---------- 视图状态 ---------- */
  const view = {
    crankDeg: 0, camDeg: 0, speed: 1, running: false, cut: false, solid: false,
    navigation: 'rotate', selected: null, offsets: new Map(), drag: null, focus: cfg.camera.defaultFocus,
    hintOn: false,
  };
  const SPAWN = vec(...cfg.spawn);

  const byKey = model.byKey;
  const info = new Map(
    modules.map((m) => {
      const b = model.moduleBounds(m.parts);
      return [m.id, { ...m, bounds: b, center: b.getCenter(vec()), size: b.getSize(vec()) }];
    })
  );

  const socketEl = document.getElementById('socket');
  const previewEl = document.getElementById('preview-label');
  const state = () => (opts.getState ? opts.getState() : {});

  /* ---------- 摆位与材质 ---------- */
  const moduleOffsetTarget = (id) => (state().placed?.includes(id) ? vec() : SPAWN.clone());

  function render(dt = 1) {
    const s = state();
    for (const m of modules) {
      const installed = s.placed?.includes(m.id);
      const selected = s.selected === m.id;
      const visible = installed || selected;
      let off = view.offsets.get(m.id);
      if (!off) {
        off = moduleOffsetTarget(m.id).clone();
        view.offsets.set(m.id, off);
      }
      if (view.drag?.id !== m.id) {
        const want = moduleOffsetTarget(m.id);
        if (reduced || dt === 1) off.copy(want);
        else off.lerp(want, Math.min(1, dt * 12));
      }
      for (const key of m.parts) {
        const p = byKey.get(key);
        if (!p) continue;
        p.g.visible =
          visible && !(cfg.hiddenPart && cfg.hiddenPart(key, s));
        p.g.position.copy(off);
        materials(p, installed || view.solid);
      }
    }
    model.applyMotion(view.crankDeg, view.camDeg);
    worldGroup.updateMatrixWorld(true);
  }

  // 外壳在剖开模式下换成剖切玻璃；正在拖动的模块保持实体，否则会被切成半个
  function materials(p, showSolid) {
    const ghost = showSolid && view.cut && p.shell && !(view.focus !== 'all' && view.focus === p.key);
    p.g.traverse((o) => {
      if (!o.isMesh) return;
      if (ghost) {
        if (!p.ghostMat) {
          p.ghostMat = GHOST.clone();
          p.ghostMat.opacity = 0.58 + 0.06 * Math.min(p.layer || 0, 2);
        }
        o.material = p.ghostMat;
        o.renderOrder = 3;
      } else if (o.material !== o.userData.omat) {
        o.material = o.userData.omat;
        o.renderOrder = 0;
      }
    });
  }

  /* ---------- 目标轮廓 ---------- */
  function setTarget(keys) {
    const want = keys ? keys.join('|') : null;
    const always = typeof opts.targetAlways === 'function' ? opts.targetAlways() : !!opts.targetAlways;
    const show = !!keys && keys.length && (view.hintOn || always);
    if (want === targetKey && !show) {
      ghostGroup.visible = show;
      return;
    }
    for (const c of [...ghostGroup.children]) ghostGroup.remove(c);
    targetKey = want;
    if (!show) {
      ghostGroup.visible = false;
      return;
    }
    for (const key of keys) {
      const p = byKey.get(key);
      if (!p) continue;
      const clone = p.obj.clone(true);
      clone.traverse((o) => {
        if (o.isMesh) o.material = TARGET;
      });
      ghostGroup.add(clone);
    }
    ghostGroup.visible = true;
  }

  /* ---------- 相机 ---------- */
  const box = new THREE.Box3();
  for (const p of model.PARTS || []) box.union(new THREE.Box3().setFromObject(p.g));
  const MODEL_CENTER = box.getCenter(vec());
  const MODEL_SIZE = box.getSize(vec());

  function focusSpec(name) {
    const f = cfg.focus[name] || {};
    const dir = f.dir || [0, 18];
    if (f.box) return { center: vec(...f.box[0]), size: vec(...f.box[1]), dir, fit: f.fit || 1 };
    if (name === cfg.camera.defaultFocus || !name) return { center: MODEL_CENTER.clone(), size: MODEL_SIZE.clone(), dir, fit: f.fit || 1.1 };
    const p = byKey.get(name);
    if (!p) return { center: MODEL_CENTER.clone(), size: MODEL_SIZE.clone(), dir, fit: f.fit || 1.1 };
    const b = new THREE.Box3().setFromObject(p.g);
    const size = b.getSize(vec());
    size.set(Math.max(size.x, 30), Math.max(size.y, 30), Math.max(size.z, 30));
    return { center: b.getCenter(vec()), size, dir, fit: f.fit || 1.75 };
  }

  function fitCamera(name = cfg.camera.defaultFocus) {
    view.focus = name;
    const { center, size, dir, fit } = focusSpec(name);
    const f = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const narrow = stageEl.clientWidth < 620;
    const usableW = stageEl.clientWidth - (narrow ? 40 : 90);
    const usableH = stageEl.clientHeight - (narrow ? 150 : 40);
    const dist =
      Math.max(
        (size.y / (2 * f)) * (stageEl.clientHeight / usableH),
        (size.x / (2 * f * camera.aspect)) * (stageEl.clientWidth / usableW)
      ) * fit + 40;
    const [yaw, pitch] = dir.map((d) => (d * Math.PI) / 180);
    camera.position.copy(center).add(vec(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(dist));
    controls.target.copy(center);
    controls.update();
  }

  let userNavigated = false;
  controls.addEventListener('start', () => {
    userNavigated = true;
  });

  /* ---------- 导航 ---------- */
  function setNavigation(mode) {
    view.navigation = mode;
    controls.mouseButtons.LEFT = mode === 'pan' ? THREE.MOUSE.PAN : THREE.MOUSE.ROTATE;
    controls.touches.ONE = mode === 'pan' ? THREE.TOUCH.PAN : THREE.TOUCH.ROTATE;
    for (const b of document.querySelectorAll('[data-tool]')) {
      if (b.dataset.tool === 'rotate' || b.dataset.tool === 'pan') b.setAttribute('aria-pressed', String(b.dataset.tool === mode));
    }
    renderer.domElement.style.cursor = mode === 'pan' ? 'move' : 'grab';
  }

  /* ---------- 屏幕坐标 ---------- */
  function project(v) {
    const p = v.clone().project(camera);
    return { x: (p.x * 0.5 + 0.5) * stageEl.clientWidth, y: (-0.5 * p.y + 0.5) * stageEl.clientHeight };
  }

  function nearTarget(id) {
    const next = opts.nextModule ? opts.nextModule() : null;
    if (!next || !info.get(id)) return false;
    const a = project(info.get(id).center.clone().add(view.offsets.get(id) || vec()));
    const b = project(info.get(next.id).center);
    const r = stageEl.clientWidth < 620 ? cfg.nearRadius.narrow : cfg.nearRadius.wide;
    return Math.hypot(a.x - b.x, a.y - b.y) < r;
  }

  function overlay() {
    const s = state();
    const next = opts.nextModule ? opts.nextModule() : null;
    const showSocket = !!next && s.phase === 'build' && !s.lab;
    if (socketEl) {
      socketEl.hidden = !showSocket;
      if (showSocket) {
        const md = info.get(next.id);
        const p = project(vec(md.center.x, md.bounds.max.y + 16, md.center.z));
        socketEl.style.left = p.x + 'px';
        socketEl.style.top = p.y + 'px';
        socketEl.disabled = !s.selected;
        socketEl.classList.toggle('near', !!s.selected && nearTarget(s.selected));
      }
    }
    const sel = s.selected && info.get(s.selected);
    if (previewEl) {
      previewEl.hidden = !sel || s.phase !== 'build';
      if (sel) {
        const c = sel.center.clone().add(view.offsets.get(sel.id) || vec());
        const p = project(vec(c.x, c.y + sel.size.y / 2 + 14, c.z));
        previewEl.style.left = p.x + 'px';
        previewEl.style.top = p.y + 'px';
      }
    }
    if (next) setTarget(next.parts);
    else setTarget(null);
  }

  /* ---------- 拾取与拖放 ---------- */
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const clickables = [];
  for (const p of model.PARTS || []) p.g.traverse((o) => o.isMesh && clickables.push(o));

  function rayAt(e) {
    const r = renderer.domElement.getBoundingClientRect();
    pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, 1 - ((e.clientY - r.top) / r.height) * 2);
    raycaster.setFromCamera(pointer, camera);
  }
  const visibleIn = (o) => {
    for (let x = o; x; x = x.parent) if (!x.visible) return false;
    return true;
  };
  function pickKey(e) {
    rayAt(e);
    const hit = raycaster.intersectObjects(clickables.filter(visibleIn), false)[0];
    if (!hit) return null;
    let o = hit.object;
    while (o && !o.userData.key) o = o.parent;
    return o ? o.userData.key : null;
  }

  const canDrag = () => (opts.canDrag ? opts.canDrag() : true) && view.navigation !== 'pan';
  let downPt = null;

  renderer.domElement.addEventListener('pointerdown', (e) => {
    downPt = { x: e.clientX, y: e.clientY };
  }, { capture: true });

  renderer.domElement.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || !canDrag()) return;
    const s = state();
    const m = info.get(s.selected);
    if (!m) return;
    rayAt(e);
    const objs = m.parts.map((k) => byKey.get(k).g).filter(Boolean);
    const hit = raycaster.intersectObjects(objs, true).find((h) => visibleIn(h.object));
    if (!hit) return;
    const off = view.offsets.get(m.id) || vec();
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(camera.getWorldDirection(vec()), m.center.clone().add(off));
    const point = raycaster.ray.intersectPlane(plane, vec());
    if (!point) return;
    view.drag = { id: m.id, pointerId: e.pointerId, plane, start: point.clone(), offset: off.clone() };
    controls.enabled = false;
    renderer.domElement.setPointerCapture?.(e.pointerId);
    renderer.domElement.style.cursor = 'grabbing';
    e.preventDefault();
    e.stopImmediatePropagation();
  }, { capture: true });

  renderer.domElement.addEventListener('pointermove', (e) => {
    if (!view.drag || view.drag.pointerId !== e.pointerId) return;
    rayAt(e);
    const p = raycaster.ray.intersectPlane(view.drag.plane, vec());
    if (p) {
      if (!view.offsets.has(view.drag.id)) view.offsets.set(view.drag.id, vec());
      view.offsets.get(view.drag.id).copy(view.drag.offset).add(p.sub(view.drag.start));
    }
    socketEl?.classList.toggle('near', nearTarget(view.drag.id));
    e.preventDefault();
    e.stopImmediatePropagation();
  }, { capture: true });

  function releaseDrag(e, cancel) {
    if (!view.drag || view.drag.pointerId !== e.pointerId) return;
    const id = view.drag.id;
    const onTarget = !cancel && nearTarget(id);
    view.drag = null;
    controls.enabled = true;
    renderer.domElement.releasePointerCapture?.(e.pointerId);
    setNavigation(view.navigation);
    socketEl?.classList.remove('near');
    if (!cancel && onTarget) opts.onDrop?.(id, true);
    else if (!cancel) opts.onDrop?.(id, false);
    e.stopImmediatePropagation();
  }
  renderer.domElement.addEventListener('pointerup', (e) => releaseDrag(e, false), { capture: true });
  renderer.domElement.addEventListener('pointercancel', (e) => releaseDrag(e, true), { capture: true });

  renderer.domElement.addEventListener('click', (e) => {
    // 旋转/平移后松手也会派发 click：位移 > 5px 就不算点击
    if (downPt && Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y) > 5) return;
    if (view.drag) return;
    const k = pickKey(e);
    if (k && opts.onPickKey) opts.onPickKey(k, view.focus === k);
  });

  /* ---------- 尺寸与循环 ---------- */
  function resize() {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    if (!userNavigated) fitCamera(view.focus);
  }
  new ResizeObserver(resize).observe(stageEl);

  function start() {
    let prev = performance.now();
    renderer.setAnimationLoop((now) => {
      const dt = Math.min(0.05, Math.max(0, (now - prev) / 1000));
      prev = now;
      opts.tick?.(dt);
      render(dt);
      controls.update();
      overlay();
      renderer.render(scene, camera);
    });
  }

  resize();
  render(1);
  fitCamera(view.focus);

  return {
    view, renderer, scene, camera, controls, info, spawn: SPAWN, fitCamera, setNavigation, project,
    nearTarget, overlay, render, start, setTarget, resize,
    get solidScreen() {
      return renderer.domElement;
    },
  };
}

/* ====== 几何助手 ====== */
function mergeGeos(list){
  let n = 0, ni = 0;
  for (const g of list){ n += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; }
  const pos = new Float32Array(n * 3), idx = new Uint32Array(ni);
  let vo = 0, io = 0;
  for (const g of list){
    pos.set(g.attributes.position.array, vo * 3);
    const c = g.attributes.position.count;
    if (g.index){ const a = g.index.array; for (let i = 0; i < a.length; i++) idx[io++] = a[i] + vo; }
    else for (let i = 0; i < c; i++) idx[io++] = i + vo;
    vo += c;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  return geo;
}
function flipIndex(g){
  const t = g.index.array;
  for (let i = 0; i < t.length; i += 3){ const s = t[i]; t[i] = t[i + 2]; t[i + 2] = s; }
  g.index.needsUpdate = true; g.computeVertexNormals(); return g;
}
function latheX(profile, seg = 64){          // [[x, r], ...]

}
function latheY(profile, seg = 64){          // [[y, r], ...]

}
function cylX(x0, x1, r, seg = 32){

}
function cylY(y0, y1, r, seg = 24){

}
// 空心圆环管（沿 x），各面用 three 自带几何保证绕向
function ringX(x0, x1, ri, ro, seg = 48){
  const parts = [];
  let g = new THREE.CylinderGeometry(ro, ro, x1 - x0, seg, 1, true);
  g.rotateZ(-Math.PI / 2); g.translate((x0 + x1) / 2, 0, 0); parts.push(g);
  g = new THREE.CylinderGeometry(ri, ri, x1 - x0, seg, 1, true);
  g.rotateZ(-Math.PI / 2); g.translate((x0 + x1) / 2, 0, 0); parts.push(flipIndex(g));
  g = new THREE.RingGeometry(ri, ro, seg); g.rotateY(-Math.PI / 2); g.translate(x0, 0, 0); parts.push(g);
  g = new THREE.RingGeometry(ri, ro, seg); g.rotateY(Math.PI / 2); g.translate(x1, 0, 0); parts.push(g);

function ringY(y, h, ri, ro, seg = 48){
  const sh = new THREE.Shape(circlePts(0, 0, ro, seg).map(([u, v]) => new THREE.Vector2(u, v)));
  sh.holes.push(new THREE.Path(circlePts(0, 0, ri, seg, false).map(([u, v]) => new THREE.Vector2(u, v))));
  const g = new THREE.ExtrudeGeometry(sh, { depth: h, bevelEnabled: false, curveSegments: 6 });

function rectPts(u0, u1, v0, v1, r, seg = 4){    // 圆角矩形，CCW
  const pts = [];
  const corner = (cu, cv, a0) => {
    for (let i = 0; i <= seg; i++){
      const a = a0 + (Math.PI / 2) * (i / seg);
      pts.push([cu + Math.cos(a) * r, cv + Math.sin(a) * r]);
    }
  };
  corner(u1 - r, v0 + r, -Math.PI / 2); corner(u1 - r, v1 - r, 0);
  corner(u0 + r, v1 - r, Math.PI / 2); corner(u0 + r, v0 + r, Math.PI);

function notchRect(u0, u1, v0, v1, zr, xn){      // 左侧开槽的矩形，CCW

function circlePts(u, v, r, seg = 48, ccw = true){

/* 棱柱：外轮廓 CCW + 孔 CW，沿 y。壁面逐边生成（不重叠），可以安全叠加剖切面。*/
function prismXZ(outer, holes, y0, y1, opt = {}){
  const shape = new THREE.Shape(outer.map(([u, v]) => new THREE.Vector2(u, v)));
  for (const h of holes) shape.holes.push(new THREE.Path(h.map(([u, v]) => new THREE.Vector2(u, v))));
  const cap = new THREE.ShapeGeometry(shape);
  cap.deleteAttribute('uv'); cap.deleteAttribute('normal');

    const bottom = cap.clone(); bottom.translate(0, y0, 0);
    const top = cap.clone(); top.translate(0, y1, 0); flipIndex(top);
    geos.push(bottom, top);
  }
  const wall = (contour) => {
    const pos = [], idx = [];
    for (let i = 0; i < contour.length; i++){
      const [pu, pv] = contour[i], [qu, qv] = contour[(i + 1) % contour.length];
      const b = pos.length / 3;
      pos.push(pu, y0, pv, qu, y0, qv, qu, y1, qv, pu, y1, pv);
      idx.push(b, b + 2, b + 1, b, b + 3, b + 2);

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx); g.computeVertexNormals(); return g;

/* 剖面在 (z,y) 平面、沿 x 拉伸的板件：用于曲轴箱主轴承隔板 */
function prismYZ(pts, holes, x0, x1){
  const g = prismXZ(pts, holes, x0, x1);

function halfDiscPts(r, sgn, seg = 24){
  const pts = [];

    pts.push([r * Math.cos(t), sgn * r * Math.sin(t)]);

/* 半圆环隔板：sgn=+1 上半 / -1 下半 */
function halfBulkhead(x0, x1, ri, ro, sgn, seg = 30){
  const pts = [];
  const arc = (r, a0, a1, n) => {
    for (let k = 0; k <= n; k++){
      const t = a0 + (a1 - a0) * k / n;
      pts.push([r * Math.cos(t), sgn * r * Math.sin(t)]);       // [z, y]
    }
  };
  if (sgn > 0){ arc(ro, 0, Math.PI, seg); arc(ri, Math.PI, 0, seg); }
  else { arc(ro, Math.PI, 0, seg); arc(ri, 0, Math.PI, seg); }

}
function toothedRingX(x0, x1, rRoot, rTip, n, rIn){
  const step = TAU / n, pts = [];
  for (let i = 0; i < n; i++){
    const a = i * step;
    pts.push([rRoot, a], [rTip, a + step * .3], [rTip, a + step * .58], [rRoot, a + step * .8]);
  }
  const sh = new THREE.Shape(pts.map(([r, a]) => new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r)));

  const g = new THREE.ExtrudeGeometry(sh, { depth: x1 - x0, bevelEnabled: false, curveSegments: 10 });

}
function lobeGeo(x0, x1, rFn, n = 168){
  const pos = [], idx = [];
  for (let i = 0; i <= n; i++){
    const a = (i / n) * TAU, r = rFn(a);
    pos.push(x0, r * Math.cos(a), r * Math.sin(a), x1, r * Math.cos(a), r * Math.sin(a));
  }
  for (let i = 0; i < n; i++){
    const p = i * 2, q = p + 2;
    idx.push(p, q + 1, q, p, p + 1, q + 1);
  }
  const c0 = pos.length / 3; pos.push(x0, 0, 0);
  const c1 = pos.length / 3; pos.push(x1, 0, 0);
  for (let i = 0; i < n; i++){
    idx.push(c0, i * 2, i * 2 + 2);
    idx.push(c1, i * 2 + 3, i * 2 + 1);

function helixY(y0, y1, radius, wire, turns, seg = 7){
  const pts = [], n = Math.round(turns * 26);
  for (let i = 0; i <= n; i++){
    const t = i / n, a = t * turns * TAU;
    pts.push(new THREE.Vector3(radius * Math.cos(a), y0 + (y1 - y0) * t, radius * Math.sin(a)));

function boxG(w, h, d, x = 0, y = 0, z = 0){
  const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); return g;

/* ====== 材质 ====== */
const M = {
  caseAlu:   new THREE.MeshStandardMaterial({ color: 0x6b727a, roughness: .62, metalness: .55 }),
  barrel:    new THREE.MeshStandardMaterial({ color: 0xb3b8bd, roughness: .46, metalness: .62 }),

  steelDark: new THREE.MeshStandardMaterial({ color: 0x989ea5, roughness: .36, metalness: 1 }),
  piston:    new THREE.MeshStandardMaterial({ color: 0xd6dade, roughness: .3, metalness: .95 }),
  ring:      new THREE.MeshStandardMaterial({ color: 0x5d6369, roughness: .38, metalness: 1 }),

const parts = [], byKey = new Map();
function addPart(key, name, obj, mat, opt = {}){
  obj.traverse(o => {
    if (!o.isMesh) return;
    if (!o.userData.keepMat){
      o.material = mat.clone();
      o.castShadow = opt.shadow !== false; o.receiveShadow = opt.shadow !== false;
    }
    o.userData.omat = o.material;
    o.userData.ocast = o.castShadow;
    o.userData.key = key;
  });
  const g = new THREE.Group(); g.userData.key = key; g.add(obj); world.add(g);
  const p = { key, name, g, obj, e: 0, off: V(), mat, layer: 0, shell: !!opt.shell };
  parts.push(p); byKey.set(key, p);
  return p;
}

    const mid = -psiPeak * DEG;      // 挺柱在凸轮正下方：跟随者方位 = 0°
    const half = DUR_CAM * DEG / 2;                 // 升程包半宽（凸轮角）
    MECH.lobes.push({ mid, half, h: D.CAM_LIFT, xc, kind, i });
    // 几何里的角度是"点相对 +y 的方位角"，挺柱在 -y（方位 π）：
    // 凸轮转过 camDeg 后，方位角 = mid + camDeg，要压在挺柱上就得 mid_geo = mid_math + π
    const midGeo = mid + Math.PI;
    geos.push(lobeGeo(xc - 6, xc + 6, camRadiusFn([{ mid: midGeo, half, h: D.CAM_LIFT }]), 168));
  }
  spin.add(new THREE.Mesh(mergeGeos(geos), M.cam));

/* ====== 运动学：几何 / 视图 / 读数 / 自检共用 ====== */
function pistonPinY(ca){
  const s = D.R * Math.sin(ca);
  return D.R * Math.cos(ca) + Math.sqrt(D.ROD * D.ROD - s * s);
}
function rodAngle(ca){                     // 连杆绕 x 的摆角（大头→小头）
  const s = D.R * Math.sin(ca);
  return Math.atan2(-s, Math.sqrt(D.ROD * D.ROD - s * s));
}
function camRadiusFn(lobes){
  return (a) => {
    let r = D.CAM_RB;
    for (const L of lobes){
      let d = a - L.mid;
      d = ((d + Math.PI) % TAU + TAU) % TAU - Math.PI;
      const u = d / L.half;
      if (Math.abs(u) < 1) r = Math.max(r, D.CAM_RB + L.h * .5 * (1 + Math.cos(Math.PI * u)));
    }
    return r;
  };
}
// 凸轮轴局部角（度）下的升程：凸轮几何、挺柱位移、气门位移、读数全部取自它
function camLift(localDeg, i, kind){
  const L = MECH.lobes.find(l => l.i === i && l.kind === kind);   // 每只气门只受自己那一个凸轮驱动
  if (!L) return 0;
  let d = localDeg - L.mid / DEG;
  d = ((d + 180) % 360 + 360) % 360 - 180;
  const u = d / (L.half / DEG);
  return Math.abs(u) < 1 ? L.h * .5 * (1 + Math.cos(Math.PI * u)) : 0;
}
function valveState(crankDeg, camDegIn){
  const camDeg = camDegIn === undefined ? crankDeg / 2 : camDegIn, out = [];
  for (let i = 0; i < 2; i++) for (const kind of ['im', 'ex']){
    const h = camLift(-camDeg, i, kind);
    out.push({ i, kind, lift: h, valveLift: h });
  }
  return out;
}
function sparkState(crankDeg){
  const c = ((crankDeg % 720) + 720) % 720;
  return [0, 1].map(i => {
    const raw = ((c - i * 360) % 720 + 720) % 720;      // 点火间隔 720°，不能按 360° 取模
    const dist = Math.min(raw, 720 - raw);
    return { i, on: dist < 8, phase: dist };
  });
}
/* 四冲程阶段（0=进气 1=压缩 2=做功 3=排气） */
function strokeOf(crankDeg, i){
  const c = ((crankDeg - i * 360) % 720 + 720) % 720;
  if (c < 180) return 2;        // 做功 0..180
  if (c < 360) return 3;        // 排气 180..360
  if (c < 540) return 0;        // 进气 360..540
  return 1;                     // 压缩 540..720
}

/* ====== 摆到某个曲轴角 ====== */
function applyMotion(crankDeg, camDegIn){
  const ca = crankDeg * DEG;
  const camRad = (camDegIn === undefined ? crankDeg / 2 : camDegIn) * DEG;
  if (MECH.crankSpin) MECH.crankSpin.rotation.x = ca;
  if (MECH.crankSpr) MECH.crankSpr.rotation.x = ca;
  if (MECH.rotor) MECH.rotor.rotation.x = ca;
  if (MECH.camSpin) MECH.camSpin.rotation.x = camRad;
  if (MECH.camSpr) MECH.camSpr.rotation.x = camRad;

  const cy = D.R * Math.cos(ca), cz = D.R * Math.sin(ca), ang = rodAngle(ca);
  for (let i = 0; i < 2; i++){
    const rod = MECH.rods[i];
    if (rod){ rod.position.set(CYL_X[i], cy, cz); rod.rotation.x = ang; }
    const pis = MECH.pistons[i];
    if (pis) pis.position.set(CYL_X[i], pistonPinY(ca), 0);
  }
  const vs = valveState(crankDeg, camDegIn);
  for (const v of MECH.valves){
    const st = vs.find(o => o.i === v.i && o.kind === v.kind);
    const lift = st ? st.valveLift : 0;
    v.node.position.y = D.VSEAT - lift;
    v.spring.scale.y = (D.SPR_FREE - lift) / D.SPR_FREE;
    v.ret.position.y = 32 - lift;
  }
  for (const t of MECH.tappets){
    const st = vs.find(o => o.i === t.i && o.kind === t.kind);
    t.node.position.y = -(st ? st.valveLift : 0);   // 挺柱与气门同步下行，顶面始终贴着凸轮
  }
  if (MECH.chain) updateChain(ca);
  for (const s of sparkState(crankDeg)){
    const el = MECH.sparks[s.i];
    if (el) el.visible = s.on;
  }
}

/* ====== 正时链路径与推进 ====== */
function chainPolyline(c1, c2, r1, r2, n = 26){
  const dy = c2.y - c1.y, dz = c2.z - c1.z, d = Math.hypot(dy, dz);
  const base = Math.atan2(dz, dy);
  const phi = Math.acos(Math.max(-1, Math.min(1, (r1 - r2) / d)));
  const P = (c, r, a) => ({ y: c.y + Math.cos(a) * r, z: c.z + Math.sin(a) * r });
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push(P(c2, r2, base + phi - 2 * phi * (i / n)));   // 凸轮侧外弧
  for (let i = 1; i <= 6; i++){
    const t = i / 6, a = P(c2, r2, base - phi), b = P(c1, r1, base - phi);
    pts.push({ y: a.y + (b.y - a.y) * t, z: a.z + (b.z - a.z) * t });
  }
  for (let i = 0; i <= n; i++) pts.push(P(c1, r1, base - phi - (TAU - 2 * phi) * (i / n)));  // 曲轴侧外弧
  for (let i = 1; i < 6; i++){
    const t = i / 6, a = P(c1, r1, base + phi), b = P(c2, r2, base + phi);
    pts.push({ y: a.y + (b.y - a.y) * t, z: a.z + (b.z - a.z) * t });
  }
  pts.reverse();                                  // 与 +x 正转同向
  return pts;
}
function chainAt(path, s){
  s = ((s % path.total) + path.total) % path.total;
  let i = 0;
  while (i < path.seg.length - 1 && path.cum[i + 1] < s) i++;
  const g = path.seg[i], t = (s - path.cum[i]) / g.len;
  return {
    y: g.a.y + (g.b.y - g.a.y) * t,
    z: g.a.z + (g.b.z - g.a.z) * t,
    rotX: Math.atan2(g.b.y - g.a.y, g.b.z - g.a.z) - Math.PI / 2,
  };
}
function updateChain(crankRad){
  if (!MECH.chain) return;
  const { inst, count } = MECH.chain, path = MECH.chainPath;
  const s0 = sprocketPitchR(D.SPR_N) * crankRad;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  for (let i = 0; i < count; i++){
    const p = chainAt(path, s0 + i * D.CH_PITCH);
    e.set(p.rotX, 0, 0); q.setFromEuler(e);
    m.compose(V(0, p.y, p.z), q, V(1, 1, 1));
    inst.setMatrixAt(i, m);
  }
  inst.instanceMatrix.needsUpdate = true;
}

/* ====== 包围盒工具 ====== */
function moduleCenter(keys){
  const b = new THREE.Box3();
  for (const k of keys) b.union(new THREE.Box3().setFromObject(byKey.get(k).g));
  return b.getCenter(V());
}
function moduleBounds(keys){
  const b = new THREE.Box3();
  for (const k of keys) b.union(new THREE.Box3().setFromObject(byKey.get(k).g));
  return b;
}

/* ==== double-cylinder-engine/logic.mjs ==== */
/* ============================================================================
 * 并列双缸发动机 · 装配与实验逻辑（纯逻辑，无 DOM）
 * 每个动作自己校验前置条件；失败不动业务状态。
 * ==========================================================================*/


/* 模块表与关卡文案的唯一来源是 manifest.mjs */
const MODULES = MANIFEST.modules;
const CHAPTERS = MANIFEST.chapters;
function createGame(){
  const initial = () => ({
    chapter:0, phase:'build', placed:[], selected:null, completed:[false,false,false],
    running:false, chainOff:false, coverOff:false, crankDeg:0, runningSince:0,
  });
  const state = initial();
  const fail = message => ({ ok:false, message });
  const mods = ch => MODULES.filter(m => m.chapter === ch);
  const next = () => state.phase === 'build' ? mods(state.chapter).find(m => !state.placed.includes(m.id)) || null : null;

  function select(id){
    if (state.phase !== 'build') return fail('本章已装配完成，先做实验与挑战。');
    const m = MODULES.find(x => x.id === id);
    if (!m) return fail('没有这块模块，请从下方零件盒选择。');
    if (state.placed.includes(id)) return fail('这块模块已经装好了。');
    if (m.chapter !== state.chapter) return fail('这是后面章节的模块，先把当前这一组装完。');
    state.selected = id;
    return { ok:true, message:m.tip, kind:'select' };
  }
  function place(onTarget = true){
    if (state.phase !== 'build') return fail('本章已装配完成。');
    if (!state.selected) return fail('先从零件盒选一块模块。');
    if (onTarget !== true) return fail('还没对准安装位置：把模块拖到机身缺口上再松手。');
    const want = next();
    if (!want || want.id !== state.selected) return fail('这一步要装「' + (want ? want.name : '当前模块') + '」，顺序按机械依赖来。');
    state.placed.push(state.selected); state.selected = null;
    if (!next()) state.phase = 'experiment';
    return { ok:true, message:want.name + '已归位。', learn:want.learn, kind:'placed' };
  }
  function undo(){
    if (state.phase === 'lab') return fail('已进入自由实验；要重装请点「重新开始」。');
    const last = state.placed.at(-1);
    const m = MODULES.find(x => x.id === last);
    if (!m || m.chapter !== state.chapter) return fail('本章还没有装入的模块。');
    state.placed.pop(); state.phase = 'build'; state.selected = null;
    state.running = false; state.completed[state.chapter] = false;
    return { ok:true, message:'已撤回「' + m.name + '」。', kind:'undo' };
  }
  function experiment(){
    if (state.phase !== 'experiment') return fail('先把本章模块全部装好，再做实验。');
    // 第三关的实验就是"拆掉链条再看"：点按钮必须真的把链条拆下来
    if (state.chapter === 2) state.chainOff = true;
    state.phase = 'quiz'; state.running = true; state.runningSince = 0;
    return { ok:true, message:CHAPTERS[state.chapter].expText, kind:'manual' };
  }
  function answer(i){
    if (state.phase !== 'quiz') return fail('先亲手完成本章实验，再回答问题。');
    const ch = CHAPTERS[state.chapter];
    if (!Number.isInteger(i) || i < 0 || i >= ch.options.length) return fail('请选择一个有效答案。');
    if (i !== ch.a) return { ok:false, message:'再观察一下。' + ch.why, learn:ch.why, kind:'wrong' };
    state.running = false; state.completed[state.chapter] = true; state.phase = 'checkpoint';
    return { ok:true, message:'答对了！获得「' + ch.badge + '」。', learn:ch.why, kind:'correct' };
  }
  function advance(){
    if (state.phase !== 'checkpoint' || !state.completed[state.chapter]) return fail('先完成本章实验与挑战。');
    state.running = false; state.selected = null;
    if (state.chapter < CHAPTERS.length - 1){
      state.chapter++; state.phase = 'build';
      return { ok:true, message:CHAPTERS[state.chapter].subtitle, kind:'chapter' };
    }
    state.phase = 'lab';
    return { ok:true, message:'装配完成。现在可以自由运行、拆掉链条对比、剖开看内部。', kind:'complete' };
  }
  function run(on){
    if (state.phase !== 'lab' && state.phase !== 'quiz') return fail('先用实验按钮开始运转。');
    state.running = on === undefined ? !state.running : !!on;
    return { ok:true, message:state.running ? '曲轴开始转。' : '已停机。', kind:'run' };
  }
  function chain(){
    const inCh3Exp = state.chapter === 2 && (state.phase === 'experiment' || state.phase === 'quiz');
    if (state.phase !== 'lab' && !inCh3Exp) return fail('完成三章挑战后，才能拆链条做对比。');
    state.chainOff = !state.chainOff;
    return { ok:true, message: state.chainOff
      ? '正时链已拆下：再摇曲轴，凸轮轴和气门都不动了。'
      : '正时链已装回，凸轮轴重新跟住曲轴（2:1）。', kind:'chain' };
  }
  function cover(){
    if (state.phase !== 'lab') return fail('完成三章挑战后，才能拆气门室盖。');
    state.coverOff = !state.coverOff;
    return { ok:true, message: state.coverOff ? '气门室盖已取下，可以看到凸轮轴和挺柱。' : '气门室盖已盖回。', kind:'cover' };
  }
  function restart(){
    Object.assign(state, initial());
    return { ok:true, message:'新的装配开始了：先放下曲轴箱。', kind:'restart' };
  }
  // 直接看成品：整机重置后按章重建，保证从任意阶段进入都得到同一个状态
  function demo(){
    Object.assign(state, initial());
    state.placed = MODULES.map(m => m.id);
    state.chapter = 2; state.phase = 'lab'; state.completed = [true,true,true];
    return { ok:true, message:'整机已装好。看它转起来，再拆链条做对照。', kind:'demo' };
  }
  return { state, current:next, select, place, undo, experiment, answer, advance, run, chain, cover, restart, demo };
}

/* ==== double-cylinder-engine/main.mjs ==== */
/* 双缸发动机 · 接线（规则在 logic.mjs，几何在 model.mjs，文案在 manifest.mjs） */
const game = createGame();
const state = game.state;
const CH = MANIFEST.chapters;
const MODS = MANIFEST.modules;
const RAD = Math.PI / 180;
const $ = (s) => document.querySelector(s);

const lab = mountLab(MANIFEST);
const stage = createStage({
  host: document.getElementById('viewport'),
  stageEl: document.getElementById('stage'),
  world: MODEL.world,
  modules: MODS,
  model: MODEL,
  config: MANIFEST.scene,
  getState: () => state,
  nextModule: () => game.current(),
  canDrag: () => state.phase === 'build' && !!state.selected,
  targetAlways: () => {
    const n = game.current();
    return !!n && (n.id === 'case' || n.id === 'crank');
  },
  onDrop: (id, onTarget) => act('place', onTarget),
  onPickKey: (key, again) => {
    if (view.cut) stage.fitCamera(again ? 'engine' : key);
  },
  tick: (dt) => tick(dt),
});
lab.attached3d = true;
const view = stage.view;

/* ---------- 读数 ---------- */
function setRd(key, value) {
  const el = document.querySelector(`[data-rd="${key}"]`);
  if (el && el.textContent !== value) el.textContent = value;
}
function updateReadout() {
  const has = (id) => state.placed.includes(id);
  const c = (((view.crankDeg % 720) + 720) % 720);
  setRd('crank', has('crank') ? c.toFixed(0) + '°' : '—');
  setRd('cam', has('cam') ? ((((view.camDeg % 360) + 360) % 360).toFixed(0) + '°') : '—');
  const pinY = MODEL.pistonPinY(view.crankDeg * RAD);
  setRd('piston', has('piston') ? (pinY - (MODEL.D.ROD - MODEL.D.R)).toFixed(0) + ' / 74 mm' : '—');
  const vs = MODEL.valveState(view.crankDeg, view.camDeg);
  const vi = vs.find((v) => v.i === 0 && v.kind === 'im');
  const ve = vs.find((v) => v.i === 0 && v.kind === 'ex');
  setRd('valve', has('valve') ? vi.valveLift.toFixed(1) + ' / ' + ve.valveLift.toFixed(1) + ' mm' : '—');
  const sp = MODEL.sparkState(view.crankDeg).filter((s) => s.on).map((s) => '缸' + (s.i + 1));
  setRd('spark', has('ignition') ? (sp.length ? sp.join(' ') + ' 跳火' : '—') : '—');
}

/* ---------- 手动摇曲轴 ---------- */
function bindCrankSlider(root) {
  const s = root.querySelector('#crank');
  if (!s) return;
  s.oninput = () => {
    stopTurning();
    view.crankDeg = Number(s.value);
    if (!state.chainOff) view.camDeg = view.crankDeg / 2;
    const out = root.querySelector('#crank-out');
    if (out) out.textContent = s.value + '°';
  };
}
function stopTurning() {
  view.running = false;
  state.running = false;
}

/* ---------- 教练面板（按阶段换内容，比插槽默认面板更细） ---------- */
lab.task(({ chapter: ch, chapterIndex: i, phase }) => {
  const next = game.current();
  const sel = MODS.find((m) => m.id === state.selected);

  if (phase === 'build') {
    return {
      html: `<p class="label">现在要装</p><h3>${next ? next.name : ''}</h3><p>${next ? next.tip : ''}</p>
        <div class="note">${sel ? '已拿起：' + sel.name : '从下方零件盒选择一块模块'}</div>
        <button class="primary action" id="place" ${sel ? '' : 'disabled'}>装入当前模块</button>
        <div class="sub"><button id="hint">给点提示</button>
        <button id="undo" ${MODS.find((m) => m.id === state.placed.at(-1))?.chapter === state.chapter ? '' : 'disabled'}>撤回一步</button></div>`,
      bind(root) {
        root.querySelector('#place').onclick = () => act('place');
        root.querySelector('#hint').onclick = () => {
          view.hintOn = true;
          lab.state.feedback = '蓝色轮廓就是安装位置：把模块拖进轮廓里再松手。';
          lab.state.feedbackKind = '';
          refresh();
        };
        root.querySelector('#undo').onclick = () => act('undo');
      },
    };
  }

  if (phase === 'experiment') {
    const chainBtn =
      state.chapter === 2
        ? `<button class="action" id="exp-chain">${state.chainOff ? '装回正时链' : '拆掉正时链'}</button>
           <p class="note">${state.chainOff ? '链条已拆下：凸轮轴与气门停在原位。' : '链条还在：凸轮轴仍被曲轴带着转（2:1）。'}</p>`
        : '';
    return {
      html: `<p class="label">模块已归位，现在验证</p><h3>${ch.exp}</h3><p>${ch.expText}</p>
        <button class="primary action" id="exp">${ch.exp}</button>${chainBtn}
        <label class="crankctl" for="crank">手动摇曲轴 <output id="crank-out">${Math.round((((view.crankDeg % 720) + 720) % 720))}°</output>
          <input id="crank" type="range" min="0" max="720" step="2" value="${Math.round((((view.crankDeg % 720) + 720) % 720))}"></label>
        <div class="sub"><button id="undo">撤回最后一块</button></div>`,
      bind(root) {
        root.querySelector('#exp').onclick = () => act('experiment');
        root.querySelector('#exp-chain')?.addEventListener('click', () => act('chain'));
        root.querySelector('#undo').onclick = () => act('undo');
        bindCrankSlider(root);
      },
    };
  }

  if (phase === 'quiz') {
    return {
      html: `<p class="label">看一看，想一想</p><h3>${ch.q}</h3>
        <div class="options">${ch.options.map((o, k) => `<button data-a="${k}"><b>${String.fromCharCode(65 + k)}</b>${o}</button>`).join('')}</div>
        <label class="crankctl" for="crank">继续摇曲轴 <output id="crank-out">${Math.round((((view.crankDeg % 720) + 720) % 720))}°</output>
          <input id="crank" type="range" min="0" max="720" step="2" value="${Math.round((((view.crankDeg % 720) + 720) % 720))}"></label>
        <p class="note" style="margin-top:10px">答错也不会清空进度，观察和提示会帮你找到原因。</p>`,
      bind(root) {
        root.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => act('answer', Number(b.dataset.a))));
        bindCrankSlider(root);
      },
    };
  }

  if (phase === 'checkpoint') {
    return {
      html: `<div class="badge" aria-hidden="true">✓</div><p class="label">新徽章</p><h3>${ch.badge}</h3>
        <p>${ch.why}</p>
        <button class="primary action" id="next">${i === CH.length - 1 ? '进入自由实验' : '继续第 ' + (i + 2) + ' 关'}</button>`,
      bind(root) {
        root.querySelector('#next').onclick = () => act('advance');
      },
    };
  }

  // lab：自由实验台
  return {
    html: `<div class="labgrid">
        <button class="primary" id="run">${state.running ? '暂停' : '让它转起来'}</button>
        <button id="chain">${state.chainOff ? '装回正时链' : '拆掉正时链'}</button>
        <button id="cover">${state.coverOff ? '盖回气门室盖' : '取下气门室盖'}</button>
        <button id="focus-all">看整机</button>
        <button id="focus-top">看配气</button>
      </div>
      <label class="speed" for="speed">观察速度 <output id="speed-out">${view.speed.toFixed(2)}×</output>
        <input id="speed" type="range" min="0.25" max="3" step="0.25" value="${view.speed}"></label>
      <label class="crankctl" for="crank">手动摇曲轴 <output id="crank-out">${Math.round((((view.crankDeg % 720) + 720) % 720))}°</output>
        <input id="crank" type="range" min="0" max="720" step="2" value="${Math.round((((view.crankDeg % 720) + 720) % 720))}"></label>
      <div class="flow ${state.running ? 'on' : ''}"><span>曲轴</span><i>›</i><span class="${state.chainOff ? 'off' : ''}">正时链</span><i>›</i><span class="${state.chainOff ? 'off' : ''}">凸轮轴</span><i>›</i><span class="${state.chainOff ? 'off' : ''}">气门</span></div>
      <p class="note">${state.chainOff ? '链条已拆下：曲轴和活塞照动，凸轮轴与气门保持不动。' : '先让它转起来，再拆掉链条做对照。'}</p>
      <div class="earned">${CH.map((c) => `<span>✓ ${c.badge}</span>`).join('')}</div>`,
    bind(root) {
      root.querySelector('#run').onclick = () => act('run');
      root.querySelector('#chain').onclick = () => act('chain');
      root.querySelector('#cover').onclick = () => act('cover');
      root.querySelector('#focus-all').onclick = () => stage.fitCamera('engine');
      root.querySelector('#focus-top').onclick = () => stage.fitCamera('camshaft');
      const sp = root.querySelector('#speed');
      sp.oninput = () => {
        view.speed = Number(sp.value);
        root.querySelector('#speed-out').textContent = view.speed.toFixed(2).replace(/0$/, '') + '×';
      };
      bindCrankSlider(root);
    },
  };
});

/* ---------- 刷新所有显示 ---------- */
const BOX = ['第一盒 · 曲柄连杆机构', '第二盒 · 配气机构', '第三盒 · 正时与点火'];
function refresh() {
  const labPhase = state.phase === 'lab';
  const s = lab.state;
  s.chapter = state.chapter;
  s.phase = state.phase;
  s.placed = state.placed;
  s.selected = state.selected;
  s.completed = state.completed;
  s.badges = state.completed.map((ok, k) => (ok ? CH[k].badge : null)).filter(Boolean);
  s.progress = { done: state.placed.length, total: MODS.length };
  s.cardsLocked = state.phase !== 'build';
  s.visible.readout = state.phase !== 'build' || state.placed.length > 0;
  s.coach = labPhase
    ? { tag: '三个发现，全部解锁', title: '你的发动机，转起来了', intro: '自由实验：换转速、拆链条、剖开看内部。' }
    : null;
  s.trayTitle = labPhase ? '你的装配记录' : BOX[state.chapter];
  s.trayHint = labPhase ? '26 组零件全部到位' : '点选模块，再拖到机身缺口上';
  s.stageHint = labPhase
    ? '运行、拆链条、剖开，验证你刚刚发现的因果。'
    : state.phase === 'build'
    ? '从下方零件盒选一块模块，拖到机身缺口上。'
    : state.phase === 'experiment'
    ? '看谁在动、谁不动，再回答挑战。'
    : '这一段已经装好，去试验你的发现。';
  lab.render();
  document.querySelector('[data-tool="cut"]').setAttribute('aria-pressed', String(view.cut));
}

/* ---------- 动作入口 ---------- */
function act(name, ...args) {
  const beforeChapter = state.chapter;
  const res = game[name](...args);
  lab.state.feedback = res.message || '';
  lab.state.feedbackKind = res.ok ? 'success' : 'error';
  if (res.learn) lab.state.hint = res.learn;
  if (res.ok) {
    if (res.kind === 'select') {
      view.hintOn = false;
      for (const [id, off] of view.offsets) {
        if (!state.placed.includes(id) && id !== state.selected) off.copy(stage.spawn);
      }
    }
    if (['placed', 'restart', 'demo', 'undo'].includes(res.kind)) view.hintOn = false;
    if (res.kind === 'restart' || res.kind === 'demo') {
      view.offsets.clear();
      view.crankDeg = 0;
      view.camDeg = 0;
      view.running = false;
      view.cut = false;
      if (view.drag) view.drag = null;
      stage.controls.enabled = true;
    }
    if (res.kind === 'manual') {
      view.running = true;
      view.crankDeg = 0;
      view.camDeg = 0;
    }
    if (res.kind === 'run') view.running = state.running;
    if (res.kind === 'chain' && !state.chainOff) view.camDeg = view.crankDeg / 2;
    if (res.kind === 'complete' || res.kind === 'demo') view.running = true;
    if (res.kind === 'chapter' && state.chapter !== beforeChapter) stage.fitCamera('engine');
  }
  refresh();
  return res;
}

/* ---------- 循环 ---------- */
function tick(dt) {
  if (view.running) {
    view.crankDeg += dt * 110 * view.speed;
    if (!state.chainOff) view.camDeg = view.crankDeg / 2;
  }
  view.solid = state.phase === 'lab' || state.phase === 'checkpoint';
  updateReadout();
}

/* ---------- 事件 ---------- */
lab.on('select', (id) => act('select', id));
lab.on('place', () => act('place'));
lab.on('undo', () => act('undo'));
lab.on('answer', (i) => act('answer', i));
lab.on('next', () => act('advance'));
lab.on('replay', () => act('restart'));
lab.on('free', () => {
  act('demo');
  stage.fitCamera('engine');
});
lab.on('restart', () => act('restart'));
lab.on('tool', (id) => {
  if (id === 'cut') {
    view.cut = document.querySelector('[data-tool="cut"]').getAttribute('aria-pressed') === 'true';
    if (!view.cut) view.focus = 'all';
  }
  if (id === 'home') stage.fitCamera('engine');
  if (id === 'rotate' || id === 'pan') stage.setNavigation(id);
  refresh();
});

lab.state.feedback = '从下方选中「曲轴箱」，开始第一步。';
lab.state.hint = '选中模块后可以拖到机身上，也可以按「装入当前模块」。位置不对时，已有的进度不会丢。';
refresh();
stage.start();

</script>
</body>
</html>
