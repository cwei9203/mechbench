<!doctype html>
<!-- mechbench · 固定页面骨架。物品不许改这个文件；个性化一律走插槽（kit/slots.md）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>装配实验室</title>
<style>/* mechbench · 固定布局层
 * 只放"所有物品共用"的东西：区域、断点、控件外观、无障碍焦点。
 * 物品自己的视觉微调写在 items/<slug>/lab.css。
 */

:root{
  --ink:#1d2228; --muted:#63707d; --line:#cfd6dc; --stage:#e7ebee; --paper:#f8fafb;
  --accent:#c2452d; --accent-dark:#93301e;
  --steel:#4d5966; --blue:#2f6f9f; --green:#2f7d5c; --gold:#b8862f;
  --topbar-h:70px; --coach-w:344px; --tray-h:182px; --radius:9px;
}

*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:#dfe4e8;color:var(--ink);
  font:14px/1.5 "Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#fff;
  border-radius:var(--radius);padding:8px 13px;font-weight:600;transition:background .14s,transform .1s}
button:hover:not(:disabled){background:#f4f7f9}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid #d99b2b;outline-offset:2px}
button[aria-pressed=true]{background:var(--steel);color:#fff;border-color:var(--steel)}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 0 var(--accent-dark)}
.primary:hover:not(:disabled){background:#b03c26}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- 顶栏 ---------- */
.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:22px;padding:0 24px;
  border-bottom:1px solid var(--line);background:#f7f9fa}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--steel);position:relative;overflow:hidden;flex:none}
.mark svg{display:block;width:100%;height:100%}
.brand strong{display:block;font-size:16px;letter-spacing:-.2px}
.brand small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.journey{list-style:none;display:flex;gap:6px;margin:0 auto;padding:0}
.journey li{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8b98a4;white-space:nowrap}
.journey b{width:23px;height:23px;display:grid;place-items:center;border:1px solid #cbd4dc;border-radius:50%;font-size:11px}
.journey .active{color:var(--accent);font-weight:700}
.journey .active b{background:var(--accent);color:#fff;border-color:var(--accent)}
.journey .done{color:var(--green)}
.journey .done b{background:#e3f1ea;border-color:#a9cdbc}
.topacts{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.topacts .ghost{font-size:11px;padding:6px 10px;border-radius:999px;background:#fff}
.topacts .ghost:hover{border-color:var(--accent);color:var(--accent)}
.topacts .bare{font-size:11px;background:transparent;border-color:transparent;padding:6px}

/* ---------- 主网格 ---------- */
.lab{display:grid;grid-template-columns:minmax(0,1fr) var(--coach-w);
  grid-template-rows:minmax(420px,1fr) var(--tray-h);
  grid-template-areas:"stage coach" "tray coach";
  height:calc(100dvh - var(--topbar-h));min-height:640px}
.stage{grid-area:stage;position:relative;overflow:hidden;min-width:0;background-color:var(--stage);
  background-image:radial-gradient(#c6cfd7 1px,transparent 1px);background-size:24px 24px}
#viewport{position:absolute;inset:0}
#viewport canvas{display:block;touch-action:none}
.stage-title{position:absolute;top:18px;left:22px;pointer-events:none;max-width:360px}
.stage-title h1{font-size:27px;line-height:1.2;margin:0 0 5px;letter-spacing:-.6px;font-weight:800}
.stage-title p{margin:0;font-size:11px;color:var(--muted)}
.toolbar{position:absolute;top:18px;right:16px;display:flex;flex-wrap:wrap;gap:5px;max-width:250px;justify-content:flex-end}
.toolbar button{font-size:10.5px;padding:6px 10px;background:#fffefbe8}
.toolbar button[aria-pressed=true]{background:var(--steel);color:#fff;border-color:var(--steel)}
.socket{position:absolute;z-index:4;transform:translate(-50%,-50%);background:var(--accent);color:#fff;
  border:2px solid #fff;border-radius:20px;box-shadow:0 2px 0 #8f2d1b,0 3px 12px #c2452d30;
  white-space:nowrap;font-size:11px;padding:6px 12px}
.socket.near{background:var(--green);box-shadow:0 0 0 8px #2f7d5c22}
.preview-label{position:absolute;pointer-events:none;transform:translate(-50%,0);background:#fff6ec;
  border:1px solid #e2b393;border-radius:6px;padding:3px 8px;font-size:10px;color:#96562f;white-space:nowrap}
.scene-footer{position:absolute;bottom:12px;left:20px;right:20px;display:flex;align-items:flex-end;
  justify-content:space-between;gap:12px;pointer-events:none}
.scene-footer>span{font-size:9.5px;color:#7d8b98;line-height:1.6;max-width:44%}
.readout{display:none;background:#ffffffef;border:1px solid #ccd6de;border-radius:var(--radius);
  padding:8px 12px;min-width:196px;pointer-events:auto}
.readout.on{display:block}
.readout .row{display:flex;justify-content:space-between;gap:12px;font-size:10.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;line-height:1.75}
.readout .row b{color:var(--ink);font-weight:700}
.readout .big{font-size:12px;color:var(--steel);font-weight:800}
#inset{position:absolute;left:22px;bottom:91px;z-index:5;width:192px;height:188px;border:1px solid #c3ccd5;
  border-radius:12px;overflow:hidden;pointer-events:none;box-shadow:0 4px 16px #1d22281a}
#inset[hidden]{display:none}
#inset .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:10px;
  padding:7px 10px;font-size:10px;color:var(--muted);background:#f5f9ffeb;
  border-bottom:1px solid var(--line)}
#inset .top span:last-child{letter-spacing:.12em;font-size:8.5px}
.discovery{margin-top:12px;border-left:3px solid var(--gold);background:#fdf8ea;border-radius:8px;
  padding:9px 11px;font-size:11px;line-height:1.75;color:#7a5c1e}
.discovery[hidden]{display:none}
.discovery b{display:block;font-size:10.5px;margin-bottom:3px;color:#8a6a1c}
#celebration{position:fixed;inset:0;pointer-events:none;z-index:40;display:grid;place-items:center}
#celebration i{position:absolute;width:9px;height:9px;border-radius:2px;opacity:0;
  animation:confetti 1.1s ease-out forwards}
@keyframes confetti{
  0%{opacity:1;transform:translate(0,0) rotate(0)}
  100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
#fault{position:absolute;inset:34% 12%;z-index:20;background:#fff;padding:18px;border:2px solid #e0b088;
  border-radius:10px;color:#7c4a22;display:none;font-size:13px}

/* ---------- 教练面板 ---------- */
.coach{grid-area:coach;background:var(--paper);border-left:1px solid var(--line);padding:22px 22px 26px;overflow:auto}
.coach .ctag{color:var(--accent);font-weight:700;font-size:11px;margin-bottom:6px}
.coach h2{font-size:21px;line-height:1.28;margin:0 0 8px;letter-spacing:-.4px;font-weight:800}
.coach .intro{font-size:12px;line-height:1.8;color:var(--muted);margin:0 0 16px}
.progress{height:6px;border-radius:6px;background:#e0e7ec;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;background:var(--accent);height:100%;width:0;transition:width .3s}
.plabel{font-size:10px;color:var(--muted);display:flex;justify-content:space-between}
.task{margin-top:18px}
.task .label{font-size:10px;color:var(--muted);margin:0 0 4px}
.task h3{font-size:17px;line-height:1.4;margin:0 0 8px;font-weight:750}
.task p{font-size:12px;line-height:1.8;margin:0 0 10px}
.task .action{width:100%;margin-top:6px}
.sub{display:flex;gap:6px;margin-top:10px}
.sub button{font-size:11px;padding:7px 9px;flex:1}
.feedback{min-height:40px;padding:9px 11px;background:#e9eef3;border-radius:8px;font-size:11px;
  line-height:1.7;margin:16px 0 0;border-left:3px solid #8fa4b8}
.feedback.error{background:#fdf0e8;border-color:#d59a6c;color:#7c4a22}
.feedback.success{background:#e8f3ed;border-color:#77b295;color:#2f6b52}
.hintbox{border-top:1px solid var(--line);padding-top:14px;margin-top:16px;font-size:11px;line-height:1.8;color:var(--muted)}
.hintbox b{display:block;font-size:11px;color:#8a6a1c;margin-bottom:4px}
.options{display:grid;gap:7px;margin-top:12px}
.options button{text-align:left;font-size:12px;font-weight:500;padding:10px 11px;line-height:1.6}
.options button b{display:inline-block;color:var(--accent);margin-right:7px}
.badge{display:grid;place-items:center;width:66px;height:66px;background:var(--gold);color:#fff;
  border:5px solid #e4c98c;border-radius:50%;margin:10px 0;font-size:28px;font-weight:800}
.earned{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.earned span{border:1px solid #ddc98d;background:#fbf5e3;color:#8a6a1c;font-size:9px;padding:3px 6px;border-radius:5px}
.technical{font-size:10px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line);margin-top:18px;padding-top:11px}
.technical summary{cursor:pointer;font-weight:600}
.technical p{margin:8px 0 0}
.note{font-size:10.5px!important;color:var(--muted)}

/* ---------- 实验台控件（experiments 插槽） ---------- */
.labctl{margin-top:12px;font-size:11px}
.labctl output{float:right;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.labctl input[type=range]{width:100%;accent-color:var(--blue);margin:8px 0 0}
.labctl.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.labgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.labgrid .primary{grid-column:1/-1}
.labgrid button{font-size:11px;padding:8px 6px}

/* ---------- 零件盒 ---------- */
.tray{grid-area:tray;border-top:2px solid #c3ccd5;padding:12px 22px 14px;background:#dae1e7;min-width:0;overflow:auto}
.tray-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:12px;font-weight:700;gap:12px}
.tray-head small{font-size:10px;color:#7c8a96;font-weight:400;text-align:right}
.mlist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card{position:relative;border:1px solid #c3ccd5;border-bottom:4px solid #b2bec8;background:#fbfcfd;
  border-radius:10px;display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:6px;
  text-align:left;padding:10px 9px;min-height:74px;--pc:#5b6470}
.card svg{width:34px;height:34px;stroke:var(--pc);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.card strong{font-size:11.5px;display:block;line-height:1.3}
.card small{font-size:9.5px;color:var(--muted);font-weight:400;display:block;margin-top:3px}
.card[aria-pressed=true]{border-color:#d99878;border-bottom-color:var(--accent);background:#fdf1ea;color:var(--ink)}
.card[data-installed=true]{background:#e9f2ec;border-color:#b2cec0;border-bottom-color:#9dbfae}
.card[data-installed=true] small{color:var(--green)}
.empty{font-size:12px;color:#5f7488;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}
.empty strong{display:block;color:#2f4c63;margin-bottom:4px}
.empty .primary{flex:none}

#debug{display:none;position:fixed;left:0;bottom:0;background:#fff;font-size:10px;z-index:30;padding:2px}

/* ---------- 断点 ---------- */
@media(max-width:1180px){
  .lab{grid-template-columns:minmax(0,1fr) 306px}
  .coach{padding:20px 16px}
  .card{grid-template-columns:1fr;text-align:center;padding:9px 6px}
  .card svg{display:none}
  .mlist{gap:6px}
}
@media(max-width:780px){
  .topbar{height:auto;min-height:96px;padding:12px 14px 8px;flex-wrap:wrap;gap:8px}
  .brand{min-width:0;flex:1}
  .brand strong{font-size:13.5px}
  .brand small{font-size:9px}
  .journey{order:3;width:100%;justify-content:space-between;margin:0;gap:2px}
  .journey li{font-size:9.5px;gap:5px;min-width:0}
  .journey b{width:19px;height:19px;font-size:9.5px}
  .tray-head small{max-width:130px;font-size:9px}
  .lab{grid-template-columns:1fr;grid-template-areas:"stage" "tray" "coach";
    grid-template-rows:minmax(360px,56dvh) auto auto;height:auto;min-height:0}
  .stage-title h1{font-size:21px}
  .stage-title{max-width:calc(100% - 172px)}
  .toolbar{top:14px;max-width:150px}
  .mlist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{grid-template-columns:32px minmax(0,1fr);text-align:left;min-height:62px}
  .card svg{display:block;width:28px;height:28px}
  .coach{border-left:0;border-top:1px solid var(--line);padding:20px}
  #inset{left:12px;bottom:12px;width:132px;height:150px}
  .readout{min-width:0;padding:6px 9px}
  .readout .row{font-size:9.5px;gap:8px}
  .scene-footer>span{max-width:150px;font-size:8.5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>/* 比较式投币器：窄屏时标题要让出工具栏；面板文字比通用文案长一点 */
@media (max-width: 1000px) {
  .stage-title { max-width: calc(100% - 230px); }
  .stage-title h1 { font-size: 19px; }
}
@media (max-width: 900px) and (min-width: 781px) {
  .stage-title h1 { font-size: 18px; }
}
@media (max-width: 780px) {
  .stage-title { max-width: calc(100% - 190px); }
  .stage-title h1 { font-size: 18px; line-height: 1.28; text-wrap: balance; }
  .stage-title p { font-size: 10px; }
  .toolbar { max-width: 172px; }
  .toolbar button { font-size: 9.5px; padding: 5px 8px; }
}
@media (max-width: 430px) {
  .stage-title { max-width: calc(100% - 158px); }
  .stage-title h1 { font-size: 16px; letter-spacing: -.3px; text-wrap: balance; }
  .stage-title p { font-size: 9.5px; line-height: 1.55; }
  .toolbar { max-width: 145px; }
  .toolbar button { font-size: 9px; padding: 5px 7px; }
}
</style>

<body>
<header class="topbar">
  <div class="brand">
    <div class="mark" data-slot="brand.mark" aria-hidden="true"></div>
    <div><strong data-slot="brand.title"></strong><small data-slot="brand.subtitle"></small></div>
  </div>
  <ol class="journey" data-slot="journey" aria-label="关卡进度"></ol>
  <div class="topacts">
    <button class="ghost" id="free-lab">自由实验</button>
    <button class="bare" id="restart">重新开始</button>
  </div>
</header>

<main class="lab">
  <section class="stage" id="stage" aria-label="三维装配工作台">
    <div id="viewport"></div>
    <div class="stage-title">
      <h1 data-slot="stage.title"></h1>
      <p data-slot="stage.hint"></p>
    </div>
    <div class="toolbar" data-slot="stage.tools" aria-label="观察工具"></div>
    <button class="socket" id="socket" hidden>装到这里</button>
    <div class="preview-label" id="preview-label" hidden>拖动这块</div>
    <div class="scene-footer">
      <span data-slot="stage.gestures"></span>
      <div class="readout" id="readout" data-slot="stage.readout"></div>
    </div>
    <div id="inset" hidden><div class="top"><span id="inset-title">局部放大</span><span>DETAIL VIEW</span></div></div>
    <div id="fault" role="alert"></div>
  </section>

  <aside class="coach">
    <div class="ctag" data-slot="coach.tag"></div>
    <h2 data-slot="coach.title"></h2>
    <p class="intro" data-slot="coach.intro"></p>
    <div class="progress" role="progressbar" aria-label="装配进度" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" id="progress"><i id="pfill"></i></div>
    <div class="plabel"><span id="plabel"></span><span id="bcount"></span></div>
    <div class="task" id="task"></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="discovery" id="discovery" hidden><b>刚刚发现</b><span id="discovery-text"></span></div>
    <div class="hintbox"><b data-slot="coach.hintLabel"></b><span id="hinttext"></span></div>
    <div data-slot="coach.extras"></div>
    <details class="technical" id="notes">
      <summary data-slot="coach.notesLabel"></summary>
      <div data-slot="coach.notes"></div>
    </details>
  </aside>

  <section class="tray" aria-label="零件盒">
    <div class="tray-head"><span id="tray-title"></span><small id="tray-hint"></small></div>
    <div class="mlist" id="mlist"></div>
  </section>
</main>
<script>window.__mechbench={slug:'coin-comparator-lab',built:true}</script>

<div id="celebration" aria-hidden="true"></div>
<pre id="debug"></pre>

<script>
window.addEventListener('error', e => {
  const el = document.getElementById('fault');
  el.style.display = 'block';
  el.textContent = '工作台未能加载：' + e.message;
});
</script>

import * as THREE from 'three';

/* ==== kit/icons.mjs ==== */
/* mechbench · 通用零件图标（24×24，描边）
 * 物品在 manifest 里写 icon:'gear' 即可；要自定义就写 icon:'<path d="..."/>' 原样 SVG。
 */
const ICONS = {
  box:'<rect x="4" y="8" width="16" height="11" rx="1.5"/><path d="M4 12h16M9 8V5h6v3"/>',
  shell:'<path d="M4 9l8-4 8 4v7l-8 4-8-4z"/><path d="M4 9l8 4 8-4M12 13v7"/>',
  shaft:'<path d="M3 12h18"/><path d="M6 9v6M18 9v6"/>',
  gear:'<circle cx="12" cy="12" r="5"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.5 6.5l2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2"/>',
  spring:'<path d="M8 4h8M8 20h8"/><path d="M8 6l8 3-8 3 8 3-8 3"/>',
  screw:'<path d="M9 4h6l-1 3H10z"/><path d="M10 7v10l2 3 2-3V7"/><path d="M10 11h4M10 14h4"/>',
  plate:'<path d="M4 14l8-4 8 4-8 4z"/><path d="M7 13l3 1.5"/>',
  disc:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/>',
  piston:'<path d="M7 5h10v7H7z"/><path d="M10 12v6M14 12v6"/><path d="M7 8h10"/>',
  valve:'<path d="M12 4v9"/><path d="M8 16h8l-4 4z"/><path d="M9 4h6"/>',
  coil:'<circle cx="12" cy="12" r="6"/><path d="M12 6v12M9 6.8v10.4M15 6.8v10.4"/>',
  battery:'<rect x="3" y="8" width="15" height="8" rx="1.5"/><path d="M21 11v2"/><path d="M7 10v4M11 10v4"/>',
  bolt:'<path d="M12 4l5 3v6l-5 3-5-3V7z"/><circle cx="12" cy="10" r="2"/>',
  lever:'<path d="M4 18h16"/><path d="M8 18l6-10"/><circle cx="15" cy="7" r="2"/>',
  housing:'<rect x="4" y="6" width="16" height="13" rx="2"/><path d="M8 6V4h8v2M4 12h16"/>',
  pin:'<path d="M5 12h14"/><path d="M8 9v6M16 9v6"/><circle cx="8" cy="12" r="1"/><circle cx="16" cy="12" r="1"/>',
};
function iconSvg(name, color) {
  const body = ICONS[name] || ICONS.box;
  return `<svg viewBox="0 0 24 24" aria-hidden="true"${color ? ` style="--pc:${color}"` : ''}>${body}</svg>`;
}

/* ==== kit/lab.mjs ==== */
/* mechbench · 布局渲染层
 * 把 manifest 的插槽填进固定骨架，并把玩家操作转成事件。
 * 不做三维（kit/scene.mjs）、不做业务规则（物品的 logic.mjs / main.mjs）。
 */

const COPY = {
  brand: { title: '装配实验室', subtitle: '', mark: { a: '#c2452d', b: '#9aa6b2' } },
  stage: {
    title: '装一台能动的机器',
    hint: '从下方零件盒选一块模块，拖到机身高亮处。',

const q = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function pick(base, over) {

function mountLab(item) {

  const modules = item.modules || [];
  const tasks = item.tasks || [];

      trayHint: '',

        bit.style.background = colors[i % 4];

      }

    const list = q('#mlist');

    }

      .map((m) => {
        const installed = lab.state.placed.includes(m.id);
        const sub = installed
          ? copy.labels.installed
          : m.sub || (m.parts?.length > 1 ? copy.labels.preloaded.replace('{n}', m.parts.length) : copy.labels.picked);

  function renderTask() {
    const ch = chapters[lab.state.chapter] || {};

      const out = lab.taskRenderer({ chapter: ch, chapterIndex: lab.state.chapter, phase: lab.state.phase, state: lab.state, lab }) || {};
      q('#task').innerHTML = out.html || '';
      out.bind?.(q('#task'));

    }
    const task = tasks[lab.state.chapter] || {};
    const s = lab.state;
    const head = `<p class="label">${esc(copy.labels.exp)}</p><h3>${esc(task.exp || ch.title || '')}</h3>
      <p>${esc(task.expText || ch.subtitle || '')}</p>`;
    if (s.phase === 'check' && task.options) {
      q('#task').innerHTML =
        head +
        `<p class="label">${esc(copy.labels.quiz)}</p><div class="options">${task.options
          .map((o, i) => `<button data-opt="${i}"><b>${'ABCD'[i]}</b>${esc(o)}</button>`)

    }

      q('#task').innerHTML =
        head +
        `<div class="badge">${esc(ch.badge || '✓')}</div><p>${esc(task.why || '')}</p>
         <div class="sub">${

    const s = lab.state;

    }
    const ch = chapters[s.chapter] || {};
    const co = s.coach || {};
    q('[data-slot="coach.tag"]').textContent =
      co.tag ?? (copy.coach.tag || '').replace('{n}', s.chapter + 1).replace('{total}', chapters.length);
    q('[data-slot="coach.title"]').textContent = co.title ?? ch.title ?? '';
    q('[data-slot="coach.intro"]').textContent = co.intro ?? ch.subtitle ?? '';

    q('#tray-title').textContent = s.trayTitle || item.tray?.title || copy.tray.title;
    q('#tray-hint').textContent = s.trayHint || item.tray?.hint || copy.tray.hint;

    renderTask();
    renderCards();

    const fb = q('#feedback');
    fb.className = 'feedback' + (s.feedbackKind ? ' ' + s.feedbackKind : '');
    if (s.feedback) fb.textContent = s.feedback;
    q('#hinttext').textContent = s.hint || '';

    const ro = q('#readout');
    ro.classList.toggle('on', !!s.visible.readout);
    for (const b of ro.querySelectorAll('[data-rd]')) {
      const v = s.readout[b.dataset.rd];
      if (v != null && b.textContent !== String(v)) b.textContent = v;
    }
    // 有三维时 socket 的显隐与位置由 kit/scene.mjs 负责
    if (!lab.attached3d) q('#socket').hidden = !(s.selected && s.phase === 'build');

  /* ---------- 交互：只发事件 ---------- */
  document.addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (card && !card.disabled) return lab.emit('select', card.dataset.id);
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act) return lab.emit(act);
    const tool = e.target.closest('[data-tool]')?.dataset.tool;
    if (tool) {
      if (tool === 'cut') {

        b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
      }

    }
    if (e.target.id === 'free-lab') return lab.emit('free');
    if (e.target.id === 'restart') return lab.emit('restart');
    if (e.target.id === 'socket') return lab.emit('place');
    const opt = e.target.closest('[data-opt]');
    if (opt) return lab.emit('answer', Number(opt.dataset.opt));
    const exp = e.target.closest('[data-exp]');
    if (exp) {
      const id = exp.dataset.exp;
      const spec = (item.experiments || []).find((x) => x.id === id) || {};
      const value =
        exp.tagName === 'BUTTON'
          ? spec.control === 'toggle'
            ? exp.getAttribute('aria-pressed') !== 'true'

          : Number(exp.value);

    const id = e.target.dataset?.exp;

    const out = document.querySelector(`[data-exp-out="${id}"]`);
    const exp = (item.experiments || []).find((x) => x.id === id);
    if (out) out.textContent = e.target.value + (exp?.unit || '');

}

function iconBody(name) {

}

/* mechbench · 三维舞台（kit）

const vec = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

const DEFAULT = {

  orbit: { minDistance: 190, maxDistance: 1800, minPolar: 0.06, maxPolar: 0.54 },
  bench: { y: -110, color: 0xdfe5ea, size: 4000 },
  env: 0.48,
  lights: {
    hemi: [0xffffff, 0x9aa7b3, 0.62],
    key: { color: 0xfff6ec, intensity: 2.0, pos: [-190, 300, 240] },
    fill: { color: 0xdce8f4, intensity: 0.85, pos: [280, 90, 240] },
    rim: { color: 0xcfe0f0, intensity: 0.8, pos: [160, 200, -300] },

  cut: { normal: [0, 0, -1], constant: 0 },
  ghost: { color: 0x9aa4ad, opacity: 0.62 },

function merge(base, over) {

  const MODEL_CENTER = box.getCenter(vec());
  const MODEL_SIZE = box.getSize(vec());

  function focusSpec(name) {
    const f = cfg.focus[name] || {};

    if (f.box) {
      const b = typeof f.box === 'function' ? f.box(state(), view) : f.box;
      return { center: vec(...b[0]), size: vec(...b[1]), dir, fit: f.fit || 1 };
    }
    if (name === cfg.camera.defaultFocus || !name) return { center: MODEL_CENTER.clone(), size: MODEL_SIZE.clone(), dir, fit: f.fit || 1.1 };
    const p = byKey.get(name);
    if (!p) return { center: MODEL_CENTER.clone(), size: MODEL_SIZE.clone(), dir, fit: f.fit || 1.1 };
    const b = new THREE.Box3().setFromObject(p.g);
    const size = b.getSize(vec());
    size.set(Math.max(size.x, 30), Math.max(size.y, 30), Math.max(size.z, 30));

    const narrow = stageEl.clientWidth < 620;
    const usableW = stageEl.clientWidth - (narrow ? 40 : 90);
    const usableH = stageEl.clientHeight - (narrow ? 150 : 40);
    const dist =
      Math.max(
        (size.y / (2 * f)) * (stageEl.clientHeight / usableH),
        (size.x / (2 * f * camera.aspect)) * (stageEl.clientWidth / usableW)

      socketEl.hidden = !showSocket;
      if (showSocket) {
        const md = info.get(next.id);
        const p = project(vec(md.center.x, md.bounds.max.y + 16, md.center.z));
        socketEl.style.left = p.x + 'px';
        socketEl.style.top = p.y + 'px';

        socketEl.classList.toggle('near', !!s.selected && nearTarget(s.selected));

    }
    const sel = s.selected && info.get(s.selected);
    if (previewEl) {
      previewEl.hidden = !sel || s.phase !== 'build';
      if (sel) {
        const c = sel.center.clone().add(view.offsets.get(sel.id) || vec());

  const insetCam = new THREE.PerspectiveCamera(cfg.inset?.fov || 36, 1, cfg.inset?.near || 0.1, cfg.inset?.far || 500);
  function drawInset() {
    if (!insetEl || !cfg.inset) return;
    const s = state();
    const ic = cfg.inset;
    const fits = stageEl.clientWidth > (ic.minWidth || 760) && stageEl.clientHeight > (ic.minHeight || 430);
    const spec = fits && ic.visible?.(s, view) ? ic.target?.(s, view) : null;
    const part = spec && byKey.get(spec.part);

    const title = insetEl.querySelector('#inset-title');

    renderer.setViewport(x, y, r.width, r.height);

    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, stageEl.clientWidth, stageEl.clientHeight);
  }

  /* ---------- 像素探针：给验收用，肉眼看不到的"空"要能被机器测出来 ---------- */
  // 必须在渲染循环里紧接着 render() 读，否则默认帧缓冲内容已经丢弃（读到全 0）
  const pendingProbes = [];
  function probe(rect) {
    return new Promise((res) => pendingProbes.push({ rect, res }));

  function runProbes() {
    if (!pendingProbes.length) return;
    const gl = renderer.getContext();

    const H = renderer.domElement.height;
    for (const { rect, res } of pendingProbes.splice(0)) {
      const x = Math.max(0, Math.round(rect.x * pr));
      const y = Math.max(0, Math.round(H - (rect.y + rect.height) * pr));
      const w = Math.max(1, Math.round(rect.width * pr));
      const h = Math.max(1, Math.round(rect.height * pr));
      const buf = new Uint8Array(w * h * 4);
      gl.readPixels(x, y, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      const colors = new Set();
      const rows = new Array(h).fill(0);
      const cols = new Array(w).fill(0);
      let lit = 0;
      for (let j = 0; j < h; j++) {
        for (let i = 0; i < w; i++) {

      res({ colors: colors.size, lit, rows, cols, w, h });
    }
  }

  /* ---------- 尺寸与循环 ---------- */
  function resize() {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    if (!userNavigated) fitCamera(view.focus);
  }
  new ResizeObserver(resize).observe(stageEl);

  function start() {
    let prev = performance.now();
    renderer.setAnimationLoop((now) => {
      const dt = Math.min(0.05, Math.max(0, (now - prev) / 1000));
      prev = now;
      opts.tick?.(dt);
      render(dt);
      controls.update();
      overlay();
      renderer.render(scene, camera);
      drawInset();
      runProbes();
    });
  }

  resize();
  render(1);
  fitCamera(view.focus);

  return {
    view, renderer, scene, camera, controls, info, spawn: SPAWN, fitCamera, setNavigation, project,
    nearTarget, overlay, render, start, setTarget, resize, probe,
    get solidScreen() {
      return renderer.domElement;
    },
  };
}

function nearestU(curve, x, y) {
  let best = 0, bd = 1e9;
  for (let i = 0; i <= 600; i++) {
    const p = curve.getPointAt(i / 600);
    const d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d < bd) { bd = d; best = i / 600; }
  }
  return best;
}

}

function coinGroup(spec, z = 0) {
  const g = group();
  const r = spec.d / 2;
  const mat = spec.mat === 'brass' ? M.brassCoin : spec.mat === 'steel' ? M.steelCoin : M.nickel;
  if (spec.hole) {
    const shape = new THREE.Shape(); shape.absarc(0, 0, r, 0, TAU, false);
    const hole = new THREE.Path(); hole.absarc(0, 0, spec.hole / 2, 0, TAU, true); shape.holes.push(hole);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: spec.t, bevelEnabled: false, curveSegments: 40 });
    geo.translate(0, 0, -spec.t / 2 + z);
    mesh(geo, mat, g);
    for (const s of [-1, 1]) {
      torusZ(r - .45, .32, M.steel, g, V(0, 0, z + s * spec.t / 2));
      torusZ(spec.hole / 2 + .35, .3, M.steel, g, V(0, 0, z + s * spec.t / 2));
    }
  } else {
    cylZ(r, spec.t, mat, g, V(0, 0, z), 44);
    for (const s of [-1, 1]) { const t = torusZ(r - .55, .28, mat, g, V(0, 0, z + s * spec.t / 2)); }
  }
  if (!spec.hole) {
  const star = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .17 : r * .38;
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    i ? star.lineTo(x, y) : star.moveTo(x, y);
  }
  star.closePath();
  const sg = new THREE.ExtrudeGeometry(star, { depth: .35, bevelEnabled: false, curveSegments: 8 });
  sg.translate(0, 0, z + spec.t / 2);
  mesh(sg, mat, g);
  printLabel(spec.label, r * .8, r * .8, g, V(0, 0, z + spec.t / 2 + .42), 0, '#2a2620');
  }
  return g;
}

for (const k of Object.keys(COINS)) {
  const c = coinGroup(COINS[k], 0);
  c.visible = false; c.name = 'coin-' + k;
  coinsGroup.add(c); coinMeshes[k] = c;
}
const returnCurve = new THREE.CatmullRomCurve3([V(-34, 78, 18), V(-30, 30, 22), V(-24, -40, 24), V(-18, -95, 20)]);

/* ---------- 运动状态 ---------- */
const MECH = {
  now: 0, gate: 0, lastCount: 0, countAge: 9,
};
const ease = (t) => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };
function poseCoin(state) {
  const c = state.coin;
  for (const k of Object.keys(coinMeshes)) coinMeshes[k].visible = false;
  if (!c) return;
  const meshC = coinMeshes[c.kind]; if (!meshC) return;
  meshC.visible = true;
  const spec = COINS[c.kind] || COINS.yuan;
  const rad = REF_R - spec.d / 2;
  let pos = null, rotZ = 0, rotY = 0;
  const shift = (curve, u) => {
    const p = curve.getPointAt(Math.min(1, Math.max(0, u)));
    p.y -= rad;
    return p;
  };
  if (c.stage === 'returning') {
    const u = Math.min(1, Math.max(0, c.t / GATE_T));
    pos = shift(mainCurve, u);
    rotZ = -u * L_MAIN / (spec.d / 2);
    if (c.t < .05) rotY = Math.PI / 2 * (1 - c.t / .05);
  } else if (c.stage === 'returned' || c.stage === 'done-returned') {
    const u = Math.min(1, (c.rt || 0) / .55);
    pos = returnCurve.getPointAt(ease(u));
    rotZ = -3.2 * u; rotY = Math.PI / 2;
  } else if (c.stage === 'blocked') {
    pos = shift(mainCurve, Math.max(0, c.t / GATE_T));
    rotZ = -(c.t * 260) / (spec.d / 2);
  } else {
    const t = c.t;
    if (t < .05) {
      const u = t / .05;
      pos = mainCurve.getPointAt(0);
      pos.z = 18 - 26.4 * ease(u);
      rotY = Math.PI / 2 * (1 - ease(u));
      rotZ = -u * 9 / (spec.d / 2);
    } else if (t <= GATE_T) {
      pos = shift(mainCurve, t / GATE_T);
      rotZ = -(t * 190) / (spec.d / 2);
    } else {
      const branch = (c.stage === 'accepted' || c.stage === 'done-accepted') ? acceptCurve : rejectCurve;
      const u = Math.min(1, (t - GATE_T) / (1 - GATE_T));
      pos = shift(branch, u);
      rotZ = -(GATE_T * 190 + (t - GATE_T) * 170) / (spec.d / 2);
    }
  }
  if (pos) meshC.position.copy(pos);
  meshC.rotation.set(0, rotY, rotZ);
}

function applyMotion(view, state) {
  MECH.gate = state.gate || 0;
  MECH.now = MECH.now || 0;
  // 样币切换
  if (PIV.sampleYuan) PIV.sampleYuan.visible = state.sample !== 'token';
  if (PIV.sampleToken) PIV.sampleToken.visible = state.sample === 'token';
  // 活门角度：0 退币位（弹簧），-0.95 接受位（电磁铁）
  const th = -0.95 * MECH.gate;
  if (PIV.gate) PIV.gate.rotation.z = th;
  if (PIV.gateSpring) {
    const tail = V(GATE_PIVOT.x + 14 * Math.cos(th) - 6 * Math.sin(th),
                   GATE_PIVOT.y + 14 * Math.sin(th) + 6 * Math.cos(th), COIN_Z);
    placeSpring(PIV.gateSpring, V(56, -12, COIN_Z), tail);
  }
  if (PIV.solRod) {
    const tailY = GATE_PIVOT.y + 14 * Math.sin(th) + 6 * Math.cos(th);
    PIV.solRod.position.y = tailY - 9;
    PIV.solRod.position.x = GATE_PIVOT.x + 14 * Math.cos(th) - 6 * Math.sin(th);
  }
  // 退币按钮与推杆
  const rb = state.returnBtn || 0;
  if (PIV.retBtn) PIV.retBtn.position.z = 14 - 4.2 * rb;
  if (PIV.kick) PIV.kick.rotation.z = -.95 * rb;
  // 灵敏度旋钮
  if (PIV.knob) PIV.knob.rotation.z = -1.5 * (state.sensitivity ?? 6) / 10;
  // 表头
  if (PIV.needle) {
    let ang = -1.05;
    if (state.verdict && state.verdict !== 'off' && Number.isFinite(state.diff) && state.threshold) {
      ang = -1.05 + 2.0 * Math.min(1.25, state.diff / state.threshold);
    }
    PIV.needle.rotation.z = ang;
  }
  // LED 与测试线圈微亮
  for (const key of ['led', 'coverLed']) {
    const L = PIV[key];
    if (!L) continue;
    const on = !!state.power && !!state.placed?.includes('board');
    const pass = state.verdict === 'pass';
    L.material.color.setHex(on ? (pass ? 0x66d18f : 0xd4553d) : 0x2a2d31);
    L.material.emissive.setHex(on ? (pass ? 0x2f9a5e : 0x8e2a1c) : 0x000000);
    L.material.emissiveIntensity = on ? 1.4 : 0;
  }
  if (PIV.testCoil) {
    const near = state.coin && Math.abs((state.coin.t || 0) - STATIONS.coil) < .085;
    PIV.testCoil.scale.setScalar(near ? 1.06 : 1);
  }
  // 计数表：接受数驱动拨盘；到位后拨爪落一下
  const ac = state.acceptCount || 0;
  if (ac !== MECH.lastCount) { MECH.lastCount = ac; MECH.countAge = 0; }
  MECH.countAge += 1 / 60;
  if (PIV.unitDial) PIV.unitDial.rotation.z = -ac * TAU / 10;
  if (PIV.tensDial) PIV.tensDial.rotation.z = -Math.floor(ac / 10) * TAU / 10;
  if (PIV.pawl) PIV.pawl.rotation.z = -.35 - .35 * Math.max(0, 1 - MECH.countAge / .35);
  // 硬币
  poseCoin(state);
}

/* ==== coin-comparator-lab/logic.mjs ==== */
/* 比较式投币器 · 装配与实验逻辑（纯逻辑，无 DOM、无三维）
 * 规则：先校验，再改状态；失败不动已装件与正在走的币。
 * 比较公式：直径差×14 + 厚度差×20 + 材质差；门限 = 100 − 灵敏度×9。
 */
const MODULES = MANIFEST.modules;
const CHAPTERS = MANIFEST.chapters;
const ST = MODEL.STATIONS;
const MAT_DIFF = { nickel: 0, brass: 52, steel: 38 };
const GATE_CLEAR = MODEL.GATE_MAX_T - .05;
const BLOCK_STOP = ST.stop;   // 厚币停在门前的币边处，不穿进夹板
const COIN_KEYS = Object.keys(MODEL.COINS);
function createGame() {
  const initial = () => ({
    chapter: 0, phase: 'build', placed: [], selected: null,
    completed: [false, false, false],
    sample: 'yuan', sensitivity: 6, power: true,
    coin: null, verdict: null, diff: null, threshold: 46,
    gate: 0, returnBtn: 0,
    acceptCount: 0, rejectCount: 0, returnCount: 0,
    expStep: 0, slow: false, lastResult: '',
  });
  const state = initial();
  const fail = (message) => ({ ok: false, message });
  const mod = (id) => MODULES.find((m) => m.id === id);
  const has = (id) => state.placed.includes(id);
  const doneCoin = () => !state.coin || String(state.coin.stage).startsWith('done-');
  const thresholdOf = (s = state.sensitivity) => 100 - s * 9;
  const resetCoin = () => {
    state.coin = null; state.verdict = null; state.diff = null;
    state.threshold = thresholdOf(); state.gate = 0; state.returnBtn = 0;
  };

  function current() {
    if (state.phase !== 'build') return null;
    return MODULES.find((m) => m.chapter === state.chapter && !state.placed.includes(m.id)) || null;
  }
  function select(id) {
    if (state.phase !== 'build') return fail(state.phase === 'lab' ? '自由实验室里不搞装配，想重拼请点「重新开始」。' : '先完成本章实验与挑战，再继续装配。');
    const m = mod(id);
    if (!m) return fail('没有这块模块，请从零件盒选择。');
    if (state.placed.includes(id)) return fail(m.name + '已经装好了。');
    if (m.chapter !== state.chapter) return fail('这一步还轮不到' + m.name + '——先完成当前模块。');
    state.selected = id;
    return { ok: true, message: m.tip };
  }
  function place(onTarget = true) {
    if (state.phase !== 'build') return fail('本章装配已完成，请进行实验与挑战。');
    if (!state.selected) return fail('先从零件盒选一块模块。');
    if (onTarget !== true) return fail('还没对准装配位置——拖到蓝色轮廓里再松手，或按「装到这里」。');
    const m = current();
    if (!m) return fail('本章已经装完了。');
    if (state.selected !== m.id) return fail('这一步需要「' + m.name + '」，顺序不能乱。');
    state.placed.push(m.id); state.selected = null;
    if (!MODULES.some((x) => x.chapter === state.chapter && !state.placed.includes(x.id))) state.phase = 'experiment';
    return { ok: true, message: m.name + '已归位。', learn: m.learn, kind: 'placed' };
  }
  function undo() {
    if (state.phase === 'lab') return fail('自由实验室不撤回；想重拼请点「重新开始」。');
    const last = state.placed.at(-1), m = mod(last);
    if (!m || m.chapter !== state.chapter) return fail('本章还没有可撤回的模块。');
    state.placed.pop(); state.phase = 'build'; state.selected = null;
    state.completed[state.chapter] = false; state.expStep = 0;
    resetCoin();
    return { ok: true, message: '已撤回' + m.name + '，可以重新装配。', kind: 'undo' };
  }
  function experiment() {
    if (state.phase !== 'experiment') return fail('先把本章模块全部装好，再进行实验。');
    state.phase = 'quiz'; state.expStep = 0;
    return { ok: true, message: CHAPTERS[state.chapter].expText, kind: 'experiment' };
  }
  function answer(i) {
    if (state.phase !== 'quiz') return fail('先亲手完成本章实验，再回答问题。');
    const c = CHAPTERS[state.chapter];
    if (!Number.isInteger(i) || i < 0 || i >= c.options.length) return fail('请选择一个有效答案。');
    if (i !== c.a) return { ok: false, message: '再观察一下。' + c.why, kind: 'wrong' };
    state.completed[state.chapter] = true; state.phase = 'checkpoint';
    return { ok: true, message: '答对了！获得「' + c.badge + '」。', kind: 'correct' };
  }
  function next() {
    if (state.phase !== 'checkpoint' || !state.completed[state.chapter]) return fail('先完成本章实验与挑战。');
    if (state.chapter < CHAPTERS.length - 1) {
      state.chapter++; state.phase = 'build'; state.expStep = 0;
      state.sample = 'yuan'; state.sensitivity = 6; state.power = true;
      resetCoin();
      return { ok: true, message: CHAPTERS[state.chapter].subtitle, kind: 'chapter' };
    }
    state.phase = 'lab';
    return { ok: true, message: '装配完成！进入自由实验室：投任意币、换样币、调灵敏度、断电试 fail-safe。', kind: 'complete' };
  }

  /* ---------- 投币与比较 ---------- */
  function compare(kind) {
    const cs = MODEL.COINS[kind];
    const ss = MODEL.SAMPLES[state.sample] || MODEL.SAMPLES.yuan;
    if (!state.power) return { verdict: 'off', diff: null, threshold: thresholdOf() };
    if (!has('sample') || !has('coil') || !has('board')) return { verdict: 'none', diff: null, threshold: thresholdOf() };
    const dd = Math.abs(cs.d - ss.d);
    const dt = Math.abs(cs.t - ss.t);
    const dm = Math.abs((MAT_DIFF[cs.mat] || 0) - (MAT_DIFF[ss.mat] || 0));
    const diff = Math.round((dd * 14 + dt * 20 + dm) * 10) / 10;
    const threshold = thresholdOf();
    return { verdict: diff <= threshold ? 'pass' : 'fail', diff, threshold };
  }
  function insert(kind) {
    if (state.phase !== 'experiment' && state.phase !== 'lab') return fail('先完成本章装配，再投币。');
    if (!COIN_KEYS.includes(kind)) return fail('没有这种币。');
    if (!has('entry') || !has('runway') || !has('cashbox')) return fail('币道还没装完整，先装入口、币道和接币盒。');
    if (state.coin && !doneCoin()) return fail('上一枚币还没走完——先等它落定，或按「退币」把它退回来。');
    const chapterKinds = state.phase === 'experiment'
      ? (state.chapter === 0 ? ['yuan', 'washer'] : state.chapter === 1 ? ['yuan', 'token', 'jiao', 'fake'] : ['yuan', 'jiao'])
      : COIN_KEYS;
    if (!chapterKinds.includes(kind)) return fail('本关先测试这几种币：' + chapterKinds.map((k) => MODEL.COINS[k].name).join(' / ') + '。');
    state.coin = { kind, stage: 'rolling', t: 0, rt: 0, blockChecked: false };
    state.verdict = null; state.diff = null; state.threshold = thresholdOf();
    state.lastResult = '';
    return { ok: true, message: MODEL.COINS[kind].name + '已投进币道。', kind: 'insert' };
  }
  function pressReturn() {
    if (state.phase !== 'experiment' && state.phase !== 'lab') return fail('完成装配后再操作退币按钮。');
    if (state.coin && !doneCoin() && !['rolling', 'blocked'].includes(state.coin.stage)) {
      return { ok: false, message: '币已经过分选口或正在退回，请等它落定。', kind: 'return-late' };
    }
    state.returnBtn = 1;
    if (!state.coin || String(state.coin.stage).startsWith('done-')) {
      return { ok: true, message: '推杆空走一下：币道里没有可退的币。', kind: 'return-idle' };
    }
    const st = state.coin.stage;
    if (st === 'rolling' || st === 'blocked') {
      state.coin.stage = 'returning';
      state.verdict = null; state.diff = null; state.threshold = thresholdOf(); state.gate = 0;
      if (state.phase === 'experiment' && state.chapter === 0) state.expStep = Math.max(state.expStep, 2);
      return { ok: true, message: '退币按钮经推杆把币从币道推回入口，币掉进退币杯。', kind: 'return' };
    }
    return { ok: false, message: '币已经过分选口，退币推杆够不到它——这一枚只能算接受或拒绝。', kind: 'return-late' };
  }
  function setSensitivity(v) {
    if (state.phase !== 'experiment' && state.phase !== 'lab') return fail('完成装配后再调灵敏度。');
    if (!has('board')) return fail('先装上比较器板和灵敏度旋钮。');
    if (!doneCoin()) return fail('币还在币道里，等它落定再调灵敏度。');
    const value = Number(v);
    if (!Number.isFinite(value)) return fail('灵敏度必须是有效数值。');
    const n = Math.max(0, Math.min(10, Math.round(value)));
    state.sensitivity = n; state.threshold = thresholdOf(n);
    state.verdict = null; state.diff = null;
    if (state.phase === 'experiment' && state.chapter === 1) state.expStep = Math.max(state.expStep, 3);
    return { ok: true, message: `灵敏度 ${n}/10：比较门限 ${state.threshold}。越松越容易接受，也越容易被铜章蒙混。`, kind: 'sensitivity' };
  }
  function setSample(kind) {
    if (state.phase !== 'experiment' && state.phase !== 'lab') return fail('完成装配后再换样币。');
    if (!has('sample')) return fail('先装上样币座和样币。');
    if (state.coin && !doneCoin()) return fail('币还在币道里，等它落定再换样币。');
    if (!MODEL.SAMPLES[kind]) return fail('样币座里只有 1 元和游戏币两种样币。');
    state.sample = kind;
    state.verdict = null; state.diff = null; state.threshold = thresholdOf();
    return { ok: true, message: `样币已换成${MODEL.SAMPLES[kind].name}：参考线圈里的基准信号也跟着换了。`, kind: 'sample' };
  }
  function setPower(on = true) {
    if (state.phase !== 'experiment' && state.phase !== 'lab') return fail('完成装配后再操作电源。');
    if (!has('board')) return fail('先装上比较器板。');
    state.power = !!on;
    if (!state.power) {
      if (state.coin && !doneCoin()) state.verdict = 'off';
      state.diff = null;
    } else if (state.verdict === 'off') {
      state.verdict = null; state.diff = null;
    }
    return { ok: true, message: state.power ? '电源接通：比较器工作，电磁铁待命。' : '电源断开：比较器停摆，活门被弹簧按在退币位——fail-safe。', kind: 'power' };
  }
  function toggleSlow() {
    state.slow = !state.slow;
    return { ok: true, message: state.slow ? '慢放 ×0.3：看清币经过线圈、活门换位。' : '恢复常速。', kind: 'slow' };
  }

  /* ---------- 每帧推进（只由 state 驱动；几何在 model.mjs 落位） ---------- */
  function advance(dt) {
    const k = Math.max(0, Math.min(.25, dt || 0));
    state.returnBtn = Math.max(0, state.returnBtn - k * 5);
    const wantGate = (state.verdict === 'pass' && state.power && has('gate') && has('solenoid')
      && state.coin && !String(state.coin.stage).startsWith('done-')) ? 1 : 0;
    state.gate += (wantGate - state.gate) * Math.min(1, k * 20);
    if (Math.abs(state.gate - wantGate) < .003) state.gate = wantGate;
    const c = state.coin;
    if (!c) return;
    const sp = state.slow ? .3 : 1;
    if (c.stage === 'rolling') {
      c.t += k * .55 * sp;
      if (!c.blockChecked && c.t >= BLOCK_STOP) {
        c.blockChecked = true;
        if (MODEL.COINS[c.kind].t > GATE_CLEAR) {
          c.t = BLOCK_STOP; c.stage = 'blocked';
          if (state.phase === 'experiment' && state.chapter === 0) state.expStep = Math.max(state.expStep, 1);
          return;
        }
      }
      if (c.t >= ST.coil && state.verdict == null) {
        const r = compare(c.kind);
        state.verdict = r.verdict; state.diff = r.diff; state.threshold = r.threshold;
        if (state.phase === 'experiment' && state.chapter === 1) {
          state.expStep = Math.max(state.expStep, r.verdict === 'pass' ? 1 : 2);
        }
      }
      if (c.t >= ST.gate) {
        const accept = !has('gate') || (state.verdict === 'pass' && state.power && has('solenoid'));
        c.stage = accept ? 'accepted' : 'rejected';
        c.t = ST.gate;
      }
    } else if (c.stage === 'accepted' || c.stage === 'rejected') {
      c.t += k * .62 * sp;
      if (c.t >= 1) {
        c.t = 1;
        const ok = c.stage === 'accepted';
        c.stage = ok ? 'done-accepted' : 'done-rejected';
        state.lastResult = ok ? 'accepted' : 'rejected';
        if (ok) { if (has('counter')) state.acceptCount++; } else state.rejectCount++;
        state.gate = ok ? 1 : 0;
        if (state.phase === 'experiment' && state.chapter === 2) {
          state.expStep = Math.max(state.expStep, ok ? 1 : (state.power ? 2 : 3));
        }
      }
    } else if (c.stage === 'returning') {
      c.t -= k * .9 * sp;
      if (c.t <= 0) { c.t = 0; c.stage = 'returned'; c.rt = 0; }
    } else if (c.stage === 'returned') {
      c.rt = (c.rt || 0) + k * 1.5;
      if (c.rt >= .55) {
        c.rt = .55; c.stage = 'done-returned';
        state.returnCount++; state.lastResult = 'returned';
      }
    }
  }

  function freeview() {
    Object.assign(state, initial());
    state.placed = MODULES.map((m) => m.id);
    state.completed = [true, true, true];
    state.chapter = CHAPTERS.length - 1;
    state.phase = 'lab';
    state.sample = 'yuan'; state.sensitivity = 6; state.power = true;
    state.threshold = thresholdOf();
    return { ok: true, kind: 'freeview', message: '已装完整机，进入自由实验：投币、换样币、调灵敏度、断电试 fail-safe。' };
  }
  function restart() {
    Object.assign(state, initial());
    return { ok: true, kind: 'restart', message: '新的装配开始了——把底板放上工作台。' };
  }

  return { state, current, select, place, undo, experiment, answer, next,
    insert, pressReturn, setSensitivity, setSample, setPower, toggleSlow, advance,
    compare, freeview, restart, resetCoin, COIN_KEYS };
}

/* ==== coin-comparator-lab/main.mjs ==== */
/* 比较式投币器 · 接线（规则在 logic.mjs，几何在 model.mjs，文案在 manifest.mjs） */
const game = createGame();
const state = game.state;
const CH = MANIFEST.chapters;
const MODS = MANIFEST.modules;
const $ = (s) => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const lab = mountLab(MANIFEST);
const stage = createStage({
  host: document.getElementById('viewport'),
  stageEl: document.getElementById('stage'),
  world: MODEL.world,
  modules: MODS,
  model: MODEL,
  config: MANIFEST.scene,
  getState: () => state,
  nextModule: () => game.current(),
  canDrag: () => state.phase === 'build' && !!state.selected,
  targetAlways: () => true,
  onDrop: (id, onTarget) => act('place', onTarget),
  onPickKey: (key) => {
    if (['sampleHolder', 'sampleCoin'].includes(key) && state.placed.includes('sample')) stage.fitCamera('sample');
    else if (['coil', 'board', 'pot'].includes(key) && state.placed.includes('coil')) stage.fitCamera('coil');
    else if (['gate', 'solenoid', 'counter', 'cashbox'].includes(key) && state.placed.includes('gate')) stage.fitCamera('gate');
    else if (['entry', 'returnBtn', 'runway'].includes(key)) stage.fitCamera('entry');
    else stage.fitCamera('all');
  },
  tick: (dt) => tick(dt),
});
lab.attached3d = true;
lab.stage = stage;
const view = stage.view;
view.cut = true;
const mech = MODEL.mech;

let lastStage = '';
let lastResult = '';

/* ---------- 每一帧：推进币、活门、计数 ---------- */
function tick(dt) {
  mech.now += dt * 1000;
  game.advance(dt);
  const c = state.coin;
  const stageNow = c ? c.stage : '';
  if (stageNow !== lastStage) {
    lastStage = stageNow;
    if (stageNow === 'blocked') {
      const spec = MODEL.COINS[c.kind];
      say(`厚度门挡住：${spec.name} 厚 ${spec.t.toFixed(2)} mm，门缝只有 2.6 mm。点「按退币」把它推回去。`, 'error');
    }
  }
  if (state.lastResult && state.lastResult !== lastResult) {
    lastResult = state.lastResult;
    if (lastResult === 'accepted') {
      if (!state.placed.includes('coil')) {
        say('币顺着币道落进接币盒。这一关只验币道和厚度门，比较头还没装。', 'success');
      } else if (!state.placed.includes('gate')) {
        const pass = state.verdict === 'pass';
        say(pass
          ? `比较器判合格（差值 ${state.diff} ≤ 门限 ${state.threshold}）；这一关还没装活门，币先落进接币盒。`
          : `比较器判不合格（差值 ${state.diff} > 门限 ${state.threshold}）；活门还没装，币暂时也落进接币盒——装上活门后才会被分开。`, pass ? 'success' : 'error');
      } else {
        say(`通过！活门摆向接受位，币落进接币盒，计数 +1。差值 ${state.diff} 小于门限 ${state.threshold}。`, 'success');
      }
    } else if (lastResult === 'rejected') say(state.power ? `退回：差值 ${state.diff} 超过门限 ${state.threshold}，弹簧把活门按在退币位。` : '断电：比较器不工作，弹簧把活门按在退币位，币滑进退币杯。', state.power ? 'error' : 'success');
    else if (lastResult === 'returned') say('退币按钮把币推回入口，币掉进退币杯。', 'success');
  }
  lastResult = state.lastResult;
  updateReadout();
}

function say(text, kind = '') {
  lab.state.feedback = text;
  lab.state.feedbackKind = kind;
  const fb = document.getElementById('feedback');
  if (fb) {
    fb.textContent = text;
    fb.className = 'feedback' + (kind ? ' ' + kind : '');
  }
}
function updateReadout() {
  const verdict = state.verdict;
  const c = state.coin;
  labelVerdict = !c ? '待投币'
    : c.stage === 'blocked' ? '厚度门阻挡'
    : c.stage === 'done-accepted' ? '接受'
    : c.stage === 'done-rejected' ? '退回'
    : c.stage === 'done-returned' ? '已退币'
    : verdict === 'pass' ? '合格'
    : verdict === 'fail' ? '不合格'
    : verdict === 'off' ? '断电容限'
    : verdict === 'none' ? '缺比较头'
    : '比较中';
  const gateText = !state.placed.includes('gate') ? '未装'
    : state.gate > .8 ? '接受位' : state.gate > .08 ? '动作中' : '退币位';
  const sampleText = state.placed.includes('sample') ? (state.sample === 'yuan' ? '1 元' : '游戏币') : '—';
  const signalText = verdict === 'pass' || verdict === 'fail'
    ? `${state.diff} / 门限 ${state.threshold}`
    : verdict === 'off' ? '断电' : verdict === 'none' ? '缺模块' : '—';
  lab.paint({
    sample: sampleText,
    signal: signalText,
    verdict: labelVerdict,
    gate: gateText,
    count: state.placed.includes('counter') ? state.acceptCount + ' 枚' : '—',
  });
}
let labelVerdict = '待投币';

/* ---------- 教练面板（按阶段给不同面板） ---------- */
lab.task(({ chapter: ch, chapterIndex: i, phase }) => {
  const next = game.current();
  const sel = MODS.find((m) => m.id === state.selected);
  const undoBtn = `<div class="sub"><button id="undo" ${MODS.find((m) => m.id === state.placed.at(-1))?.chapter === state.chapter ? '' : 'disabled'}>撤回一步</button></div>`;
  const slowBtn = `<button class="action" id="slow">${state.slow ? '恢复常速' : '慢放 ×0.3'}</button>`;
  const sensHtml = !state.placed.includes('board') ? '' : `<label class="labctl">灵敏度 <output id="sens-out">${state.sensitivity}/10 · 门限 ${state.threshold}</output>
    <input id="sens" type="range" min="0" max="10" step="1" value="${state.sensitivity}"></label>`;
  const status = `<p class="note">当前样币：${state.sample === 'yuan' ? '1 元' : '游戏币'} · 电源：${state.power ? '接通' : '断开'} · 已收 ${state.placed.includes('counter') ? state.acceptCount : '—'} 枚</p>`;

  if (phase === 'build') {
    return {
      html: `<p class="label">现在要装</p><h3>${next ? next.name : ''}</h3><p>${next ? next.tip : ''}</p>
        <div class="note">${sel ? '已拿起：' + sel.name : '从下方零件盒选择一块模块'}</div>
        <button class="primary action" id="place" ${sel ? '' : 'disabled'}>装入当前模块</button>
        ${undoBtn}`,
      bind(root) {
        root.querySelector('#place').onclick = () => act('place');
        root.querySelector('#undo').onclick = () => act('undo');
      },
    };
  }

  if (phase === 'experiment' && state.chapter === 0) {
    return {
      html: `<p class="label">模块已归位，先让币走一遍</p><h3>${ch.exp}</h3><p>${ch.expText}</p>
        <div class="labgrid">
          <button id="ins-yuan">投 1 元</button>
          <button id="ins-washer">投厚垫圈</button>
          <button id="return">按退币</button>
          <button id="to-quiz" class="primary">看完现象，去答题</button>
        </div>
        ${slowBtn}
        ${status}
        <p class="note">${state.expStep >= 2 ? '已经试过：厚度门挡住厚币，退币按钮能把它推回去。' : '先投厚垫圈，看它停在哪；再按退币。'}</p>`,
      bind(root) {
        root.querySelector('#ins-yuan').onclick = () => act('insert', 'yuan');
        root.querySelector('#ins-washer').onclick = () => act('insert', 'washer');
        root.querySelector('#return').onclick = () => act('pressReturn');
        root.querySelector('#to-quiz').onclick = () => act('experiment');
        root.querySelector('#slow').onclick = () => act('toggleSlow');
      },
    };
  }

  if (phase === 'experiment' && state.chapter === 1) {
    return {
      html: `<p class="label">比较头装好了，先看它怎么判</p><h3>${ch.exp}</h3><p>${ch.expText}</p>
        <div class="labgrid">
          <button id="ins-yuan">投 1 元</button>
          <button id="ins-token">投游戏币</button>
          <button id="ins-jiao">投 5 角</button>
          <button id="ins-fake">投铜章</button>
          <button id="swap">${state.sample === 'yuan' ? '样币换游戏币' : '样币换 1 元'}</button>
          <button id="return">按退币</button>
          <button id="to-quiz" class="primary">看完现象，去答题</button>
        </div>
        ${sensHtml}${slowBtn}${status}
        <p class="note">${state.expStep >= 2 ? '5 角因直径差被拒；铜章因材质差落在门限附近。转灵敏度看它的判定翻转。' : '1 元应与样币几乎零差；再试 5 角和铜章。'}</p>`,
      bind(root) {
        root.querySelector('#ins-yuan').onclick = () => act('insert', 'yuan');
        root.querySelector('#ins-token').onclick = () => act('insert', 'token');
        root.querySelector('#ins-jiao').onclick = () => act('insert', 'jiao');
        root.querySelector('#ins-fake').onclick = () => act('insert', 'fake');
        root.querySelector('#swap').onclick = () => act('setSample', state.sample === 'yuan' ? 'token' : 'yuan');
        root.querySelector('#return').onclick = () => act('pressReturn');
        root.querySelector('#to-quiz').onclick = () => act('experiment');
        root.querySelector('#slow').onclick = () => act('toggleSlow');
        bindSens(root);
      },
    };
  }

  if (phase === 'experiment') {
    return {
      html: `<p class="label">最后一步：把判断变成动作</p><h3>${ch.exp}</h3><p>${ch.expText}</p>
        <div class="labgrid">
          <button id="ins-yuan">投 1 元</button>
          <button id="ins-jiao">投 5 角</button>
          <button id="return">按退币</button>
          <button id="power">${state.power ? '断开电源' : '接通电源'}</button>
          <button id="to-quiz" class="primary">看完现象，去答题</button>
        </div>
        ${slowBtn}${status}
        <p class="note">${state.expStep >= 3 ? '好币接受、坏币退回、断电也退回——fail-safe 已验证。' : '先投 1 元看接受与计数，再投 5 角看退币，最后断电再投 1 元。'}</p>`,
      bind(root) {
        root.querySelector('#ins-yuan').onclick = () => act('insert', 'yuan');
        root.querySelector('#ins-jiao').onclick = () => act('insert', 'jiao');
        root.querySelector('#return').onclick = () => act('pressReturn');
        root.querySelector('#power').onclick = () => act('setPower', !state.power);
        root.querySelector('#to-quiz').onclick = () => act('experiment');
        root.querySelector('#slow').onclick = () => act('toggleSlow');
      },
    };
  }

  if (phase === 'quiz') {
    return {
      html: `<p class="label">看一看，想一想</p><h3>${ch.q}</h3>
        <div class="options">${ch.options.map((o, k) => `<button data-opt="${k}"><b>${String.fromCharCode(65 + k)}</b>${o}</button>`).join('')}</div>
        <p class="note" style="margin-top:10px">答错不会清空进度，实验可以再做一遍。</p>`,
    };
  }

  if (phase === 'checkpoint') {
    return {
      html: `<div class="badge" aria-hidden="true">✓</div><p class="label">新发现徽章</p><h3>${ch.badge}</h3>
        <p>${ch.why}</p>
        <button class="primary action" id="next">${i === CH.length - 1 ? '进入自由实验室' : '继续第 ' + (i + 2) + ' 关'}</button>`,
      bind(root) {
        root.querySelector('#next').onclick = () => act('next');
      },
    };
  }

  return {
    html: `<div class="labgrid">
        <button class="primary" id="ins-yuan">投 1 元</button>
        <button id="ins-token">投游戏币</button>
        <button id="ins-jiao">投 5 角</button>
        <button id="ins-fake">投铜章</button>
        <button id="ins-washer">投厚垫圈</button>
        <button id="return">按退币</button>
        <button id="power">${state.power ? '断开电源' : '接通电源'}</button>
        <button id="swap">${state.sample === 'yuan' ? '样币换游戏币' : '样币换 1 元'}</button>
        <button id="slow">${state.slow ? '恢复常速' : '慢放 ×0.3'}</button>
      </div>
      ${sensHtml}
      <div class="flow" id="flow">
        <span data-node="sample" class="${state.placed.includes('sample') ? '' : 'off'}">样币</span><i>›</i>
        <span data-node="coil" class="${state.placed.includes('coil') ? '' : 'off'}">双线圈</span><i>›</i>
        <span data-node="board" class="${state.placed.includes('board') ? '' : 'off'}">比较器</span><i>›</i>
        <span data-node="gate" class="${state.placed.includes('gate') ? '' : 'off'}">活门</span><i>›</i>
        <span data-node="counter" class="${state.placed.includes('counter') ? '' : 'off'}">计数</span>
      </div>
      <p class="note">投币后看币走的路：厚度门 → 测试线圈 → 活门。断电能验证 fail-safe：弹簧默认退币。</p>
      <div class="earned">${CH.map((c) => `<span>✓ ${c.badge}</span>`).join('')}</div>`,
    bind(root) {
      for (const [id, kind] of [['ins-yuan', 'yuan'], ['ins-token', 'token'], ['ins-jiao', 'jiao'], ['ins-fake', 'fake'], ['ins-washer', 'washer']]) {
        root.querySelector('#' + id).onclick = () => act('insert', kind);
      }
      root.querySelector('#return').onclick = () => act('pressReturn');
      root.querySelector('#power').onclick = () => act('setPower', !state.power);
      root.querySelector('#swap').onclick = () => act('setSample', state.sample === 'yuan' ? 'token' : 'yuan');
      root.querySelector('#slow').onclick = () => act('toggleSlow');
      bindSens(root);
    },
  };
});

function bindSens(root) {
  const el = root.querySelector('#sens');
  if (!el) return;
  el.oninput = () => {
    const res = game.setSensitivity(el.value);
    el.value = String(state.sensitivity);
    say(res.message, res.ok ? 'success' : 'error');
    const out = root.querySelector('#sens-out');
    if (out) out.textContent = `${state.sensitivity}/10 · 门限 ${state.threshold}`;
    updateReadout();
  };
}

/* ---------- 刷新显示态 ---------- */
const BOX = ['第一盒 · 币道与退币', '第二盒 · 样币与比较头', '第三盒 · 分选与计数'];
function refresh() {
  const labPhase = state.phase === 'lab';
  const s = lab.state;
  s.chapter = state.chapter;
  s.phase = state.phase;
  s.placed = state.placed;
  s.selected = state.selected;
  s.completed = state.completed;
  s.badges = labPhase ? CH.map((c) => c.badge) : state.completed.map((ok, k) => (ok ? CH[k].badge : null)).filter(Boolean);
  s.progress = { done: state.placed.length, total: MODS.length };
  s.cardsLocked = state.phase !== 'build';
  s.visible.readout = true;
  s.coach = labPhase
    ? { tag: '三个发现，全部解锁', title: '你的投币器，认币了', intro: '自由实验：投五种币、换样币、调灵敏度、断电试 fail-safe，或剖开看线圈与活门。' }
    : null;
  s.trayTitle = labPhase ? '你的装配记录' : BOX[state.chapter];
  s.trayHint = labPhase ? '12 块模块，拼成一台会认币的机器' : '点选模块，再拖到蓝色位置';
  s.stageHint = labPhase
    ? '投币、换样币、调灵敏度，或者断开电源看弹簧怎么退币。'
    : state.phase === 'build'
    ? '选一块模块，把它放到蓝色轮廓里。'
    : state.phase === 'experiment'
    ? '这一段已拼好，亲手做一次实验。'
    : '看清谁在动，再完成原理挑战。';
  lab.render();
  $('[data-tool="cut"]')?.setAttribute('aria-pressed', String(view.cut));
  updateReadout();
}

/* ---------- 动作 ---------- */
const ACTIONS = {
  select: (id) => game.select(id),
  place: (onTarget) => game.place(onTarget !== false),
  undo: () => game.undo(),
  experiment: () => game.experiment(),
  answer: (i) => game.answer(i),
  next: () => game.next(),
  insert: (kind) => game.insert(kind),
  pressReturn: () => game.pressReturn(),
  setSensitivity: (v) => game.setSensitivity(v),
  setSample: (kind) => game.setSample(kind),
  setPower: (on) => game.setPower(on),
  toggleSlow: () => game.toggleSlow(),
  restart: () => game.restart(),
  freeview: () => game.freeview(),
};

function act(name, ...args) {
  const res = ACTIONS[name](...args);
  if (!res) return res;
  lab.state.feedback = res.message || '';
  lab.state.feedbackKind = res.ok ? 'success' : 'error';
  if (res.learn) lab.setDiscovery(res.learn);
  if (res.ok) {
    if (res.kind === 'restart' || res.kind === 'freeview') {
      view.offsets.clear();
      view.cut = true;
      stage.setNavigation('rotate');
      lab.setDiscovery('');
      mech.gate = 0; mech.lastCount = 0;
      lastStage = ''; lastResult = '';
      stage.fitCamera('all');
    }
    if (res.kind === 'chapter') stage.fitCamera('all');
    if (res.kind === 'complete') { lab.celebrate(); stage.fitCamera('all'); }
    if (name === 'select' || ['insert', 'return', 'power', 'sample'].includes(res.kind)) {
      if (matchMedia('(max-width:760px)').matches) document.getElementById('stage').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
    }
  }
  refresh();
  return res;
}

/* ---------- 事件 ---------- */
lab.on('select', (id) => act('select', id));
lab.on('place', () => act('place'));
lab.on('undo', () => act('undo'));
lab.on('answer', (i) => act('answer', i));
lab.on('next', () => act('next'));
lab.on('restart', () => act('restart'));
lab.on('free', () => { act('freeview'); stage.fitCamera('all'); });
lab.on('tool', (id) => {
  if (id === 'cut') view.cut = $('[data-tool="cut"]')?.getAttribute('aria-pressed') === 'true';
  if (id === 'home') stage.fitCamera('all');
  if (id === 'rotate' || id === 'pan') stage.setNavigation(id);
  refresh();
});

view.cut = true;
$('[data-tool="cut"]')?.setAttribute('aria-pressed', 'true');
lab.state.feedback = '从下方零件盒选中「底板与机架」，开始第一步。';
refresh();
updateReadout();
stage.start();

</script>
</body>
</html>
